# HanLP tokenization service. Deploy with `bash scripts/manage.sh deploy hanlp`.
#
# Not part of the default reconcile because the image carries PyTorch and model
# weights (~2GB) and this node also hosts Elasticsearch. Products degrade to
# mx-common's built-in fallback segmenter when it is absent, and because search
# indices are rebuildable projections, enabling HanLP later is a reindex rather
# than a migration.
apiVersion: v1
kind: Service
metadata:
  name: mx-common-hanlp
  namespace: mx-common
  labels:
    app.kubernetes.io/name: mx-common-hanlp
spec:
  selector:
    app.kubernetes.io/name: mx-common-hanlp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-common-hanlp
  namespace: mx-common
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-common-hanlp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-common-hanlp
        app.kubernetes.io/part-of: mx-common
        mx-common.io/service: hanlp
      annotations:
        mx-common.io/hanlp-image-id: "MX_COMMON_HANLP_IMAGE_ID_PLACEHOLDER"
    spec:
      serviceAccountName: mx-common
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: MX_COMMON_HANLP_NODE_NAME_PLACEHOLDER
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-models
          image: mx-common-hanlp:local
          imagePullPolicy: Never
          command: ["/app/seed-models.sh"]
          env:
            - name: HANLP_HOME
              value: /models
            - name: HANLP_SEED_DIR
              value: /opt/hanlp-model-seed
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: hanlp
          image: mx-common-hanlp:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HANLP_HOME
              value: /models
            # Left at the default of one on purpose. A HanLP component is a
            # single mutable Python object, and server.py says as much: forward
            # passes stay serialized unless an operator has validated a specific
            # model as thread-safe. Nobody has. Throughput here comes from
            # batching -- many texts in one pass -- which needs no extra slot,
            # so raising this would buy nothing and risk concurrent mutation of
            # shared model state.
            - name: MAX_CONCURRENT_INFERENCES
              value: "1"
            # A coalesced batch of 64 takes materially longer than one text; the
            # queue must outlast it or callers see 429 for work that succeeded.
            - name: INFERENCE_QUEUE_TIMEOUT_SECONDS
              value: "30"
            - name: MAX_BATCH_TEXTS
              value: "256"
            - name: MAX_BODY_BYTES
              value: "4194304"
          # Model load can take minutes on a cold volume. The startup probe
          # keeps liveness from restarting it while readiness holds it out of
          # service until the tokenizer has actually loaded.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Sized for bulk rebuilds, which are the only workload that saturates
          # this service. A batch is one PyTorch forward pass and scales across
          # intra-op threads, so a 2-core ceiling left a 128-thread host mostly
          # idle while a rebuild ran for hours. Requests stay small: outside a
          # rebuild this pod is nearly idle and must not reserve a node.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "16"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mx-common-hanlp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-common-hanlp-models
  namespace: mx-common
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
