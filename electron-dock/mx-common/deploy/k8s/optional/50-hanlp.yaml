# HanLP tokenization service. Opt-in via `MX_COMMON_HANLP_ENABLED=1`.
#
# Not part of the default reconcile because the image carries PyTorch and model
# weights (~2GB) and this node also hosts Elasticsearch. Products degrade to
# mx-common's built-in fallback segmenter when it is absent, and because search
# indices are rebuildable projections, enabling HanLP later is a reindex rather
# than a migration.
apiVersion: v1
kind: Service
metadata:
  name: mx-common-hanlp
  namespace: mx-common
  labels:
    app.kubernetes.io/name: mx-common-hanlp
spec:
  selector:
    app.kubernetes.io/name: mx-common-hanlp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-common-hanlp
  namespace: mx-common
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-common-hanlp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-common-hanlp
        app.kubernetes.io/part-of: mx-common
        mx-common.io/service: hanlp
    spec:
      serviceAccountName: mx-common
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hanlp
          image: mx-common-hanlp:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HANLP_HOME
              value: /models
          # Model load can take minutes on a cold volume. A generous
          # failureThreshold on readiness (rather than a long liveness delay)
          # keeps the pod out of rotation while loading without restart loops.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mx-common-hanlp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-common-hanlp-models
  namespace: mx-common
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
