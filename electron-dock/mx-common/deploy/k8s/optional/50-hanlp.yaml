# HanLP tokenization service. Deploy with `bash scripts/manage.sh deploy hanlp`.
#
# Not part of the default reconcile because the image carries PyTorch and model
# weights (~2GB) and this node also hosts Elasticsearch. Products degrade to
# mx-common's built-in fallback segmenter when it is absent, and because search
# indices are rebuildable projections, enabling HanLP later is a reindex rather
# than a migration.
apiVersion: v1
kind: Service
metadata:
  name: mx-common-hanlp
  namespace: mx-common
  labels:
    app.kubernetes.io/name: mx-common-hanlp
spec:
  selector:
    app.kubernetes.io/name: mx-common-hanlp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-common-hanlp
  namespace: mx-common
spec:
  replicas: 1
  progressDeadlineSeconds: 3300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-common-hanlp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-common-hanlp
        app.kubernetes.io/part-of: mx-common
        mx-common.io/service: hanlp
      annotations:
        mx-common.io/hanlp-image-id: "MX_COMMON_HANLP_IMAGE_ID_PLACEHOLDER"
    spec:
      serviceAccountName: mx-common
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: MX_COMMON_HANLP_NODE_NAME_PLACEHOLDER
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-models
          image: mx-common-hanlp:local
          imagePullPolicy: Never
          command: ["/app/seed-models.sh"]
          env:
            - name: HANLP_HOME
              value: /models
            - name: HANLP_SEED_DIR
              value: /opt/hanlp-model-seed
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: hanlp
          image: mx-common-hanlp:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HANLP_HOME
              value: /models
            # Load/warm model processes one at a time, then serve concurrently.
            # Preserve five runtime workers (3 threads each, one interactive
            # reserve) while increasing peak memory headroom. Without this cap
            # the 32Gi / 16 CPU planner would add model copies up to 16 workers.
            # This is a runtime cap, not the serial model-loading mechanism.
            - name: MAX_CONCURRENT_INFERENCES
              value: "5"
            #
            # A coalesced batch of 64 takes materially longer than one text; the
            # queue must outlast it or callers see 429 for work that succeeded.
            - name: INFERENCE_QUEUE_TIMEOUT_SECONDS
              value: "30"
            - name: MAX_BATCH_TEXTS
              value: "256"
            - name: MAX_BODY_BYTES
              value: "4194304"
          # Model load can take minutes on a cold volume. The startup probe
          # keeps liveness from restarting it while readiness holds it out of
          # service until every worker has loaded and warmed up its model.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            # Five serial model loads retain the old 600s allowance per model.
            # This is a failure ceiling, not a delay when warm-up finishes early.
            failureThreshold: 300
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Memory limit is a ceiling, not preallocated/resident memory.
          # Five workers exceeded 8Gi; a killed process alone held 5.57Gi RSS.
          # At 32Gi the kernel still OOM-killed workers 35 times in under three
          # days, so a larger limit alone does not bound them. server.py now
          # recycles an idle worker above 60% of its slice (about 3.8Gi of
          # ~6.3Gi here) and caps each forward pass at 20,000 characters; the
          # limit stays as burst headroom. /health reports residentBytes,
          # recycledWorkers and replacedWorkers (unplanned exits) to confirm it.
          # The request covers the five workers' planned budget (5 x 1.5Gi plus
          # the front), so node-pressure eviction no longer sees a pod running
          # an order of magnitude above a 1Gi request.
          resources:
            requests:
              cpu: 500m
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mx-common-hanlp-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-common-hanlp-models
  namespace: mx-common
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
