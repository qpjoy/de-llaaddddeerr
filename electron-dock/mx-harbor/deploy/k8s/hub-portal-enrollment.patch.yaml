# Compatibility patch only; current Hub deployment already includes these optional mounts.
# Normal Harbor deploy never applies this patch or restarts Hub.
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            - name: MX_INSIGHT_HARBOR_SSO_PROFILE
              value: /run/harbor-portal/profile.json
            - name: MX_INSIGHT_HARBOR_GATEWAY_TOKEN_FILE
              value: /run/harbor-portal/gateway-token
          volumeMounts:
            - name: harbor-portal
              mountPath: /run/harbor-portal
              readOnly: true
      volumes:
        - name: harbor-portal
          secret:
            secretName: mx-harbor-portal
            optional: true
            defaultMode: 288
            items:
              - key: profile.json
                path: profile.json
              - key: gateway-token
                path: gateway-token
