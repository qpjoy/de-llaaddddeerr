# MX Insight Hub — domestic public edge (方案 B: single host, path split)
# ---------------------------------------------------------------------------
# Topology
#   Internet ─443/TLS─► this edge ─internal net─► 10.88.88.88:{18150,18151}
#
#   /api/v1/**   → 18150  public data API      (open to the internet)
#   /admin/**    → 18151  Admin console SPA     (WireGuard users only)
#   /internal/** → 18151  Admin management API  (WireGuard users only)
#   /health**    → 18151  Admin health (used by the console)
#
# Two different IPs are involved — do not mix them up:
#   * 10.89.0.0/16   admin USERS' WireGuard source IPs → allowlisted below.
#   * 10.88.0.1      THIS edge's internal IP → allowlist it on the 10.88.88.88
#                    host firewall so the edge may reach 18150 AND 18151.
#
# The admin listener only has a static token; per the project's own trust doc
# (docs/architecture/trust-runtime-boundaries.md) the public host must never
# wildcard-proxy it — hence the allow/deny gate on every admin location.
# ---------------------------------------------------------------------------

upstream mx_insight_public { server 10.88.88.88:18150; keepalive 16; }
upstream mx_insight_admin  { server 10.88.88.88:18151; keepalive 16; }

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name hub.minsight-ai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.minsight-ai.com;

    ssl_certificate     /etc/letsencrypt/live/hub.minsight-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.minsight-ai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MXIH:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;          # search payloads are small JSON
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ---------- Public data plane (open) ----------
    location /api/v1/ {
        proxy_pass http://mx_insight_public;
        proxy_read_timeout 60s;       # Night-All upstream caps at ~30s
    }

    # ---------- Admin plane (WireGuard users only) ----------
    # Reuse this list on every admin location. If a fronting proxy/CDN is ever
    # added, switch to the real_ip module so $remote_addr is the true client.
    location /admin/ {
        allow 10.89.0.0/16;
        deny  all;
        proxy_pass http://mx_insight_admin/;   # trailing / strips the /admin/ prefix
    }
    location = /admin { return 302 /admin/; }

    location /internal/v1/ {
        allow 10.89.0.0/16;
        deny  all;
        proxy_pass http://mx_insight_admin;    # no strip: /internal/v1/** passes through
    }

    location /health {
        allow 10.89.0.0/16;
        deny  all;
        proxy_pass http://mx_insight_admin;    # console reads live/ready/dependencies
    }

    # ---------- Root ----------
    # Send humans to the console; swap for a public landing page if preferred.
    location = / { return 302 /admin/; }
    location   / { return 404; }
}
