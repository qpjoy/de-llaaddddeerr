name: mx-insight-hub

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: mx_insight_hub
      POSTGRES_USER: mx_insight
      POSTGRES_PASSWORD: ${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}
    ports:
      - "127.0.0.1:15440:5432"
    volumes:
      - mx-insight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx_insight -d mx_insight_hub"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      additional_contexts:
        ui_design: ../../../mx-launcher/ui-design
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_HOST: 0.0.0.0
      MX_INSIGHT_PORT: 18180
      MX_INSIGHT_LISTENER_MODE: combined
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_ADMIN_TOKEN: ${MX_INSIGHT_ADMIN_TOKEN:-local-admin-change-me}
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      NIGHT_ALL_BASE_URL: ${NIGHT_ALL_BASE_URL:-http://host.docker.internal:18141}
      NIGHT_ALL_TIMEOUT_MS: ${NIGHT_ALL_TIMEOUT_MS:-30000}
      NIGHT_ALL_READY_MODE: ${NIGHT_ALL_READY_MODE:-ready_only}
      NIGHT_ALL_SERVICE_TOKEN: ${NIGHT_ALL_SERVICE_TOKEN:-}
      MX_INSIGHT_TG_MONITOR_DATABASE_URL: ${MX_INSIGHT_TG_MONITOR_DATABASE_URL:-}
      MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS: ${MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS:-60000}
      MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE: ${MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE:-1000}
      MX_INSIGHT_SERVER_FILE_ROOTS: ${MX_INSIGHT_SERVER_FILE_ROOTS:-{"shared-dir":"/shared_dir"}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18180:18180"
    # Match the read-only group on the operator-owned server-file directory.
    # This grants traversal/read access without chmod/chown on source files.
    group_add:
      - "${MX_INSIGHT_SERVER_FILE_GROUP_ID:-10}"
    volumes:
      - ${MX_INSIGHT_SERVER_FILE_HOST_PATH:-/shared_dir}:/shared_dir:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node server/migrate.mjs && exec node server/index.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18180/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ingest:
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_ADMIN_TOKEN: ${MX_INSIGHT_ADMIN_TOKEN:-local-admin-change-me}
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      NIGHT_ALL_BASE_URL: ${NIGHT_ALL_BASE_URL:-http://host.docker.internal:18141}
      NIGHT_ALL_TIMEOUT_MS: ${NIGHT_ALL_TIMEOUT_MS:-30000}
      NIGHT_ALL_READY_MODE: ${NIGHT_ALL_READY_MODE:-ready_only}
      NIGHT_ALL_SERVICE_TOKEN: ${NIGHT_ALL_SERVICE_TOKEN:-}
      MX_INSIGHT_TG_MONITOR_DATABASE_URL: ${MX_INSIGHT_TG_MONITOR_DATABASE_URL:-}
      MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS: ${MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS:-60000}
      MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE: ${MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE:-1000}
      MX_INSIGHT_TELEGRAM_SQLITE_PAGE_DELAY_MS: ${MX_INSIGHT_TELEGRAM_SQLITE_PAGE_DELAY_MS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "server/workers/ingest.mjs"]
    restart: unless-stopped

volumes:
  mx-insight-postgres:
