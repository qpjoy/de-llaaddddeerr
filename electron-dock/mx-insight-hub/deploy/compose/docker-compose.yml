name: mx-insight-hub

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: mx_insight_hub
      POSTGRES_USER: mx_insight
      POSTGRES_PASSWORD: ${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}
    ports:
      - "127.0.0.1:15440:5432"
    volumes:
      - mx-insight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx_insight -d mx_insight_hub"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      additional_contexts:
        ui_design: ../../../mx-launcher/ui-design
        # Dockerfile COPY --from=mx_common must resolve to this sibling source,
        # not an attempted docker.io/library/mx_common image pull.
        mx_common: ../../../mx-common
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_HOST: 0.0.0.0
      MX_INSIGHT_PORT: 18180
      MX_INSIGHT_LISTENER_MODE: combined
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_ADMIN_TOKEN: ${MX_INSIGHT_ADMIN_TOKEN:-local-admin-change-me}
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      MX_INSIGHT_RESERVATION_LEASE_MS: ${MX_INSIGHT_RESERVATION_LEASE_MS:-150000}
      NIGHT_ALL_BASE_URL: ${NIGHT_ALL_BASE_URL:-http://host.docker.internal:18141}
      NIGHT_ALL_TIMEOUT_MS: ${NIGHT_ALL_TIMEOUT_MS:-30000}
      NIGHT_ALL_READY_MODE: ${NIGHT_ALL_READY_MODE:-ready_only}
      NIGHT_ALL_SERVICE_TOKEN: ${NIGHT_ALL_SERVICE_TOKEN:-}
      MX_INSIGHT_JUSTONE_TOKEN: ${MX_INSIGHT_JUSTONE_TOKEN:-}
      MX_INSIGHT_JUSTONE_CONTRACT_VERIFIED: ${MX_INSIGHT_JUSTONE_CONTRACT_VERIFIED:-0}
      MX_INSIGHT_JUSTONE_TIMEOUT_MS: ${MX_INSIGHT_JUSTONE_TIMEOUT_MS:-120000}
      MX_INSIGHT_JUSTONE_FRESH_TTL_MS: ${MX_INSIGHT_JUSTONE_FRESH_TTL_MS:-60000}
      MX_INSIGHT_JUSTONE_STALE_TTL_MS: ${MX_INSIGHT_JUSTONE_STALE_TTL_MS:-604800000}
      MX_INSIGHT_JUSTONE_UNKNOWN_FINGERPRINT_COOLDOWN_MS: ${MX_INSIGHT_JUSTONE_UNKNOWN_FINGERPRINT_COOLDOWN_MS:-900000}
      MX_INSIGHT_JUSTONE_MAX_CONCURRENCY: ${MX_INSIGHT_JUSTONE_MAX_CONCURRENCY:-32}
      MX_INSIGHT_JUSTONE_MAX_CONSUMER_CONCURRENCY: ${MX_INSIGHT_JUSTONE_MAX_CONSUMER_CONCURRENCY:-8}
      MX_INSIGHT_JUSTONE_MAX_REQUESTS_PER_MINUTE: ${MX_INSIGHT_JUSTONE_MAX_REQUESTS_PER_MINUTE:-50}
      MX_INSIGHT_JUSTONE_CIRCUIT_FAILURES: ${MX_INSIGHT_JUSTONE_CIRCUIT_FAILURES:-3}
      MX_INSIGHT_JUSTONE_CIRCUIT_OPEN_MS: ${MX_INSIGHT_JUSTONE_CIRCUIT_OPEN_MS:-60000}
      MX_INSIGHT_JUSTONE_BILLING_JSON: ${MX_INSIGHT_JUSTONE_BILLING_JSON:-}
      MX_INSIGHT_TIKHUB_API_KEY: ${MX_INSIGHT_TIKHUB_API_KEY:-}
      MX_INSIGHT_TIKHUB_CONTRACT_VERIFIED: ${MX_INSIGHT_TIKHUB_CONTRACT_VERIFIED:-0}
      MX_INSIGHT_TIKHUB_SEARCH_CONTRACT_VERIFIED: ${MX_INSIGHT_TIKHUB_SEARCH_CONTRACT_VERIFIED:-0}
      MX_INSIGHT_TIKHUB_USER_ACTIVITY_CONTRACT_VERIFIED: ${MX_INSIGHT_TIKHUB_USER_ACTIVITY_CONTRACT_VERIFIED:-0}
      MX_INSIGHT_TIKHUB_SEARCH_CANARY_CONSUMER_IDS: ${MX_INSIGHT_TIKHUB_SEARCH_CANARY_CONSUMER_IDS:-}
      MX_INSIGHT_TIKHUB_BASE_URL: ${MX_INSIGHT_TIKHUB_BASE_URL:-https://api.tikhub.io}
      MX_INSIGHT_TIKHUB_TIMEOUT_MS: ${MX_INSIGHT_TIKHUB_TIMEOUT_MS:-30000}
      MX_INSIGHT_TIKHUB_FRESH_TTL_MS: ${MX_INSIGHT_TIKHUB_FRESH_TTL_MS:-86400000}
      MX_INSIGHT_TIKHUB_STALE_TTL_MS: ${MX_INSIGHT_TIKHUB_STALE_TTL_MS:-2592000000}
      MX_INSIGHT_TIKHUB_SEARCH_FRESH_TTL_MS: ${MX_INSIGHT_TIKHUB_SEARCH_FRESH_TTL_MS:-300000}
      MX_INSIGHT_TIKHUB_SEARCH_STALE_TTL_MS: ${MX_INSIGHT_TIKHUB_SEARCH_STALE_TTL_MS:-86400000}
      MX_INSIGHT_TIKHUB_SEARCH_MAX_ENRICH_ITEMS: ${MX_INSIGHT_TIKHUB_SEARCH_MAX_ENRICH_ITEMS:-20}
      MX_INSIGHT_TIKHUB_SEARCH_ENRICH_CONCURRENCY: ${MX_INSIGHT_TIKHUB_SEARCH_ENRICH_CONCURRENCY:-2}
      MX_INSIGHT_TIKHUB_UNKNOWN_FINGERPRINT_COOLDOWN_MS: ${MX_INSIGHT_TIKHUB_UNKNOWN_FINGERPRINT_COOLDOWN_MS:-900000}
      MX_INSIGHT_TIKHUB_MAX_CONCURRENCY: ${MX_INSIGHT_TIKHUB_MAX_CONCURRENCY:-8}
      MX_INSIGHT_TIKHUB_MAX_CONSUMER_CONCURRENCY: ${MX_INSIGHT_TIKHUB_MAX_CONSUMER_CONCURRENCY:-8}
      MX_INSIGHT_TIKHUB_MAX_REQUESTS_PER_MINUTE: ${MX_INSIGHT_TIKHUB_MAX_REQUESTS_PER_MINUTE:-50}
      MX_INSIGHT_TIKHUB_CIRCUIT_FAILURES: ${MX_INSIGHT_TIKHUB_CIRCUIT_FAILURES:-3}
      MX_INSIGHT_TIKHUB_CIRCUIT_OPEN_MS: ${MX_INSIGHT_TIKHUB_CIRCUIT_OPEN_MS:-60000}
      MX_INSIGHT_TIKHUB_BILLING_JSON: ${MX_INSIGHT_TIKHUB_BILLING_JSON:-}
      MX_INSIGHT_EXTERNAL_MEDIA_MAX_REQUESTS: ${MX_INSIGHT_EXTERNAL_MEDIA_MAX_REQUESTS:-1200}
      MX_INSIGHT_EXTERNAL_MEDIA_WINDOW_MS: ${MX_INSIGHT_EXTERNAL_MEDIA_WINDOW_MS:-60000}
      MX_INSIGHT_EXTERNAL_MEDIA_CONSUMER_CONCURRENCY: ${MX_INSIGHT_EXTERNAL_MEDIA_CONSUMER_CONCURRENCY:-16}
      MX_INSIGHT_EXTERNAL_MEDIA_GLOBAL_CONCURRENCY: ${MX_INSIGHT_EXTERNAL_MEDIA_GLOBAL_CONCURRENCY:-32}
      MX_INSIGHT_EXTERNAL_MEDIA_CACHE_BYTES: ${MX_INSIGHT_EXTERNAL_MEDIA_CACHE_BYTES:-134217728}
      MX_INSIGHT_EXTERNAL_MEDIA_CACHE_ENTRIES: ${MX_INSIGHT_EXTERNAL_MEDIA_CACHE_ENTRIES:-2048}
      MX_INSIGHT_EXTERNAL_MEDIA_CACHE_TTL_MS: ${MX_INSIGHT_EXTERNAL_MEDIA_CACHE_TTL_MS:-3600000}
      MX_INSIGHT_TG_MONITOR_DATABASE_URL: ${MX_INSIGHT_TG_MONITOR_DATABASE_URL:-}
      MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS: ${MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS:-60000}
      MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE: ${MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE:-1000}
      MX_COMMON_SEGMENTER: ${MX_COMMON_SEGMENTER:-}
      MX_COMMON_HANLP_URL: ${MX_COMMON_HANLP_URL:-}
      MX_INSIGHT_SERVER_FILE_ROOTS: ${MX_INSIGHT_SERVER_FILE_ROOTS:-{"shared-dir":"/shared_dir"}}
      MX_INSIGHT_AGENT_PROVIDERS: ${MX_INSIGHT_AGENT_PROVIDERS:-}
      MX_INSIGHT_AGENT_AUTO_MIGRATE: ${MX_INSIGHT_AGENT_AUTO_MIGRATE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18180:18180"
    # Match the read-only group on the operator-owned server-file directory.
    # This grants traversal/read access without chmod/chown on source files.
    group_add:
      - "${MX_INSIGHT_SERVER_FILE_GROUP_ID:-10}"
    volumes:
      - ${MX_INSIGHT_SERVER_FILE_HOST_PATH:-/shared_dir}:/shared_dir:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node server/migrate.mjs && exec node server/index.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18180/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ingest:
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_ADMIN_TOKEN: ${MX_INSIGHT_ADMIN_TOKEN:-local-admin-change-me}
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      NIGHT_ALL_BASE_URL: ${NIGHT_ALL_BASE_URL:-http://host.docker.internal:18141}
      NIGHT_ALL_TIMEOUT_MS: ${NIGHT_ALL_TIMEOUT_MS:-30000}
      NIGHT_ALL_READY_MODE: ${NIGHT_ALL_READY_MODE:-ready_only}
      NIGHT_ALL_SERVICE_TOKEN: ${NIGHT_ALL_SERVICE_TOKEN:-}
      MX_INSIGHT_TG_MONITOR_DATABASE_URL: ${MX_INSIGHT_TG_MONITOR_DATABASE_URL:-}
      MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS: ${MX_INSIGHT_EXTERNAL_PULL_INTERVAL_MS:-60000}
      MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE: ${MX_INSIGHT_EXTERNAL_PULL_BATCH_SIZE:-1000}
      MX_INSIGHT_TELEGRAM_SQLITE_PAGE_DELAY_MS: ${MX_INSIGHT_TELEGRAM_SQLITE_PAGE_DELAY_MS:-1000}
      MX_INSIGHT_PROVINCE_PAGE_DELAY_MS: ${MX_INSIGHT_PROVINCE_PAGE_DELAY_MS:-2000}
      MX_COMMON_SEGMENTER: ${MX_COMMON_SEGMENTER:-}
      MX_COMMON_HANLP_URL: ${MX_COMMON_HANLP_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "server/workers/ingest.mjs"]
    restart: unless-stopped

  # Optional local outbox -> Elasticsearch worker. It is kept behind an
  # explicit profile so the default Hub/login lifecycle never depends on
  # Elasticsearch. `scripts/manage.sh search up` enables this profile only
  # after the loopback search stack is reachable.
  projector:
    profiles: ["search"]
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_LISTENER_MODE: public
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      MX_COMMON_ELASTICSEARCH_URL: ${MX_COMMON_ELASTICSEARCH_URL:-}
      MX_COMMON_ELASTICSEARCH_TIMEOUT_MS: ${MX_COMMON_ELASTICSEARCH_TIMEOUT_MS:-10000}
      MX_COMMON_ELASTICSEARCH_REPLICAS: ${MX_COMMON_ELASTICSEARCH_REPLICAS:-0}
      MX_COMMON_SEGMENTER: ${MX_COMMON_SEGMENTER:-}
      MX_COMMON_HANLP_URL: ${MX_COMMON_HANLP_URL:-}
      MX_COMMON_HANLP_TOKEN: ${MX_COMMON_HANLP_TOKEN:-}
      MX_COMMON_HANLP_TIMEOUT_MS: ${MX_COMMON_HANLP_TIMEOUT_MS:-5000}
      MX_COMMON_HANLP_BATCH_TIMEOUT_MS: ${MX_COMMON_HANLP_BATCH_TIMEOUT_MS:-60000}
      MX_COMMON_SEGMENTER_CONCURRENCY: ${MX_COMMON_SEGMENTER_CONCURRENCY:-2}
      MX_COMMON_SEGMENTER_BATCH_SIZE: ${MX_COMMON_SEGMENTER_BATCH_SIZE:-16}
      MX_INSIGHT_EMBEDDING_DIMENSIONS: ${MX_INSIGHT_EMBEDDING_DIMENSIONS:-}
      MX_INSIGHT_EMBEDDING_MODEL: ${MX_INSIGHT_EMBEDDING_MODEL:-}
      MX_INSIGHT_AGENT_PROVIDERS: ${MX_INSIGHT_AGENT_PROVIDERS:-}
      MX_INSIGHT_EMBEDDING_PROVIDERS: ${MX_INSIGHT_EMBEDDING_PROVIDERS:-}
      MX_INSIGHT_AGENT_AUTO_MIGRATE: ${MX_INSIGHT_AGENT_AUTO_MIGRATE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "server/workers/projector.mjs"]
    restart: unless-stopped

  classifier:
    image: ${MX_INSIGHT_IMAGE:-mx-insight-hub:local}
    environment:
      MX_INSIGHT_LISTENER_MODE: public
      MX_INSIGHT_STORE: postgres
      DATABASE_URL: postgres://mx_insight:${MX_INSIGHT_POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/mx_insight_hub
      MX_INSIGHT_API_KEY_PEPPER: ${MX_INSIGHT_API_KEY_PEPPER:-local-pepper-change-me-at-least-32-bytes}
      MX_INSIGHT_AGENT_PROVIDERS: ${MX_INSIGHT_AGENT_PROVIDERS:-}
      MX_INSIGHT_AGENT_AUTO_MIGRATE: ${MX_INSIGHT_AGENT_AUTO_MIGRATE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "server/workers/classifier.mjs"]
    restart: unless-stopped

volumes:
  mx-insight-postgres:
