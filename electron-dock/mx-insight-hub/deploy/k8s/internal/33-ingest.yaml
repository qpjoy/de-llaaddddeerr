# Ingest worker: queued search results and Night-All backfill.
#
# Distinct from the projector because the two fail for different reasons and
# must be restartable independently. This worker needs PostgreSQL and Night-All;
# the projector needs Elasticsearch. Collapsing them would let a search outage
# stop ingestion, which is the one thing that must not stop -- a missed ingest
# is a permanent hole, while a missed projection is a reindex.
#
# hostNetwork, unlike the projector, because backfill calls Night-All on the
# host at 127.0.0.1:13141 exactly as the API planes do.
#
# No Service and no ingress: nothing calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-insight-hub-ingest
  namespace: mx-insight-hub
  labels:
    app.kubernetes.io/name: mx-insight-hub-ingest
    app.kubernetes.io/part-of: mx-insight-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-insight-hub-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-insight-hub-ingest
        app.kubernetes.io/part-of: mx-insight-hub
        mx-insight-hub.io/plane: worker
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: mx-insight-hub
      automountServiceAccountToken: false
      # Long enough to finish the page in flight and commit its cursor, so a
      # rollout costs at most a replayed page rather than a lost one.
      terminationGracePeriodSeconds: 90
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: projector
          image: mx-insight-hub:shadow
          imagePullPolicy: Never
          command: ["node", "server/workers/ingest.mjs"]
          envFrom:
            - configMapRef:
                name: mx-insight-hub-config
            # Model API keys, keyed by whatever `apiKeyEnv` each provider in
            # MX_INSIGHT_AGENT_PROVIDERS names. envFrom rather than explicit
            # entries so adding a provider never requires editing this file --
            # a key that silently fails to reach the pod is indistinguishable
            # from that provider being down.
            - secretRef:
                name: mx-insight-hub-model-keys
                optional: true
          env:
            - name: MX_INSIGHT_LISTENER_MODE
              value: public
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: DATABASE_URL
            - name: MX_INSIGHT_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_API_KEY_PEPPER
            - name: MX_INSIGHT_PROVIDER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_PROVIDER_MASTER_KEY
            - name: NIGHT_ALL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: NIGHT_ALL_SERVICE_TOKEN
            - name: NIGHT_ALL_EXPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: NIGHT_ALL_EXPORT_TOKEN
                  optional: true
            - name: MX_INSIGHT_TG_MONITOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_TG_MONITOR_DATABASE_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
