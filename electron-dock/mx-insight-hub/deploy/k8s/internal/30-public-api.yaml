apiVersion: v1
kind: Service
metadata:
  name: mx-insight-hub-public
  namespace: mx-insight-hub
  labels:
    app.kubernetes.io/name: mx-insight-hub-public
spec:
  selector:
    app.kubernetes.io/name: mx-insight-hub-public
  ports:
    - name: http
      port: 18150
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-insight-hub-public
  namespace: mx-insight-hub
spec:
  # hostNetwork binds a fixed host port, so at most one replica can run per node
  # and a rolling surge pod would collide on that port. Single node + Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-insight-hub-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-insight-hub-public
        app.kubernetes.io/part-of: mx-insight-hub
        mx-insight-hub.io/plane: public
    spec:
      # Share the host network namespace so the API reaches host-local Night-All at
      # 127.0.0.1:13141 and binds directly on the host (10.88.88.88:18150).
      # ClusterFirstWithHostNet keeps cluster DNS for the Postgres Service FQDN.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: mx-insight-hub
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Internal restart gate: host PostgreSQL and the saved HanLP service must be ready.
      initContainers:
        - name: wait-startup-dependencies
          image: mx-insight-hub:shadow
          imagePullPolicy: Never
          command: ["node", "server/ops/wait-startup-dependencies.mjs"]
          env:
            - name: MX_COMMON_HANLP_URL
              valueFrom:
                configMapKeyRef:
                  name: mx-insight-hub-config
                  key: MX_COMMON_HANLP_URL
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: mx-insight-hub:shadow
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18150
          envFrom:
            - configMapRef:
                name: mx-insight-hub-config
          env:
            - name: MX_INSIGHT_PORT
              value: "18150"
            - name: MX_INSIGHT_LISTENER_MODE
              value: public
            - name: MX_INSIGHT_AGENT_DOCKER_PROXY_SNAPSHOT
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_AGENT_DOCKER_PROXY_SNAPSHOT
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: DATABASE_URL
            - name: MX_INSIGHT_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_API_KEY_PEPPER
            - name: NIGHT_ALL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: NIGHT_ALL_SERVICE_TOKEN
            - name: MX_INSIGHT_JUSTONE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_JUSTONE_TOKEN
                  optional: true
            - name: MX_INSIGHT_TIKHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_TIKHUB_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Four API processes share the host port (server/core/api-processes.mjs):
          # each uses up to one core and a 768 MiB heap. The node has ample
          # capacity; requests stay modest because the processes idle near zero.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "6"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
