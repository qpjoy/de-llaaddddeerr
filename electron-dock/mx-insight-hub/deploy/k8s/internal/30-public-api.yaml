apiVersion: v1
kind: Service
metadata:
  name: mx-insight-hub-public
  namespace: mx-insight-hub
  labels:
    app.kubernetes.io/name: mx-insight-hub-public
spec:
  selector:
    app.kubernetes.io/name: mx-insight-hub-public
  ports:
    - name: http
      port: 18150
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-insight-hub-public
  namespace: mx-insight-hub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-insight-hub-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-insight-hub-public
        app.kubernetes.io/part-of: mx-insight-hub
        mx-insight-hub.io/plane: public
    spec:
      serviceAccountName: mx-insight-hub
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mx-insight-hub:shadow
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18150
          envFrom:
            - configMapRef:
                name: mx-insight-hub-config
          env:
            - name: MX_INSIGHT_PORT
              value: "18150"
            - name: MX_INSIGHT_LISTENER_MODE
              value: public
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: DATABASE_URL
            - name: MX_INSIGHT_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_API_KEY_PEPPER
            - name: NIGHT_ALL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: NIGHT_ALL_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
