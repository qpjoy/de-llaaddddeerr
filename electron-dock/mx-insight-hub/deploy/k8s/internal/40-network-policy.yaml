apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mx-insight-hub-default-ingress
  namespace: mx-insight-hub
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mx-insight-hub-public-ingress
  namespace: mx-insight-hub
spec:
  podSelector:
    matchLabels:
      mx-insight-hub.io/plane: public
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mx-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mx-internal-shadow
      ports:
        - protocol: TCP
          port: 18150
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mx-insight-hub-admin-ingress
  namespace: mx-insight-hub
spec:
  podSelector:
    matchLabels:
      mx-insight-hub.io/plane: admin
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mx-internal-shadow
      ports:
        - protocol: TCP
          port: 18151
