apiVersion: v1
kind: Service
metadata:
  name: mx-insight-hub-admin
  namespace: mx-insight-hub
  labels:
    app.kubernetes.io/name: mx-insight-hub-admin
spec:
  selector:
    app.kubernetes.io/name: mx-insight-hub-admin
  ports:
    - name: http
      port: 18151
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-insight-hub-admin
  namespace: mx-insight-hub
spec:
  # hostNetwork binds a fixed host port, so a rolling surge pod would collide on
  # that port. Single replica + Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-insight-hub-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-insight-hub-admin
        app.kubernetes.io/part-of: mx-insight-hub
        mx-insight-hub.io/plane: admin
    spec:
      # Share the host network namespace so the Admin API reaches host-local
      # Night-All at 127.0.0.1:13141 and binds directly on the host
      # (10.88.88.88:18151). ClusterFirstWithHostNet keeps cluster DNS for Postgres.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: mx-insight-hub
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The Internal landing directory is operator-owned by host group 10
        # (`wheel`). Add that group without changing host permissions. The
        # current node runtime does not support supplementalGroupsPolicy.
        supplementalGroups: [10]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: mx-insight-hub:shadow
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18151
          envFrom:
            - configMapRef:
                name: mx-insight-hub-config
            # Model API keys, keyed by whatever `apiKeyEnv` each provider in
            # MX_INSIGHT_AGENT_PROVIDERS names. envFrom rather than explicit
            # entries so adding a provider never requires editing this file --
            # a key that silently fails to reach the pod is indistinguishable
            # from that provider being down.
            - secretRef:
                name: mx-insight-hub-model-keys
                optional: true
          env:
            - name: MX_INSIGHT_PORT
              value: "18151"
            - name: MX_INSIGHT_LISTENER_MODE
              value: admin
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: DATABASE_URL
            - name: MX_INSIGHT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_ADMIN_TOKEN
            - name: MX_INSIGHT_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_API_KEY_PEPPER
            - name: NIGHT_ALL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: NIGHT_ALL_SERVICE_TOKEN
            - name: MX_INSIGHT_TG_MONITOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-insight-hub-secrets
                  key: MX_INSIGHT_TG_MONITOR_DATABASE_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Only the Admin plane may resolve operator-pasted server paths.
            # The public API and background workers never receive this mount.
            - name: server-files
              mountPath: /shared_dir
              readOnly: true
      volumes:
        - name: server-files
          hostPath:
            path: /shared_dir
            type: Directory
