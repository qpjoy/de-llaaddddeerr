# Optional, deliberately NOT included in internal/kustomization.yaml.
# Set the deployed Hub image; complete the initial reconciliation first.
# Unsuspend explicitly only after measuring its load and reviewing coverage.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mx-insight-hub-rss-reconciliation
  namespace: mx-insight-hub
spec:
  suspend: true
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3660
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: mx-insight-hub
            mx-insight-hub.io/plane: worker
        spec:
          restartPolicy: Never
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          serviceAccountName: mx-insight-hub
          automountServiceAccountToken: false
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rss
              image: mx-insight-hub:shadow
              imagePullPolicy: Never
              command: ["node", "server/ops/reconcile-rss-intent.mjs", "--apply"]
              envFrom:
                - configMapRef:
                    name: mx-insight-hub-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: mx-insight-hub-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
