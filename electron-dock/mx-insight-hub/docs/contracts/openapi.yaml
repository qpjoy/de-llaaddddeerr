        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable, serving_indexes_unavailable]
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive RFC3339 published/event-time lower bound.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Inclusive RFC3339 published/event-time upper bound. It must not be earlier than from.
          schema: { type: string, format: date-time }
        - name: includeCandidates
          in: query
          required: false
          description: Defaults to false. qualified (or true) adds qualified candidates; all includes all candidates.
          schema: { type: string, enum: ["false", "true", qualified, all], default: "false" }
        - name: minQualityScore
          in: query
          required: false
          description: Candidate quality threshold from 0 to 100; qualified defaults to 80.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: targetPerProvince
