    TelegramRecord:
      type: object
      additionalProperties: false
      required:
        - canonicalId
        - id
        - externalId
        - platform
        - objectType
        - contentType
        - title
        - text
        - url
        - author
        - relations
        - attributes
        - metrics
        - eventTime
        - collectedAt
        - editedAt
        - media
        - entities
        - links
        - lineage
        - sourceScope
        - dataVersion
      properties:
        canonicalId: { type: [string, "null"], format: uuid }
        id:
          type: string
          description: Stable external identity within the fixed Hub dataset.
        externalId:
          type: string
          description: Alias of id retained for data-search contract compatibility.
        platform: { type: string, const: telegram }
        objectType: { type: string, enum: [chat, message] }
        contentType: { type: [string, "null"] }
        title: { type: [string, "null"] }
        text: { type: [string, "null"] }
        url: { type: [string, "null"] }
        author:
          type: object
          additionalProperties: false
          required: [id, name, username]
          properties:
            id: { type: [string, "null"] }
            name: { type: [string, "null"] }
            username: { type: [string, "null"] }
        relations:
          type: object
          additionalProperties: false
          properties:
            chatId: { type: string }
            messageId: { type: string }
            replyToMessageId: { type: string }
            threadId: { type: string }
            groupedId: { type: string }
        attributes:
          type: object
          additionalProperties: false
          properties:
            username: { type: string }
            chatType: { type: string }
            memberCount: { type: number }
            isOutgoing: { type: boolean }
        metrics:
          type: object
          additionalProperties: false
          properties:
            likes: { type: number }
            comments: { type: number }
            shares: { type: number }
            views: { type: number }
            bookmarks: { type: number }
            members: { type: number }
        media:
          type: object
          additionalProperties: false
          properties:
            media_kind: { type: string }
            status: { type: string }
            telegram_id: { type: string }
            file_name: { type: string }
            extension: { type: string }
            mime_type: { type: string }
            size_bytes: { type: number }
        entities:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              type: { type: string }
              offset: { type: number }
              length: { type: number }
              url: { type: string }
              user_id: { type: number }
        links:
          type: array
          maxItems: 0
          description: >-
            Always empty in this contract version. Source link members remain
            private until their object fields have an explicit reviewed
            allowlist and versioned public schema.
          items: {}
        eventTime: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        lineage:
          type: object
          additionalProperties: false
          required: [datasetId, origin]
          properties:
            datasetId: { type: string, enum: [telegram.monitor.chats.v1, telegram.monitor.messages.v1, telegram.sqlite.chats.v1, telegram.sqlite.messages.v1] }
            origin: { type: string, enum: [hub-direct, hub-import] }
        sourceScope: { type: [string, "null"], enum: [monitor, sqlite, null] }
        chatKey:
          type: string
          description: Present for chat records; use as chatId to select the exact stored source.
        kind: { type: string, enum: [channel, group, unknown], description: Present for chat records. }
        dataVersion: { type: string }
    TelegramPageInfo:
      type: object
      additionalProperties: false
      required: [returnedCount, hasMore, nextCursor]
      properties:
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when hasMore is false.
    TelegramPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [contractVersion, sourceScope, filters, items, pageInfo]
          properties:
            contractVersion: { type: string, enum: [mx-insight-hub.data-products.telegram-chats.v1, mx-insight-hub.data-products.telegram-messages.v1] }
            sourceScope:
              type: object
              additionalProperties: false
              required: [selected, datasets]
              properties:
                selected: { type: string, enum: [all, monitor, sqlite] }
                datasets:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, enum: [telegram.monitor.chats.v1, telegram.monitor.messages.v1, telegram.sqlite.chats.v1, telegram.sqlite.messages.v1] }
            filters:
              type: object
              additionalProperties: false
              properties:
                kind: { type: string, enum: [all, channel, group, unknown] }
                query: { type: [string, "null"] }
                chatId: { type: [string, "null"] }
                from: { type: [string, "null"], format: date-time }
                to: { type: [string, "null"], format: date-time }
            chat: { $ref: "#/components/schemas/TelegramRecord" }
            items:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TelegramRecord"
            pageInfo:
              $ref: "#/components/schemas/TelegramPageInfo"
        requestId: { type: string }
  responses:
    AdminData:
      description: Admin-token-only operation result.
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              data: {}
              requestId: { type: string }
    TelegramPage:
      description: >-
        Strict customer-safe canonical projection. Raw rows, extensions,
        database/source lineage and provider-private values are omitted.
      headers:
        x-request-id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TelegramPageEnvelope"
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, requestId]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details:
                    description: Optional bounded machine-readable context for the stable error code.
              requestId: { type: string }
