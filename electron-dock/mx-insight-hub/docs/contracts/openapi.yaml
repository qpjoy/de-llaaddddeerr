  /data/public-opinion/regions/{regionCode}/items:
    get:
      operationId: listPublicOpinionRegionItems
      summary: List nationwide or province current canonical items without quality filtering.
      description: >-
        Requires both the public_opinion platform grant and the separate,
        non-default public_opinion.all_ingested.read capability. P1 accepts CN
        or one exact province code from the region catalog; Chinese aliases and
        city codes are rejected. visibility must be all_ingested, sort supports
        latest only, and from/to are required. Effective time is publishedAt
        when present and otherwise collectedAt; the fallback is used for
        filtering and ordering without rewriting publishedAt. The nationwide
        CN scope includes current safe items without an assigned province,
        while a province scope matches only that province.
        canonical_current_safe means the current, non-deleted, revision-fenced
        public projection: it includes formal and candidate items regardless of
        score, status or geography verification but excludes raw rows, revision
        history, provider/endpoint identities, credentials, strategy/run ids,
        quality flags and rejection reasons, model reasoning and internal
        lineage. Every returned item includes its safe quality summary. Each
        call and retry is independently metered; no Idempotency-Key is accepted.
      x-mx-allowed-query-fields: [visibility, sort, from, to, pageSize, cursor]
      x-mx-error-codes:
        "400": [invalid_region, invalid_visibility, invalid_sort, invalid_request, page_size_exceeded, invalid_cursor, unsupported_fields, all_ingested_scope_required]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted, capability_not_granted]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable, serving_indexes_unavailable]
      parameters:
        - name: regionCode
          in: path
          required: true
          description: CN or one exact ISO 3166-2:CN province code returned by the region catalog. Chinese aliases and city codes are not accepted.
          schema: { type: string, pattern: "^CN(?:-[A-Z]{2})?$" }
        - name: visibility
