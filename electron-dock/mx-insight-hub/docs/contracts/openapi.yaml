          minLength: 1
          maxLength: 8192
          description: HMAC-signed version-3 opaque nextCursor bound to the normalized query, filters, match mode, page size and bounded first-page analysis state; return unchanged.
    NightAllDataSearchEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/NightAllDataSearchPlatformResult"
        requestId: { type: string, format: uuid }
        traceId: { type: string }
    NightAllDataSearchPlatformEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/NightAllDataSearchPlatformResult"
        requestId: { type: string, format: uuid }
        traceId: { type: string }
    NightAllDataSearchPlatformResult:
      type: object
      additionalProperties: false
      required: [contractVersion, platform, query, items, pageInfo, status, warnings, meta]
      properties:
        contractVersion: { type: string, const: night-all.data-search.v1 }
        platform: { type: string, minLength: 1 }
        query: { type: string, minLength: 1 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/NightAllDataSearchItem"
        pageInfo:
          $ref: "#/components/schemas/NightAllDataSearchPageInfo"
        status: { type: string, enum: [ok, partial, failed] }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/NightAllDataSearchWarning"
        meta:
          $ref: "#/components/schemas/NightAllDataSearchMeta"
    NightAllDataSearchItem:
      type: object
      additionalProperties: false
      required:
        - id
        - externalId
        - platform
        - contentType
        - url
        - title
        - text
        - publishedAt
        - collectedAt
        - author
        - metrics
        - media
        - source
      properties:
        id: { type: string, minLength: 1 }
        externalId: { type: [string, "null"] }
        platform: { type: string, minLength: 1 }
        contentType: { type: [string, "null"] }
        url: { type: [string, "null"] }
        title: { type: [string, "null"] }
        text: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        author:
          type: object
          additionalProperties: false
          required: [id, name, avatarUrl]
          properties:
            id: { type: [string, "null"] }
            name: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"] }
        metrics:
          type: object
          additionalProperties: false
          required: [likes, comments, shares, views, bookmarks]
          properties:
            likes: { type: [number, "null"], minimum: 0 }
            comments: { type: [number, "null"], minimum: 0 }
            shares: { type: [number, "null"], minimum: 0 }
            views: { type: [number, "null"], minimum: 0 }
            bookmarks: { type: [number, "null"], minimum: 0 }
        media:
          type: object
          additionalProperties: false
          required: [coverUrl, images, videos]
          properties:
            coverUrl: { type: [string, "null"] }
            images:
              type: array
              items: { type: string }
            videos:
              type: array
              items: { type: string }
        source:
          type: object
          additionalProperties: false
          required: [provider, endpointId]
          description: >-
            Both fields are always present to preserve the strict Night-All-v1
            item contract. Generic Night-All-backed responses replace both
            private upstream labels with null. Stored Telegram search returns
            provider null and endpointId hub-canonical-search.
          properties:
            provider:
              oneOf:
                - { type: string, enum: [tikhub, rapidapi, justone] }
                - { type: "null" }
            endpointId: { type: [string, "null"] }
    NightAllDataSearchPageInfo:
      type: object
      additionalProperties: false
      required: [pageIndex, pageSize, returnedCount, hasMore, nextCursor, cursorType]
      properties:
        pageIndex: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 0, maximum: 100 }
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, "null"], maxLength: 8192, description: Opaque cursor for the next page; search callers return it unchanged. }
        cursorType: { type: string, enum: [opaque, none] }
    NightAllDataSearchWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    NightAllDataSearchMeta:
      type: object
      additionalProperties: false
      properties:
        capability: { type: string, const: search_posts }
        capabilityStatus: { type: string, enum: [declared, catalogued, ready, degraded, disabled] }
        paginationMode: { type: string, enum: [cursor, compound, page, offset, composite, none, unknown] }
        sourceProvider: { type: [string, "null"], minLength: 1 }
        endpointId: { type: [string, "null"], minLength: 1 }
        providerCalls: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
        error:
          $ref: "#/components/schemas/NightAllDataSearchError"
    NightAllDataSearchError:
      type: object
      additionalProperties: false
      required: [code, message, statusCode]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        statusCode: { type: integer, minimum: 400, maximum: 599 }
    RequestStatus:
      type: object
      required: [id, status]
      oneOf:
        - required: [platform]
          not: { required: [capability] }
        - required: [capability]
          not: { required: [platform] }
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        capability: { type: string }
        status: { type: string, enum: [reserved, committed, released, unknown] }
        units: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        sourceMode: { type: string, enum: [live, stale] }
        capturedAt: { type: string, format: date-time }
        reservedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    PublicOpinionProvince:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^CN-[A-Z]{2}$"
          description: Normalized ISO 3166-2:CN province-level code.
        name:
          type: string
          minLength: 1
          description: Normalized short Chinese display name.
    PublicOpinionOrigin:
      type: object
      additionalProperties: false
      required: [name, type, platform]
      properties:
        name: { type: [string, "null"], description: Reviewed public-facing source name, when available. }
        type: { type: [string, "null"], description: Reviewed source/content type, when available. }
        platform: { type: [string, "null"], description: Reviewed originating content platform, distinct from the public_opinion authorization platform. }
    PublicOpinionQuality:
      type: object
      additionalProperties: false
      required: [stage, status, score, threshold, geographyVerified]
      description: Hub-owned publication metadata returned only when candidate visibility is explicitly enabled.
      properties:
        stage: { type: string, enum: [formal, candidate] }
        status: { type: string, enum: [formal, pending, qualified, rejected, failed] }
        score: { type: [number, "null"], minimum: 0, maximum: 100 }
        threshold: { type: [number, "null"], minimum: 0, maximum: 100 }
        geographyVerified: { type: boolean }
    PublicOpinionLocation:
      type: object
      additionalProperties: false
      required: [label, type, country, countryCode, geoScope]
      description: Hub-normalized event location returned only with explicit candidate visibility when evidence is available.
      properties:
        label: { type: [string, "null"] }
        type: { type: [string, "null"], enum: [province, country, region, city, maritime, unknown, null] }
        country: { type: [string, "null"] }
        countryCode: { type: [string, "null"] }
        geoScope: { type: [string, "null"], enum: [province, multi_province, national, maritime, overseas, unknown, null] }
    PublicOpinionItem:
      type: object
      additionalProperties: false
      required: [id, title, summary, url, publishedAt, collectedAt, province, heatScore, origin]
      description: >-
        Strict customer-safe projection. Raw rows, target/negative keywords,
        strategy and run ids, source coordinates, heat metrics, extensions, LLM
        labels/reasoning and lineage are not part of this schema.
      properties:
        id: { type: string, format: uuid, description: Hub canonical record id. }
        title: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        url: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        province:
          description: >-
            Normalized province. Null is retained for a legacy or unclassified
            detail record; province feeds contain only the requested normalized
            province.
          oneOf:
            - { $ref: "#/components/schemas/PublicOpinionProvince" }
            - { type: "null" }
        heatScore:
          type: [number, "null"]
          description: Typed source heat score. Used by province hot ordering; it is not a cross-source relevance score.
        origin: { $ref: "#/components/schemas/PublicOpinionOrigin" }
        quality: { $ref: "#/components/schemas/PublicOpinionQuality" }
        location: { $ref: "#/components/schemas/PublicOpinionLocation" }
    PublicOpinionPageInfo:
      type: object
      additionalProperties: false
      required: [returnedCount, hasMore, nextCursor]
      properties:
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor:
          type: [string, "null"]
          maxLength: 8192
          description: Signed opaque keyset cursor. Return it unchanged with the same province, sort, bounds and pageSize.
    PublicOpinionPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [contractVersion, province, sort, items, pageInfo]
          properties:
            contractVersion: { type: string, const: mx-insight-hub.public-opinion.v1 }
            province: { $ref: "#/components/schemas/PublicOpinionProvince" }
            sort: { type: string, enum: [hot, latest] }
            items:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/PublicOpinionItem" }
            pageInfo: { $ref: "#/components/schemas/PublicOpinionPageInfo" }
        requestId: { type: string, minLength: 1 }
    PublicOpinionItemEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/PublicOpinionItem" }
        requestId: { type: string, minLength: 1 }
    PublicOpinionCoverageProvince:
      type: object
      additionalProperties: false
      required: [province, formalCount, qualifiedCandidateCount, candidateCount, qualifiedCandidateRate, verifiedCount, verifiedRate, availableCount, shortfall, meetsTarget, averageQualityScore]
      properties:
        province: { $ref: "#/components/schemas/PublicOpinionProvince" }
        formalCount: { type: integer, minimum: 0 }
        qualifiedCandidateCount: { type: integer, minimum: 0 }
        candidateCount: { type: integer, minimum: 0 }
        qualifiedCandidateRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        verifiedCount: { type: integer, minimum: 0 }
        verifiedRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        availableCount: { type: integer, minimum: 0 }
        shortfall: { type: integer, minimum: 0 }
        meetsTarget: { type: boolean }
        averageQualityScore: { type: [number, "null"], minimum: 0, maximum: 100 }
    PublicOpinionCoverageTotals:
      type: object
      additionalProperties: false
      required: [provinceCount, availableCount, provincesMeetingTarget, totalShortfall]
      properties:
        provinceCount: { type: integer, minimum: 0, maximum: 34 }
        availableCount: { type: integer, minimum: 0 }
        provincesMeetingTarget: { type: integer, minimum: 0, maximum: 34 }
        totalShortfall: { type: integer, minimum: 0 }
    PublicOpinionCoverageEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [contractVersion, from, to, includeCandidates, minQualityScore, targetPerProvince, featuredProvinceCodes, totals, provinces]
          properties:
            contractVersion: { type: string, const: mx-insight-hub.public-opinion.coverage.v1 }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            includeCandidates:
              oneOf:
                - { type: boolean, const: false }
                - { type: string, enum: [qualified, all] }
            minQualityScore: { type: [integer, "null"], minimum: 0, maximum: 100 }
            targetPerProvince: { type: integer, minimum: 1, maximum: 100 }
            featuredProvinceCodes:
              type: array
              maxItems: 8
              uniqueItems: true
              items: { type: string, pattern: "^CN-[A-Z]{2}$" }
            totals: { $ref: "#/components/schemas/PublicOpinionCoverageTotals" }
            provinces:
              type: array
              maxItems: 34
              items: { $ref: "#/components/schemas/PublicOpinionCoverageProvince" }
        requestId: { type: string, minLength: 1 }
    TelegramRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - externalId
        - platform
        - objectType
        - contentType
        - title
        - text
        - url
        - author
        - relations
        - attributes
        - metrics
        - eventTime
        - collectedAt
        - editedAt
        - media
        - entities
        - links
        - lineage
        - dataVersion
      properties:
        id:
          type: string
          description: Stable external identity within the fixed Hub dataset.
        externalId:
          type: string
          description: Alias of id retained for data-search contract compatibility.
        platform: { type: string, const: telegram }
        objectType: { type: string, enum: [chat, message] }
        contentType: { type: [string, "null"] }
        title: { type: [string, "null"] }
        text: { type: [string, "null"] }
        url: { type: [string, "null"] }
        author:
          type: object
          additionalProperties: false
          required: [id, name, username]
          properties:
            id: { type: [string, "null"] }
            name: { type: [string, "null"] }
            username: { type: [string, "null"] }
        relations:
          type: object
          additionalProperties: false
          properties:
            chatId: { type: string }
            messageId: { type: string }
            replyToMessageId: { type: string }
            threadId: { type: string }
            groupedId: { type: string }
        attributes:
          type: object
          additionalProperties: false
          properties:
            username: { type: string }
            chatType: { type: string }
            memberCount: { type: number }
            isOutgoing: { type: boolean }
        metrics:
          type: object
          additionalProperties: false
          properties:
            likes: { type: number }
            comments: { type: number }
            shares: { type: number }
            views: { type: number }
            bookmarks: { type: number }
            members: { type: number }
        media:
          type: object
          additionalProperties: false
          properties:
            media_kind: { type: string }
            status: { type: string }
            telegram_id: { type: string }
            file_name: { type: string }
            extension: { type: string }
            mime_type: { type: string }
            size_bytes: { type: number }
        entities:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              type: { type: string }
              offset: { type: number }
              length: { type: number }
              url: { type: string }
              user_id: { type: number }
        links:
          type: array
          maxItems: 0
          description: >-
            Always empty in this contract version. Source link members remain
            private until their object fields have an explicit reviewed
            allowlist and versioned public schema.
          items: {}
        eventTime: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        lineage:
          type: object
          additionalProperties: false
          required: [datasetId, origin]
          properties:
            datasetId: { type: string, enum: [telegram.monitor.chats.v1, telegram.monitor.messages.v1] }
            origin: { type: string, enum: [hub-direct, hub-import] }
        dataVersion: { type: string }
    TelegramPageInfo:
      type: object
      additionalProperties: false
      required: [returnedCount, hasMore, nextCursor]
      properties:
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when hasMore is false.
    TelegramPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, pageInfo]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TelegramRecord"
            pageInfo:
              $ref: "#/components/schemas/TelegramPageInfo"
        requestId: { type: string }
  responses:
    AdminData:
      description: Admin-token-only operation result.
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              data: {}
              requestId: { type: string }
    TelegramPage:
      description: >-
        Strict customer-safe canonical projection. Raw rows, extensions,
        database/source lineage and provider-private values are omitted.
      headers:
        x-request-id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TelegramPageEnvelope"
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, requestId]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details:
                    description: Optional bounded machine-readable context for the stable error code.
              requestId: { type: string }
