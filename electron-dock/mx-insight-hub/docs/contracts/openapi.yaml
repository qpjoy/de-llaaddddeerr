  /night-all/search/{operation}:
    post:
      operationId: searchNightAllCompatibility
      summary: Call one of the three Night-All legacy search operations.
      description: >-
        The Hub authenticates the consumer, enforces the platform grant and
        policy, then checks the Hub-pinned, grant-filtered data.legacySearch
        dispatch matrix returned by GET /data/capabilities. The selected platform
        must appear in both supportedPlatforms and readyPlatforms; a
        data.platforms entry alone, including telegram, does not grant a legacy
        operation. The matrix is owned by the deployed Hub release and is not
        fetched from Night-All at request time. readyPlatforms means Hub permits
        dispatch under that pinned contract; it does not prove current Night-All
        handler, endpoint, provider, credential, or upstream health. A null or
        invalid matrix fails closed before dispatch. The Hub injects its owned businessId,
        records the upstream attempt, and stores complete
        responses as exact last-good snapshots. A network or timeout ambiguity,
        an unusable HTTP 2xx content-type/JSON/envelope, or a real non-2xx HTTP
        502/503/504 may return that exact snapshot. An unusable 2xx is
        outcome-unknown because paid work may already have happened. The response
        body retains Night-All data fields unchanged;
        provider, token, credential, endpoint, capability/moduleCode and timeout
        routing controls remain server-owned. Archive/fullArchive/allTweets,
        archiveLimit/totalCount, max*Pages, pageCount/chunkSize/budget/crawlDepth
        and equivalent cost-amplification controls are also rejected; they require
        a separately granted capability and server policy.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, invalid_platform, page_size_exceeded, work_budget_exceeded, unsupported_fields, business_id_mismatch, idempotency_key_required, invalid_idempotency_key, platform_operation_unsupported, night_all_rejected]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "404": [not_found, night_all_rejected]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown, night_all_rejected]
        "422": [night_all_rejected]
        "429": [quota_exceeded, night_all_rejected]
        "502": [night_all_rejected, upstream_outcome_unknown]
        "503": [platform_operation_unavailable, compatibility_capabilities_unavailable, compatibility_store_unavailable]
      parameters:
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [raw, crawl, user-info] }
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Permanently names one immutable paid dispatch for this exact path and
            normalized body. Reuse always replays that result; use a new key only
            when intentionally requesting a new live call.
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NightAllLegacyRequest" }
            examples:
              raw:
                value: { platform: xiaohongshu, keyword: "AI Agent", count: 20 }
              crawl:
                value: { platform: twitter, username: openai, count: 20 }
              userInfo:
                value: { platform: twitter, username: openai }
      responses:
        "200":
          description: >-
            Night-All legacy envelope, either live or the exact last-good
            upstream application payload. The body is not masked by this route.
          headers:
            x-mx-insight-request-id:
              description: Durable Hub request identifier for status lookup.
              schema: { type: string, format: uuid }
            x-mx-insight-source-mode:
              schema: { type: string, enum: [live, stale] }
            x-mx-insight-captured-at:
              schema: { type: string, format: date-time }
            Age:
              schema: { type: integer, minimum: 0 }
            Warning:
              description: HTTP Warning 110 is present for a stale delivery.
              schema: { type: string }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NightAllLegacyEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/stored/search:
    post:
      operationId: searchStoredData
      summary: Search Hub canonical data without calling Night-All.
      description: >-
        Requires the API key's explicit platform grant. datasetId and objectType
        are exact logical filters, not separate authorization grants: every
        consumer granted a platform can search the complete Hub canonical corpus
        for that platform. Elasticsearch is the preferred ranked projection; a
        transport failure on the first page falls back to PostgreSQL and is
        reported explicitly. The strict request body does not accept a physical
        database, index, SQL, Elasticsearch DSL/script or provider parameters.
        Response and item source are always hub; connector lineage, raw payloads
        and provider coordinates are excluded. The opaque cursor is HMAC-signed
        and bound to the normalized query, filters and page size. For
        platform=public_opinion the default is formal-only. Candidate and exact
        geography/time controls require explicit platform=public_opinion;
        includeCandidates=all requires from, to and at least one of province,
        countryCode or location. Other platforms are unaffected. Explicit
        candidate results expose only bounded Hub quality/location metadata and
        omit candidate author/contentType and upstream source identity. The
        publication-visibility contract is part of the idempotency fingerprint;
        after upgrading to this contract, use a new Idempotency-Key instead of
        reusing a pre-upgrade key.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, invalid_province, candidate_scope_required, page_size_exceeded, unsupported_fields, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "410": [search_cursor_expired]
        "429": [quota_exceeded]
        "503": [stored_search_unavailable, search_cursor_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoredSearchRequest"
      responses:
        "200":
          description: Hub canonical stored-search response.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSearchEnvelope"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/canonical/search:
    post:
      operationId: searchCanonicalData
      summary: Search all authorized Hub canonical datasets in one ranked result set.
      description: >-
        Runs one query against the Hub canonical current-state projection and
        never fans out to source APIs. Omitting platform searches the current
        consumer's complete granted-platform scope; platform, datasetId and
        objectType only narrow that scope. The server always applies the sorted
        grant set as an authorization filter. Elasticsearch uses one PIT and a
        score/event-time/id plus PIT `_shard_doc` ordering; PostgreSQL is the explicit degradation
        path. The balanced profile uses HanLP/pre-segmented terms only while
        query analysis is healthy; degraded Jieba/bigram terms switch the
        applied profile to raw phrase. The signed cursor is bound to the query,
        filters, page size, resolved versioned search profile, platform scope
        and bounded first-page analysis state, so later pages do not re-segment. searchProfile
        selects a server-owned query policy; arbitrary analyzers, tokenizers,
        filters and Elasticsearch DSL are rejected. Its independent usage bucket always applies the
        strictest limits across the consumer's complete current platform-grant
        set. Public items use an allowlist and exclude raw payloads, extensions,
        credentials and provider coordinates. In a mixed-platform result, only
        the public_opinion branch is formal-only by default; every other
        platform is unchanged. Candidate and exact geography/time controls
        require explicit platform=public_opinion; includeCandidates=all requires
        from, to and at least one of province, countryCode or location. Explicit
        candidate results expose only bounded Hub quality/location metadata and
        omit candidate author/contentType and upstream source identity. The
        publication-visibility contract is part of the idempotency fingerprint
        whenever the authorized scope can include public_opinion; after
        upgrading to this contract, use a new Idempotency-Key instead of reusing
        a pre-upgrade key.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, invalid_platform, invalid_province, candidate_scope_required, invalid_search_profile, page_size_exceeded, unsupported_fields, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "410": [search_cursor_expired]
        "429": [quota_exceeded]
        "503": [canonical_search_unavailable, search_cursor_unavailable, search_profile_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalSearchRequest"
            examples:
              telegramAllSources:
                summary: Telegram monitor and SQLite-import messages together
                value: { platform: telegram, objectType: message, query: "AI Agent", searchProfile: canonical.balanced.v1, pageSize: 20 }
              allGrantedPlatforms:
                summary: All platforms currently granted to the consumer
                value: { query: "AI Agent", pageSize: 20 }
      responses:
        "200":
          description: Source-independent Hub canonical search response.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSearchEnvelope"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/canonical/items/{id}/context:
    get:
      operationId: getCanonicalMessageContext
      summary: Read the nearest stored messages around one canonical search hit.
      description: >-
        Requires the telegram platform grant. The anchor id is the Hub canonical
        UUID returned by canonical search. Context never crosses dataset,
        platform, object type or normalized chat id. Rows use the declared
        (eventTime, canonicalId) total order rather than an inferred Telegram
        sequence. before and after default to 10 and are independently capped at
        50. storedWindow describes only active records currently stored in Hub;
        upstreamCompleteness is a separate declared source-capture statement,
        may be upgraded only from persisted evidence, and cannot be inferred
        from storedWindow, source activity or cursor state. Only datasets
        advertised by the Telegram context capability are
        supported. Raw rows, extensions, credentials and lineage remain private.
        This safe GET is independently metered on every call and retry.
      x-mx-allowed-query-fields: [before, after]
      x-mx-error-codes:
        "400": [invalid_request, unsupported_fields]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "404": [item_not_found]
        "409": [context_not_supported]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable, serving_indexes_unavailable]
      parameters:
        - name: id
          in: path
          required: true
          description: Hub canonical message UUID returned by a search result.
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          description: Number of nearest stored messages before the anchor.
          schema: { type: integer, minimum: 0, maximum: 50, default: 10 }
        - name: after
          in: query
          required: false
          description: Number of nearest stored messages after the anchor.
          schema: { type: integer, minimum: 0, maximum: 50, default: 10 }
      responses:
