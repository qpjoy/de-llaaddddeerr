openapi: 3.1.0
info:
  title: MX Insight Hub Public and Source Admin API
  version: 1.0.0-alpha
  description: Stable consumer contract. Night-All and provider details are private implementation concerns.
servers:
  - url: /api/v1
security:
  - bearerKey: []
  - apiKeyHeader: []
paths:
  /api-keys:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: listApiKeys
      summary: List API keys visible in the caller's tenant scope.
      description: >-
        Returns only safe key metadata; plaintext secrets and HMAC digests are
        never returned. The break-glass Admin Token may list every tenant, while
        Launcher sessions require apikey.read in each returned tenant. Public
        mih_live/mih_test API keys are not management credentials.
      security:
        - adminToken: []
        - launcherSession: []
      parameters:
        - name: consumerId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Safe API-key metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyListEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      summary: Issue a one-time API key with a bounded lifetime.
      description: >-
        Requires apikey.write in the consumer's owning tenant, or the
        break-glass Admin Token. The complete secret is returned exactly once.
        Omitted expiresInDays defaults to 180; callers may select 1 through 730
        days. Lifetime is immutable: rotate by issuing a replacement and then
        revoking the old key.
      security:
        - adminToken: []
        - launcherSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Newly issued key; this is the only response containing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedApiKeyEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api-keys/{apiKeyId}/revoke:
    servers:
      - url: /internal/v1/admin
    post:
      operationId: revokeApiKey
      summary: Irreversibly revoke an API key.
      description: >-
        Requires apikey.write in the key's owning tenant, or the break-glass
        Admin Token. Revocation takes effect on the next request and does not
        delete usage evidence.
      security:
        - adminToken: []
        - launcherSession: []
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked key metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: getTelegramMonitorPipeline
      summary: Read the fixed two-input Telegram Monitor cleaning pipeline.
      description: >-
        Requires the platform Admin Token. Returns the one shared source
        connection, fixed chats/messages task definitions, mapping/checkpoint
        state, current writer contract/last attestation and recent run evidence.
        Physical schema/tables are not caller-selectable.
      security:
        - adminToken: []
      responses:
        "200":
          description: Telegram Monitor business-pipeline state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramMonitorPipelineEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: configureTelegramMonitorPipeline
      summary: Validate and save one connection/schedule for both fixed inputs.
      description: >-
        Both child sources must be paused and drained. The server opens a
        bounded read-only test session, then atomically writes the shared
        connection while injecting the fixed table/cursor/id contracts.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramMonitorPipelinePatch" }
      responses:
        "200":
          description: Validated and atomically updated pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramMonitorPipelineEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor/status:
    servers:
      - url: /internal/v1/admin
    post:
      operationId: setTelegramMonitorPipelineStatus
      summary: Activate or safely pause both Telegram Monitor inputs.
      description: >-
        Activation first requires both schema/index gates and checkpoint
        compatibility to pass, then requires an explicit attestation matching
        the current writer-contract version and digest. Both exact built-in
        mappings, the immutable attestation and both active statuses commit in
        one Hub transaction. Pause prevents new batches; an in-flight batch
        finishes at its durable checkpoint boundary.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramMonitorPipelineStatusRequest" }
      responses:
        "200":
          description: Updated aggregate and child-task status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramMonitorPipelineEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor/sync:
    servers:
      - url: /internal/v1/admin
    post:
      operationId: syncTelegramMonitorPipeline
      summary: Enqueue both active Telegram Monitor input tasks.
      description: >-
        Requires a current writer-contract attestation. Both child jobs are
        inserted in one PostgreSQL queue transaction; a pre-commit failure
        schedules neither child, while an unknown COMMIT outcome is reported
        explicitly for queue inspection.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramMonitorPipelineSyncRequest" }
      responses:
        "202":
          description: Per-input jobs accepted or already scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [pipelineKey, tasks]
                    properties:
                      pipelineKey: { type: string, const: telegram-monitor }
                      tasks:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                          type: object
                          additionalProperties: false
                          required: [sourceKey, jobId, alreadyScheduled]
                          properties:
                            sourceKey: { type: string }
                            jobId: { type: [string, integer, "null"] }
                            alreadyScheduled: { type: boolean }
                  requestId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor/progress:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: getTelegramMonitorPipelineProgress
      summary: Explicitly count source rows and checkpoint-relative progress.
      description: >-
        Executes source COUNT queries only when requested. With a proven
        composite cursor it returns exact completed/remaining counts at
        checkedAt. If a cursor column/index/order contract is unsafe it still
        returns exact totalRows plus blocker/issues, while progress and percent
        stay null rather than being invented.
      security:
        - adminToken: []
      responses:
        "200":
          description: Exact point-in-time source progress evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramMonitorProgressEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor/source/prepare:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: inspectTelegramMonitorSourcePreparation
      summary: Inspect the fixed TG source-side writer contract.
      description: >-
        Requires the platform Admin Token and a paused, drained Telegram
        pipeline. Uses the saved read-only connection to inspect the two fixed
        tables without returning row values or credentials. A ready result
        proves the installed column/trigger/index shape; activation still
        requires the separate writer-contract attestation.
      security:
        - adminToken: []
      responses:
        "200":
          description: Current source-contract evidence and reset guidance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramSourcePreparationEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: prepareTelegramMonitorSource
      summary: Idempotently install or repair the fixed TG source contract.
      description: >-
        Explicit source-side DDL action; it is not part of ordinary Hub deploy
        or ingestion. Both child tasks must be paused and drained. It adds or
        repairs updated_at, a commit-ordered shared watermark, ENABLE ALWAYS
        writer triggers, hard-delete guards and valid composite cursor indexes,
        then re-inspects the result. Optional migration credentials override
        only username/password for this request and are never persisted,
        returned or logged. The saved runtime connection remains read-only.
        This operation never activates the task or resets a checkpoint. A new
        source/table generation makes the old checkpoint incompatible and the
        response instructs the operator to use the separate confirmed paired
        reset before full replay.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramSourcePreparationRequest" }
      responses:
        "200":
          description: Verified source-contract evidence; the pipeline remains paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramSourcePreparationEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/telegram-monitor/checkpoints/reset:
    servers:
      - url: /internal/v1/admin
    post:
      operationId: resetTelegramMonitorPipelineCheckpoints
      summary: Atomically reset both paused Telegram Monitor checkpoints.
      description: >-
        Both fixed inputs must be paused and drained. The reset is written
        against the exact built-in mapping contract, so a legacy checkpoint
        cannot keep activation pinned to an older mapping. Child-source reset
        routes reject these pipeline-managed keys.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmPipelineKey]
              properties:
                confirmPipelineKey: { type: string, const: telegram-monitor }
      responses:
        "200":
          description: Both checkpoints reset to the fixed business contract.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [pipelineKey, resets]
                    properties:
                      pipelineKey: { type: string, const: telegram-monitor }
                      resets:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items: { type: object, additionalProperties: true }
                  requestId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: listExternalSources
      summary: List source configurations, including Admin-visible PostgreSQL credentials.
      description: >-
        Requires the platform Admin Token specifically. Launcher-login sessions
        and public API keys cannot access source management. PostgreSQL
        passwords are intentionally stored as plaintext in
        catalog.external_sources.connection and can be returned on this
        Admin-token-only surface; protect Hub database and backup access.
      security:
        - adminToken: []
      responses:
        "200":
          description: Admin-visible source configurations.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalSource" }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createExternalSource
      summary: Create a direct PostgreSQL or file source.
      description: >-
        Requires the platform Admin Token. A database candidate is tested with
        a bounded read-only PostgreSQL session before it is saved; a file source
        has no connection object and is registered for later preview/mapping/
        import. No separate Provider resource or provider master key is involved.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalSourceCreate" }
      responses:
        "201":
          description: Paused database source or active file source created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSourceEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: getExternalSource
      summary: Get one Admin-visible source configuration.
      security:
        - adminToken: []
      responses:
        "200":
          description: Source configuration; direct connection credentials are Admin-visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSourceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateExternalSource
      summary: Change a paused, drained source connection, schedule or status.
      description: >-
        A direct connection change is read-only-tested before replacing the
        saved connection. A running batch returns source_draining. Activate only
        after mapping approval and the schema/index/watermark gate succeeds.
        The two fixed Telegram Monitor keys return pipeline_managed_source and
        must be changed through the pipeline routes.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalSourcePatch" }
      responses:
        "200":
          description: Updated source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSourceEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/test:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    post:
      operationId: testExternalSource
      summary: Test the saved PostgreSQL connection in a read-only session.
      security:
        - adminToken: []
      responses:
        "200":
          description: Bounded safe connection evidence; no driver error or password is logged.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      database: { type: string }
                      user: { type: string }
                      serverVersion: { type: string }
                      readOnly: { type: boolean, const: true }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/schema:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: describeExternalSource
      summary: Inspect source schema/index/constraint evidence and activation issues.
      security:
        - adminToken: []
      responses:
        "200":
          description: Value-free source metadata and activation issues.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { type: object, additionalProperties: true }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/mappings:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: listSourceMappings
      summary: List immutable mapping versions for a source.
      security:
        - adminToken: []
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSourceMapping
      summary: Create an unapproved mapping version.
      description: Fixed Telegram Monitor child keys are read-only here and return pipeline_managed_source.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceMappingCreate" }
      responses:
        "201": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/mappings/{version}/approve:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: approveSourceMapping
      summary: Approve one exact mapping version while a database source is paused and drained.
      description: Fixed Telegram Monitor mappings are approved only by the atomic pipeline activation.
      security:
        - adminToken: []
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/preview:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: previewDatabaseSource
      summary: Return value-free shapes for up to three PostgreSQL rows.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 3 }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: previewSourceFile
      summary: Parse a file locally; optional Agent assistance receives column names only.
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/SourceFilename"
        - name: agent
          in: query
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/sync:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: getSourceSync
      summary: Inspect durable cursor, latest run and next due time.
      security:
        - adminToken: []
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: scheduleSourceSync
      summary: Queue a manual pull for an active, approved and probe-safe database source.
      description: Fixed Telegram Monitor child keys return pipeline_managed_source; use the paired pipeline sync.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchSize: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "202": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/checkpoint/reset:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    post:
      operationId: resetSourceCheckpoint
      summary: Reset a paused, drained source checkpoint after exact source-key confirmation.
      description: Fixed Telegram Monitor child keys return pipeline_managed_source; use the paired pipeline reset.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmSourceKey]
              properties:
                confirmSourceKey: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/import:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
      - $ref: "#/components/parameters/SourceFilename"
    post:
      operationId: importSourceFile
      summary: Import a file with the source's approved mapping.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "201": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sources/{sourceKey}/imports:
    servers:
      - url: /internal/v1/admin
    parameters:
      - $ref: "#/components/parameters/SourceKey"
    get:
      operationId: listSourceImports
      summary: List durable import runs and row/change/delete/rejection evidence.
      security:
        - adminToken: []
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /data/capabilities:
    get:
      operationId: listCapabilities
      responses:
        "200":
          description: Capabilities granted to this consumer.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    properties:
                      platforms:
                        type: array
                        items:
                          type: object
                          required: [platform, ready]
                          properties:
                            platform: { type: string }
                            ready: { type: boolean }
                            capabilities:
                              type: array
                              items: { type: string }
                  requestId: { type: string }
  /data/search:
    post:
      operationId: searchData
      description: >-
        Stable Night-All-v1 search facade. For platform telegram, Hub serves
        canonical local data with the same fixed item source and response meta
        labels documented by /data/telegram/search; PostgreSQL degradation is
        represented only by warnings. Other enabled platforms use the governed
        private Night-All adapter. Telegram pagination follows the signed,
        query-bound cursor, PIT/keyset and sticky-mode rules documented by
        /data/telegram/search.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, page_size_exceeded, unsupported_fields, unsupported_match_mode, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "410": [search_cursor_expired]
        "429": [quota_exceeded]
        "502": [night_all_rejected, upstream_outcome_unknown]
        "503": [stored_search_unavailable, search_cursor_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Stable search response.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightAllDataSearchEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /data/telegram/chats:
    get:
      operationId: listTelegramMonitorChats
      summary: List normalized Telegram monitor chats from Hub storage.
      description: >-
        Requires the API key's consumer to have the explicit `telegram` grant.
        Only the documented query fields are accepted; source tables, raw rows,
        provider details and arbitrary sorting are not public inputs. The read
        serves the same complete canonical dataset to every consumer granted
        telegram; tenant-specific row scoping is not implemented. It
        consumes one request from telegram.maxRequests and commits
        max(1, returnedCount) usage units without retaining the response body in
        usage evidence. A retry is a separately metered request.
      x-mx-allowed-query-fields: [chatId, from, to, pageSize, cursor]
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, page_size_exceeded, unsupported_fields]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable]
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
        - $ref: "#/components/parameters/TelegramFrom"
        - $ref: "#/components/parameters/TelegramTo"
        - $ref: "#/components/parameters/TelegramPageSize"
        - $ref: "#/components/parameters/TelegramCursor"
      responses:
        "200":
          $ref: "#/components/responses/TelegramPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /data/telegram/messages:
    get:
      operationId: listTelegramMonitorMessages
      summary: List normalized Telegram monitor messages from Hub storage.
      description: >-
        Requires the API key's consumer to have the explicit `telegram` grant.
        Results use descending event-time/internal-ID keyset pagination. Return
        `nextCursor` unchanged; it is opaque. Free-text `q`, OFFSET, SQL, raw
        export, caller-selected datasets and tenant-specific row subsets are not
        supported. The read consumes
        one request from telegram.maxRequests and commits max(1, returnedCount)
        usage units; a retry is separately metered.
      x-mx-allowed-query-fields: [chatId, from, to, pageSize, cursor]
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, page_size_exceeded, unsupported_fields]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable]
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
        - $ref: "#/components/parameters/TelegramFrom"
        - $ref: "#/components/parameters/TelegramTo"
        - $ref: "#/components/parameters/TelegramPageSize"
        - $ref: "#/components/parameters/TelegramCursor"
      responses:
        "200":
          $ref: "#/components/responses/TelegramPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /data/telegram/search:
    post:
      operationId: searchStoredTelegram
      summary: Search canonical Telegram chats/messages without an upstream provider call.
      description: >-
        Returns the Night-All data-search v1 envelope from Hub-owned canonical
        storage. Elasticsearch is the ranked projection; PostgreSQL substring
        search is the documented degraded path and is reported only through a
        search_projection_degraded warning, never through meta.searchMode.
        Every item has source.provider null and source.endpointId
        hub-canonical-search; response meta has sourceProvider mx-insight-hub
        and endpointId hub-canonical-search. These are serving-plane labels;
        physical source/provider identity and credentials are never returned.
        Night-All-v1 metrics are non-negative numbers or null; invalid or
        negative source sentinels are normalized to null. Pagination uses an
        HMAC-signed version-2 opaque cursor bound to the normalized query,
        filters and page size. Elasticsearch uses a renewable two-minute PIT,
        _score/eventTime/id search_after and size plus one, independent of
        result totals and the 10,000-hit window. PostgreSQL fallback uses a
        NULL-aware event_time/id keyset and never OFFSET. First-page ES failure
        may select PostgreSQL with a warning; the selected cursor mode is sticky.
        An unavailable existing ES cursor returns 503 without fallback, and an
        expired PIT returns 410.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, page_size_exceeded, unsupported_fields, unsupported_match_mode, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "410": [search_cursor_expired]
        "429": [quota_exceeded]
        "503": [stored_search_unavailable, search_cursor_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSearchRequest"
      responses:
        "200":
          description: Night-All-v1-compatible stored search response.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightAllDataSearchPlatformEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /data/telegram/entities/search:
    get:
      operationId: searchTelegramEntities
      summary: Fuzzy-search Telegram authors and chats from Hub projections.
      description: >-
        Searches names/usernames and chat titles/usernames. Elasticsearch uses
        ranked name/prefix/CJK fields and PostgreSQL trigram/substring search is
        the documented fallback. This metered safe GET makes no Night-All call.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Ranked union of author and chat entities.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /requests/{requestId}:
    get:
      operationId: getRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Caller-owned request status without stored upstream response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RequestStatus"
  /usage:
    get:
      operationId: getUsage
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Usage visible to the authenticated consumer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requests: { type: integer }
                      committed: { type: integer }
                      released: { type: integer }
                      unknown: { type: integer }
                      units: { type: integer }
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: x-mx-insight-admin-token
      description: Platform break-glass Admin Token; the only credential accepted by source-management routes.
    launcherSession:
      type: apiKey
      in: header
      name: x-mx-insight-admin-token
      description: >-
        Launcher-issued management session carried in the same bootstrap
        header as the Admin Token. The server compares the Admin Token first,
        then resolves any non-matching value through Launcher and enforces the
        Hub capability held in the target tenant. This is not a mih_live or
        mih_test public API key.
    bearerKey:
      type: http
      scheme: bearer
      bearerFormat: MX-API-Key
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    SourceKey:
      name: sourceKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
    SourceFilename:
      name: filename
      in: query
      required: true
      description: Basename used to select the supported CSV/TSV, JSONL/NDJSON, TXT/MD or XLSX/XLSM parser; the request body contains the raw file bytes.
      schema: { type: string, minLength: 1, maxLength: 255 }
    TelegramChatId:
      name: chatId
      in: query
      required: false
      description: >-
        Exact normalized chat identifier. It matches the chat external ID on
        the chats resource and the normalized chat relation on messages.
      schema: { type: string, minLength: 1, maxLength: 256 }
    TelegramFrom:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound on eventTime. Must be a complete RFC3339
        date-time with T, seconds, and Z or a numeric offset; date-only and
        space-separated forms are rejected.
      schema: { type: string, format: date-time }
    TelegramTo:
      name: to
      in: query
      required: false
      description: >-
        Inclusive upper bound on eventTime in the same complete RFC3339 form;
        must not precede from.
      schema: { type: string, format: date-time }
    TelegramPageSize:
      name: pageSize
      in: query
      required: false
      description: >-
        Defaults to 50 or the consumer's lower policy limit. The effective
        maximum is the consumer telegram.maxPageSize and never exceeds 100.
      schema: { type: integer, minimum: 1, maximum: 100 }
    TelegramCursor:
      name: cursor
      in: query
      required: false
      description: Opaque nextCursor from the previous page; return unchanged.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  schemas:
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [consumerId, name]
      properties:
        consumerId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        environment: { type: string, enum: [live, test], default: live }
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 730
          default: 180
          description: Whole-day lifetime measured from server-side issuance time.
    ApiKeyMetadata:
      type: object
      required:
        - id
        - tenantId
        - consumerId
        - name
        - prefix
        - lastFour
        - environment
        - status
        - effectiveStatus
        - createdAt
        - expiresAt
        - revokedAt
        - lastUsedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: Non-secret display prefix; never sufficient for authentication.
        lastFour: { type: string, minLength: 4, maxLength: 4 }
        environment: { type: string, enum: [live, test] }
        status:
          type: string
          enum: [active, revoked]
          description: Persisted lifecycle state; expiry does not rewrite it.
        effectiveStatus:
          type: string
          enum: [active, expired, revoked]
          description: Runtime state after applying the exclusive expiresAt boundary.
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Exclusive authentication expiry.
        revokedAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    ApiKey:
      allOf:
        - { $ref: "#/components/schemas/ApiKeyMetadata" }
      unevaluatedProperties: false
    IssuedApiKey:
      allOf:
        - { $ref: "#/components/schemas/ApiKeyMetadata" }
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: "^mih_(live|test)_"
              description: One-time plaintext secret; never returned by list or revoke.
      unevaluatedProperties: false
    ApiKeyEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/ApiKey" }
        requestId: { type: string }
    IssuedApiKeyEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/IssuedApiKey" }
        requestId: { type: string }
    ApiKeyListEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
        requestId: { type: string }
    TelegramMonitorSharedConnection:
      type: object
      additionalProperties: false
      required: [host, database, username, password]
      description: >-
        One Admin-token-visible direct connection reused by both fixed inputs.
        schema/table/cursor/id are deliberately absent and injected as the
        fixed public Telegram Monitor business definition.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5432 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full], default: require }
    TelegramMonitorStoredSharedConnection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Admin-visible stored shared coordinates. Legacy seeded sources may
        expose dsnEnv until the first direct pipeline configuration.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: [string, "null"], minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        dsnEnv: { type: string, minLength: 1 }
        sourceContractId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          readOnly: true
          description: Internal source-installation generation bound into checkpoint compatibility.
    TelegramMonitorPipelinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        connection: { $ref: "#/components/schemas/TelegramMonitorSharedConnection" }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
    TelegramMonitorPipelineStatusRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, const: paused }
        - type: object
          additionalProperties: false
          required: [status, writerContractAttestation]
          properties:
            status: { type: string, const: active }
            writerContractAttestation:
              $ref: "#/components/schemas/TelegramMonitorWriterContractAttestationRequest"
    TelegramMonitorWriterContractAttestationRequest:
      type: object
      additionalProperties: false
      required: [confirmed, contractVersion, contractDigest]
      properties:
        confirmed: { type: boolean, const: true }
        contractVersion: { type: string, const: telegram-monitor.writer.v1 }
        contractDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
    TelegramMonitorWriterContractSummary:
      type: object
      additionalProperties: false
      required: [watermark, deletion, ordering, inputs]
      properties:
        watermark: { type: string }
        deletion: { type: string }
        ordering: { type: string }
        inputs:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [role, table, cursor]
            properties:
              role: { type: string, enum: [chats, messages] }
              table: { type: string, enum: [public.tg_monitor_chats, public.tg_monitor_messages] }
              cursor:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string }
    TelegramMonitorWriterContractAttestation:
      type: object
      additionalProperties: false
      required: [id, pipelineKey, contractVersion, contractDigest, contractSummary, attestedBy, attestedAt]
      properties:
        id: { type: string, format: uuid }
        pipelineKey: { type: string, const: telegram-monitor }
        contractVersion: { type: string, const: telegram-monitor.writer.v1 }
        contractDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        contractSummary: { $ref: "#/components/schemas/TelegramMonitorWriterContractSummary" }
        attestedBy: { type: string }
        attestedAt: { type: string, format: date-time }
    TelegramMonitorWriterContract:
      type: object
      additionalProperties: false
      required: [version, digest, summary, latestAttestation]
      properties:
        version: { type: string, const: telegram-monitor.writer.v1 }
        digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        summary: { $ref: "#/components/schemas/TelegramMonitorWriterContractSummary" }
        latestAttestation:
          oneOf:
            - { $ref: "#/components/schemas/TelegramMonitorWriterContractAttestation" }
            - { type: "null" }
    TelegramMonitorPipelineSyncRequest:
      type: object
      additionalProperties: false
      properties:
        batchSize: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
    TelegramMonitorPipelineTask:
      type: object
      additionalProperties: true
      required:
        - role
        - sourceKey
        - schema
        - table
        - cursorColumn
        - idColumn
        - builtInMappingVersion
        - builtInMappingAvailable
        - source
      properties:
        role: { type: string, enum: [chats, messages] }
        sourceKey: { type: string, enum: [telegram-monitor-chats, telegram-monitor-messages] }
        schema: { type: string, const: public }
        table: { type: string, enum: [tg_monitor_chats, tg_monitor_messages] }
        cursorColumn: { type: string, const: updated_at }
        idColumn: { type: string, enum: [chat_id, id] }
        builtInMappingVersion: { type: integer, const: 2 }
        builtInMappingAvailable: { type: boolean }
        source: { $ref: "#/components/schemas/ExternalSource" }
        activeMapping:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        cursor:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        latestRun:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        nextDueAt: { type: [string, "null"], format: date-time }
    TelegramMonitorPipeline:
      type: object
      additionalProperties: false
      required:
        - pipelineKey
        - displayName
        - builtInMappingVersion
        - status
        - connection
        - syncIntervalSeconds
        - configured
        - connectionConsistent
        - syncIntervalConsistent
        - inputContractsConsistent
        - configurationIssues
        - writerContract
        - tasks
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        displayName: { type: string, const: Telegram monitor }
        builtInMappingVersion: { type: integer, const: 2 }
        status: { type: string, enum: [active, paused, mixed] }
        connection:
          oneOf:
            - { $ref: "#/components/schemas/TelegramMonitorStoredSharedConnection" }
            - { type: "null" }
        syncIntervalSeconds: { type: [integer, "null"], minimum: 60, maximum: 86400 }
        configured: { type: boolean }
        connectionConsistent: { type: boolean }
        syncIntervalConsistent: { type: boolean }
        inputContractsConsistent: { type: boolean }
        configurationIssues:
          type: array
          items: { type: string }
        writerContract: { $ref: "#/components/schemas/TelegramMonitorWriterContract" }
        tasks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramMonitorPipelineTask" }
    TelegramMonitorPipelineEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramMonitorPipeline" }
        requestId: { type: string }
    TelegramSourceMigrationCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      description: >-
        One-request source owner or DDL credentials. They replace only the
        saved username/password while this preparation call runs and are never
        persisted or returned.
      properties:
        username: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    TelegramSourcePreparationRequest:
      type: object
      additionalProperties: false
      required: [confirmPipelineKey]
      properties:
        confirmPipelineKey: { type: string, const: telegram-monitor }
        migrationCredentials: { $ref: "#/components/schemas/TelegramSourceMigrationCredentials" }
    TelegramSourcePreparationCheck:
      type: object
      additionalProperties: false
      required: [key, status, message]
      properties:
        key: { type: string }
        status: { type: string, enum: [ready, needed, applied] }
        message: { type: string }
    TelegramSourcePreparationNotice:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    TelegramSourceUpdatedAtEvidence:
      type: object
      additionalProperties: false
      required: [exists, type, nullable, finite, ready]
      properties:
        exists: { type: boolean }
        type: { type: [string, "null"] }
        nullable: { type: [boolean, "null"] }
        finite: { type: boolean }
        ready: { type: boolean }
    TelegramSourceStableIdEvidence:
      type: object
      additionalProperties: false
      required: [exists, nullable, unique, ready]
      properties:
        exists: { type: boolean }
        nullable: { type: [boolean, "null"] }
        unique: { type: boolean }
        ready: { type: boolean }
    TelegramSourceTriggerEvidence:
      type: object
      additionalProperties: false
      required: [installed, enabledAlways, laterCompetingTriggers]
      properties:
        installed: { type: boolean }
        enabledAlways: { type: boolean }
        laterCompetingTriggers:
          type: array
          items: { type: string }
    TelegramSourceDeleteGuardEvidence:
      type: object
      additionalProperties: false
      required: [installed, enabledAlways]
      properties:
        installed: { type: boolean }
        enabledAlways: { type: boolean }
    TelegramSourceCursorIndexEvidence:
      type: object
      additionalProperties: false
      required: [exists, name, valid, ready, namedIndexExists]
      properties:
        exists: { type: boolean }
        name: { type: [string, "null"] }
        valid: { type: boolean }
        ready: { type: boolean }
        namedIndexExists: { type: boolean }
    TelegramSourcePreparationTable:
      type: object
      additionalProperties: false
      required:
        - role
        - table
        - idColumn
        - cursorIndexName
        - exists
        - oid
        - canAlter
        - stableId
        - updatedAt
        - trigger
        - deleteGuard
        - cursorIndex
        - ready
      properties:
        role: { type: string, enum: [chats, messages] }
        table: { type: string, enum: [public.tg_monitor_chats, public.tg_monitor_messages] }
        idColumn: { type: string, enum: [chat_id, id] }
        cursorIndexName: { type: string }
        exists: { type: boolean }
        oid: { type: [string, "null"] }
        canAlter: { type: boolean }
        stableId: { $ref: "#/components/schemas/TelegramSourceStableIdEvidence" }
        updatedAt: { $ref: "#/components/schemas/TelegramSourceUpdatedAtEvidence" }
        trigger: { $ref: "#/components/schemas/TelegramSourceTriggerEvidence" }
        deleteGuard: { $ref: "#/components/schemas/TelegramSourceDeleteGuardEvidence" }
        cursorIndex: { $ref: "#/components/schemas/TelegramSourceCursorIndexEvidence" }
        ready: { type: boolean }
    TelegramSourceInfrastructureEvidence:
      type: object
      additionalProperties: false
      required:
        - watermarkExists
        - watermarkStructureReady
        - watermarkRowReady
        - advanceFunctionExists
        - touchFunctionExists
        - deleteFunctionExists
        - ready
      properties:
        watermarkExists: { type: boolean }
        watermarkStructureReady: { type: boolean }
        watermarkRowReady: { type: boolean }
        advanceFunctionExists: { type: boolean }
        touchFunctionExists: { type: boolean }
        deleteFunctionExists: { type: boolean }
        ready: { type: boolean }
    TelegramSourcePreparation:
      type: object
      additionalProperties: false
      required:
        - pipelineKey
        - status
        - ready
        - applied
        - source
        - contract
        - permissions
        - tables
        - steps
        - warnings
        - sourceIdentityChanged
        - requiresCheckpointReset
        - checkpointResetReason
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        status: { type: string, enum: [ready, needs_prepare] }
        ready: { type: boolean }
        applied: { type: boolean }
        source:
          type: object
          additionalProperties: false
          required: [database, user, serverVersion, readOnly]
          properties:
            database: { type: [string, "null"] }
            user: { type: [string, "null"] }
            serverVersion: { type: [string, "null"] }
            readOnly: { type: boolean }
        contract:
          type: object
          additionalProperties: false
          required:
            - version
            - installedVersion
            - installedAt
            - generation
            - previousTableOids
            - infrastructure
          properties:
            version: { type: integer, const: 1 }
            installedVersion: { type: [integer, "null"] }
            installedAt: { type: [string, "null"], format: date-time }
            generation: { type: [string, "null"], pattern: "^[0-9a-f]{32}$" }
            previousTableOids:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [chats, messages]
                  properties:
                    chats: { type: [string, "null"] }
                    messages: { type: [string, "null"] }
                - { type: "null" }
            infrastructure: { $ref: "#/components/schemas/TelegramSourceInfrastructureEvidence" }
        permissions:
          type: object
          additionalProperties: false
          required: [canPrepare, isSuperuser, isDatabaseOwner, canCreateSchema, currentSessionWritable]
          properties:
            canPrepare: { type: boolean }
            isSuperuser: { type: boolean }
            isDatabaseOwner: { type: boolean }
            canCreateSchema: { type: boolean }
            currentSessionWritable: { type: boolean }
        tables:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramSourcePreparationTable" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TelegramSourcePreparationCheck" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/TelegramSourcePreparationNotice" }
        sourceIdentityChanged: { type: boolean }
        migrationAccountUsed: { type: boolean }
        requiresCheckpointReset: { type: boolean }
        checkpointResetReason: { type: [string, "null"] }
    TelegramSourcePreparationEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramSourcePreparation" }
        requestId: { type: string }
    TelegramMonitorProgressTask:
      type: object
      additionalProperties: false
      required:
        - role
        - sourceKey
        - totalRows
        - completedRows
        - remainingRows
        - percent
        - cursor
        - blocker
        - issues
        - checkedAt
      properties:
        role: { type: string, enum: [chats, messages] }
        sourceKey: { type: string, enum: [telegram-monitor-chats, telegram-monitor-messages] }
        totalRows: { type: integer, minimum: 0 }
        completedRows: { type: [integer, "null"], minimum: 0 }
        remainingRows: { type: [integer, "null"], minimum: 0 }
        percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        cursor:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        blocker: { type: [string, "null"], enum: [source_cursor_unconfigured, source_cursor_unsafe, null] }
        issues:
          type: array
          items: { type: string }
        checkedAt: { type: string, format: date-time }
    TelegramMonitorProgress:
      type: object
      additionalProperties: false
      required: [pipelineKey, checkedAt, totalRows, completedRows, remainingRows, percent, tasks]
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        checkedAt: { type: string, format: date-time }
        totalRows: { type: integer, minimum: 0 }
        completedRows: { type: [integer, "null"], minimum: 0 }
        remainingRows: { type: [integer, "null"], minimum: 0 }
        percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        tasks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramMonitorProgressTask" }
    TelegramMonitorProgressEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramMonitorProgress" }
        requestId: { type: string }
    DirectPostgresConnection:
      type: object
      additionalProperties: false
      required: [host, database, username, password, table]
      description: >-
        Direct source connection. The password is plaintext catalog data and is
        visible only on the Admin-token source surface. cursorColumn/idColumn
        may remain absent while an unsafe source is paused.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5432 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full], default: require }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", default: public }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    LegacyDsnConnection:
      type: object
      additionalProperties: true
      required: [dsnEnv, schema, table]
      description: Existing-record compatibility only; new source requests use DirectPostgresConnection.
      properties:
        dsnEnv: { type: string, minLength: 1 }
        schema: { type: string }
        table: { type: string }
        cursorColumn: { type: string }
        idColumn: { type: string }
    StoredDirectPostgresConnection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Admin-visible stored direct connection. A source migrated from the
        retired Provider registry is paused and may temporarily lack password;
        create requests still use DirectPostgresConnection and require it.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: [string, "null"], minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        sourceContractId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          readOnly: true
          description: Internal prepared-source generation used by checkpoint compatibility.
    DirectPostgresConnectionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial direct connection update; the server merges it with the saved connection and tests the complete candidate before saving.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    DatabaseSourceCreate:
      type: object
      additionalProperties: false
      required: [sourceKey, displayName, sourceKind, connection]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sourceKind: { type: string, const: database }
        datasetId: { type: string, minLength: 1, maxLength: 200 }
        platform: { type: string, minLength: 1, maxLength: 100 }
        objectType: { type: string, minLength: 1, maxLength: 100 }
        connection: { $ref: "#/components/schemas/DirectPostgresConnection" }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 60 }
    FileSourceCreate:
      type: object
      additionalProperties: false
      required: [sourceKey, displayName, sourceKind]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sourceKind: { type: string, const: file }
        datasetId: { type: string, minLength: 1, maxLength: 200 }
        platform: { type: string, minLength: 1, maxLength: 100, default: external }
        objectType: { type: string, minLength: 1, maxLength: 100, default: record }
    ExternalSourceCreate:
      oneOf:
        - $ref: "#/components/schemas/DatabaseSourceCreate"
        - $ref: "#/components/schemas/FileSourceCreate"
      discriminator:
        propertyName: sourceKind
    ExternalSourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        connection: { $ref: "#/components/schemas/DirectPostgresConnectionPatch" }
        status: { type: string, enum: [active, paused] }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
    ExternalSource:
      type: object
      additionalProperties: true
      required: [sourceKey, sourceKind, status, connection]
      properties:
        id: { type: string, format: uuid }
        sourceKey: { type: string }
        displayName: { type: string }
        sourceKind: { type: string, enum: [database, file] }
        datasetId: { type: string }
        platform: { type: string }
        objectType: { type: string }
        status: { type: string, enum: [active, paused] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/StoredDirectPostgresConnection"
            - $ref: "#/components/schemas/LegacyDsnConnection"
            - type: object
              additionalProperties: false
              maxProperties: 0
              description: File sources have no connection fields.
        syncIntervalSeconds: { type: [integer, "null"], minimum: 60, maximum: 86400 }
    ExternalSourceEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/ExternalSource" }
        requestId: { type: string }
    SourceMappingCreate:
      type: object
      additionalProperties: false
      required: [fieldMap]
      properties:
        fieldMap: { type: object, minProperties: 1, additionalProperties: true }
        origin: { type: string, minLength: 1, maxLength: 100, default: manual }
        agentModel: { type: [string, "null"] }
        agentConfidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        notes: { type: [string, "null"], maxLength: 4000 }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [platform, query]
      properties:
        platform: { type: string, pattern: "^(?![Aa][Ll][Ll]$|\\*$)[A-Za-z0-9_:-]+$", description: One explicit platform; `all` (case-insensitive) and `*` are forbidden., example: xiaohongshu }
        query: { type: string, minLength: 1, maxLength: 500, description: Non-blank search query; surrounding whitespace is trimmed. }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor: { type: string, minLength: 1, maxLength: 8192, description: Non-blank opaque cursor returned by the previous page; send it unchanged. Telegram cursors are signed and bound to the normalized request. }
    TelegramSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        scope: { type: string, enum: [messages, chats, all], default: messages }
        chatId: { type: string, minLength: 1, maxLength: 256 }
        authorId: { type: string, minLength: 1, maxLength: 256 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        matchMode: { type: string, const: full_text, default: full_text }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 50 }
        cursor:
          type: string
          minLength: 1
          maxLength: 8192
          description: HMAC-signed version-2 opaque nextCursor bound to the normalized query, filters, match mode and page size; return unchanged.
    NightAllDataSearchEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/NightAllDataSearchPlatformResult"
        requestId: { type: string, format: uuid }
        traceId: { type: string }
    NightAllDataSearchPlatformEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/NightAllDataSearchPlatformResult"
        requestId: { type: string, format: uuid }
        traceId: { type: string }
    NightAllDataSearchPlatformResult:
      type: object
      additionalProperties: false
      required: [contractVersion, platform, query, items, pageInfo, status, warnings, meta]
      properties:
        contractVersion: { type: string, const: night-all.data-search.v1 }
        platform: { type: string, minLength: 1 }
        query: { type: string, minLength: 1 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/NightAllDataSearchItem"
        pageInfo:
          $ref: "#/components/schemas/NightAllDataSearchPageInfo"
        status: { type: string, enum: [ok, partial, failed] }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/NightAllDataSearchWarning"
        meta:
          $ref: "#/components/schemas/NightAllDataSearchMeta"
    NightAllDataSearchItem:
      type: object
      additionalProperties: false
      required:
        - id
        - externalId
        - platform
        - contentType
        - url
        - title
        - text
        - publishedAt
        - collectedAt
        - author
        - metrics
        - media
        - source
      properties:
        id: { type: string, minLength: 1 }
        externalId: { type: [string, "null"] }
        platform: { type: string, minLength: 1 }
        contentType: { type: [string, "null"] }
        url: { type: [string, "null"] }
        title: { type: [string, "null"] }
        text: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        author:
          type: object
          additionalProperties: false
          required: [id, name, avatarUrl]
          properties:
            id: { type: [string, "null"] }
            name: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"] }
        metrics:
          type: object
          additionalProperties: false
          required: [likes, comments, shares, views, bookmarks]
          properties:
            likes: { type: [number, "null"], minimum: 0 }
            comments: { type: [number, "null"], minimum: 0 }
            shares: { type: [number, "null"], minimum: 0 }
            views: { type: [number, "null"], minimum: 0 }
            bookmarks: { type: [number, "null"], minimum: 0 }
        media:
          type: object
          additionalProperties: false
          required: [coverUrl, images, videos]
          properties:
            coverUrl: { type: [string, "null"] }
            images:
              type: array
              items: { type: string }
            videos:
              type: array
              items: { type: string }
        source:
          type: object
          additionalProperties: false
          required: [provider, endpointId]
          description: >-
            Both fields are always present to preserve the strict Night-All-v1
            item contract. Generic Night-All-backed responses replace both
            private upstream labels with null. Stored Telegram search returns
            provider null and endpointId hub-canonical-search.
          properties:
            provider:
              oneOf:
                - { type: string, enum: [tikhub, rapidapi, justone] }
                - { type: "null" }
            endpointId: { type: [string, "null"] }
    NightAllDataSearchPageInfo:
      type: object
      additionalProperties: false
      required: [pageIndex, pageSize, returnedCount, hasMore, nextCursor, cursorType]
      properties:
        pageIndex: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 0, maximum: 100 }
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor: { type: [string, "null"], maxLength: 8192, description: Opaque cursor for the next page; search callers return it unchanged. }
        cursorType: { type: string, enum: [opaque, none] }
    NightAllDataSearchWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    NightAllDataSearchMeta:
      type: object
      additionalProperties: false
      properties:
        capability: { type: string, const: search_posts }
        capabilityStatus: { type: string, enum: [declared, catalogued, ready, degraded, disabled] }
        paginationMode: { type: string, enum: [cursor, compound, page, offset, composite, none, unknown] }
        sourceProvider: { type: [string, "null"], minLength: 1 }
        endpointId: { type: [string, "null"], minLength: 1 }
        providerCalls: { type: integer, minimum: 0 }
        durationMs: { type: integer, minimum: 0 }
        error:
          $ref: "#/components/schemas/NightAllDataSearchError"
    NightAllDataSearchError:
      type: object
      additionalProperties: false
      required: [code, message, statusCode]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        statusCode: { type: integer, minimum: 400, maximum: 599 }
    RequestStatus:
      type: object
      required: [id, platform, status]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        status: { type: string, enum: [reserved, committed, released, unknown] }
        units: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        reservedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    TelegramRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - externalId
        - platform
        - objectType
        - contentType
        - title
        - text
        - url
        - author
        - relations
        - attributes
        - metrics
        - eventTime
        - collectedAt
        - editedAt
        - media
        - entities
        - links
        - lineage
        - dataVersion
      properties:
        id:
          type: string
          description: Stable external identity within the fixed Hub dataset.
        externalId:
          type: string
          description: Alias of id retained for data-search contract compatibility.
        platform: { type: string, const: telegram }
        objectType: { type: string, enum: [chat, message] }
        contentType: { type: [string, "null"] }
        title: { type: [string, "null"] }
        text: { type: [string, "null"] }
        url: { type: [string, "null"] }
        author:
          type: object
          additionalProperties: false
          required: [id, name, username]
          properties:
            id: { type: [string, "null"] }
            name: { type: [string, "null"] }
            username: { type: [string, "null"] }
        relations:
          type: object
          additionalProperties: false
          properties:
            chatId: { type: string }
            messageId: { type: string }
            replyToMessageId: { type: string }
            threadId: { type: string }
            groupedId: { type: string }
        attributes:
          type: object
          additionalProperties: false
          properties:
            username: { type: string }
            chatType: { type: string }
            memberCount: { type: number }
            isOutgoing: { type: boolean }
        metrics:
          type: object
          additionalProperties: false
          properties:
            likes: { type: number }
            comments: { type: number }
            shares: { type: number }
            views: { type: number }
            bookmarks: { type: number }
            members: { type: number }
        media:
          type: object
          additionalProperties: false
          properties:
            media_kind: { type: string }
            status: { type: string }
            telegram_id: { type: string }
            file_name: { type: string }
            extension: { type: string }
            mime_type: { type: string }
            size_bytes: { type: number }
        entities:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              type: { type: string }
              offset: { type: number }
              length: { type: number }
              url: { type: string }
              user_id: { type: number }
        links:
          type: array
          maxItems: 0
          description: >-
            Always empty in this contract version. Source link members remain
            private until their object fields have an explicit reviewed
            allowlist and versioned public schema.
          items: {}
        eventTime: { type: [string, "null"], format: date-time }
        collectedAt: { type: [string, "null"], format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        lineage:
          type: object
          additionalProperties: false
          required: [datasetId, origin]
          properties:
            datasetId: { type: string, enum: [telegram.monitor.chats.v1, telegram.monitor.messages.v1] }
            origin: { type: string, enum: [hub-direct, hub-import] }
        dataVersion: { type: string }
    TelegramPageInfo:
      type: object
      additionalProperties: false
      required: [returnedCount, hasMore, nextCursor]
      properties:
        returnedCount: { type: integer, minimum: 0, maximum: 100 }
        hasMore: { type: boolean }
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null when hasMore is false.
    TelegramPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, pageInfo]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TelegramRecord"
            pageInfo:
              $ref: "#/components/schemas/TelegramPageInfo"
        requestId: { type: string }
  responses:
    AdminData:
      description: Admin-token-only operation result.
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              data: {}
              requestId: { type: string }
    TelegramPage:
      description: >-
        Strict customer-safe canonical projection. Raw rows, extensions,
        database/source lineage and provider-private values are omitted.
      headers:
        x-request-id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TelegramPageEnvelope"
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, requestId]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details:
                    description: Optional bounded machine-readable context for the stable error code.
              requestId: { type: string }
