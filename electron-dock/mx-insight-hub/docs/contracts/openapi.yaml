        "404": { $ref: "#/components/responses/Error" }
  /data-center:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: getDataCenter
      summary: List PostgreSQL-authoritative datasets and safe recent record metadata.
      description: >-
        Break-glass Admin Token only. Counts come from canonical PostgreSQL
        truth rather than Elasticsearch. The response deliberately omits body,
        raw payload, stable fields, extensions and credentials.
      security:
        - adminToken: []
      parameters:
        - name: datasetId
          in: query
          schema: { type: string, minLength: 1 }
        - name: platform
          in: query
          schema: { type: string, minLength: 1 }
        - name: objectType
          in: query
          schema: { type: string, minLength: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /data-center/records:
    servers:
      - url: /internal/v1/admin
    get:
      operationId: browseDataCenterRecords
      summary: Browse or search full canonical records for Admin evidence review.
      description: >-
        Break-glass Admin Token only. The response pageInfo includes the 1-based
        page, pageSize, exact total, totalPages, hasMore and nextCursor. Empty q
        supports direct PostgreSQL pages and the legacy keyset cursor. q uses
        Elasticsearch ranking/highlight with the existing PostgreSQL fallback;
        direct page jumps are limited to the first 10,000 ranked hits and report
        maxDirectPage, while cursor traversal remains available for deeper reads.
        relatedProvince is an Admin evidence filter over PostgreSQL canonical truth,
        not a public quality/qualification gate. provinceRelation selects event,
        publisher, display, typed report attribution, upstream recall hint,
        subject/mentioned-area assertion, canonical admin1, or their union. Admin
        audit includes current accepted or proposed assertions and recall hints;
        related never means accepted event geography. A combined q + relatedProvince request deliberately
        uses PostgreSQL title/body/external-ID substring matching so an Elasticsearch
        projection that lacks relation metadata cannot silently drop matches.
        page and cursor are mutually exclusive. The Admin response is intentionally
        not redacted and may include the current revision payload, extensions and
        lineage. Host paths and saved connection credentials are never included.
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: datasetId
          in: query
          schema: { type: string, minLength: 1 }
        - name: platform
          in: query
          schema: { type: string, minLength: 1 }
        - name: objectType
          in: query
          schema: { type: string, minLength: 1 }
        - name: relatedProvince
          in: query
          description: ISO 3166-2:CN code or supported Chinese province name.
          schema: { type: string, minLength: 1 }
        - name: provinceRelation
          in: query
          description: Requires relatedProvince; defaults to the union of all explicit relations.
          schema:
            type: string
            enum: [any, event, publisher, display, report, recall, related, canonical]
            default: any
        - name: sort
          in: query
          description: Defaults to newest. relatedProvince does not support relevance.
          schema:
            type: string
            enum: [newest, oldest, relevance]
            default: newest
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: page
          in: query
          description: Optional 1-based direct page; mutually exclusive with cursor.
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          description: Optional opaque keyset/search cursor; mutually exclusive with page.
          schema: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        "200": { $ref: "#/components/responses/AdminData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/capabilities:
    get:
      operationId: listCapabilities
      description: >-
        Lists granted Hub platform data surfaces and generic capabilities.
        data.legacySearch is the Hub-pinned, grant-filtered dispatch matrix for
        the three Night-All compatibility operations. It is compiled into the
        deployed Hub contract rather than discovered from Night-All at request
        time. A platform must appear in both supportedPlatforms and
        readyPlatforms before dispatch; a data.platforms entry alone, including
        telegram, is not sufficient. In this pinned contract readyPlatforms
        means Hub dispatch eligibility; it does not prove current Night-All
        handler, endpoint, provider, credential, or upstream health.
        legacySearch is null when the consumer has no granted platform eligible
        for Night-All compatibility; compatibility calls then fail closed. The
        Telegram entry advertises message context per dataset under context;
        context.ready is an index-serving gate independent from the broader
        Telegram platform ready flag. The
        Hub-owned public_opinion entry advertises province_feed,
        province_coverage, item_detail and stored_search. Its ready flag requires
        both an active fixed ingestion
        source and both valid Hub serving indexes; it is not an additional grant
        or a guarantee of freshness, and an inactive source may still have
        previously indexed records available.
      responses:
        "200":
          description: Capabilities granted to this consumer.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [platforms, legacySearch, capabilities]
                    properties:
                      platforms:
                        type: array
                        items:
                          type: object
                          required: [platform, ready]
                          properties:
                            platform: { type: string }
                            ready: { type: boolean }
                            capabilities:
                              type: array
                              items: { type: string }
                            source:
                              type: string
                              enum: [hub]
                              description: Present for Hub-owned platform entries.
                            servingMode:
                              type: string
                              enum: [stored]
                              description: Present for Hub-owned stored-data entries.
                            context: { $ref: "#/components/schemas/CanonicalContextCapability" }
                      legacySearch:
                        description: >-
                          Hub-pinned, grant-filtered dispatch matrix, or null when
                          the consumer has no granted platform eligible for
                          Night-All compatibility. It is authoritative only for
                          Hub routing and is not a live Night-All capability or
                          provider-readiness result. Null fails closed for every
                          compatibility operation.
                        oneOf:
                          - { $ref: "#/components/schemas/NightAllLegacySearchCapabilities" }
                          - { type: "null" }
                      capabilities:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [capability, ready]
                          properties:
                            capability: { type: string, enum: [nlp.tokenize, public_opinion.all_ingested.read, public_opinion.diagnostics.read] }
                            ready: { type: boolean }
                  requestId: { type: string }
              example:
                data:
                  platforms:
                    - platform: telegram
                      ready: true
                      capabilities: [monitor_chats, monitor_messages, sqlite_chats, sqlite_messages, multi_source_conversations, conversation_filter, stored_search, entity_search, message_context]
                      source: hub
                      servingMode: stored
                      context:
                        contractVersion: mx-insight-hub.canonical-context.v1
                        ready: true
                        defaultBefore: 10
                        defaultAfter: 10
                        maxBefore: 50
                        maxAfter: 50
                        datasets:
                          - datasetId: telegram.monitor.messages.v1
                            objectType: message
                            streamType: chat
                            ordering: [eventTime, canonicalId]
                            upstreamCompleteness: { status: unknown, basis: null, through: null }
                          - datasetId: telegram.sqlite.messages.v1
                            objectType: message
                            streamType: chat
                            ordering: [eventTime, canonicalId]
                            upstreamCompleteness: { status: bounded, basis: append_only_overlap, through: null }
                    - platform: public_opinion
                      ready: false
                      capabilities: [province_feed, province_coverage, region_catalog, region_feed, item_detail, stored_search, diagnostics]
                      source: hub
                      servingMode: stored
                    - platform: source_catalog
                      ready: true
                      capabilities: [catalog_entries, catalog_metadata, catalog_detail, filtered_browse]
                      source: hub
                      servingMode: stored
                    - platform: xiaohongshu
                      ready: true
                    - platform: twitter
                      ready: true
                  legacySearch:
                    contractVersion: night-all.legacy-search-capabilities.v1
                    operations:
                      raw:
                        supportedPlatforms: [twitter, xiaohongshu]
                        readyPlatforms: [twitter, xiaohongshu]
                      crawl:
                        supportedPlatforms: [twitter, xiaohongshu]
                        readyPlatforms: [twitter, xiaohongshu]
                      user-info:
                        supportedPlatforms: [twitter, xiaohongshu]
                        readyPlatforms: [twitter, xiaohongshu]
                  capabilities:
                    - { capability: nlp.tokenize, ready: true }
                    - { capability: public_opinion.all_ingested.read, ready: true }
                    - { capability: public_opinion.diagnostics.read, ready: true }
                requestId: 00000000-0000-4000-8000-000000000001
  /tools/tokenize:
    post:
      operationId: tokenizeText
      summary: Tokenize bounded text with the consumer's generic capability grant.
      description: >-
        Requires an issued API Key and the separate nlp.tokenize grant; no
        data-platform grant is implied. New or never-configured consumers are
        granted it by default and administrators may explicitly disable it.
        The default is 1000 requests per rolling 3600-second consumer +
        capability window, shared by all API Keys for that consumer. The
        response names the backend that actually produced the tokens and
        whether fallback degraded quality. Idempotent replay does not invoke
        the segmenter or consume quota twice.
      x-mx-error-codes:
        "400": [invalid_request, unsupported_fields, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [capability_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "413": [payload_too_large]
        "429": [quota_exceeded]
        "503": [tokenizer_unavailable, tokenizer_invalid_response]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenizeRequest" }
      responses:
        "200":
          description: Bounded tokens and actual backend metadata.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenizeEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/search:
    post:
      operationId: searchData
      description: >-
        Stable Night-All-v1 search facade. For platform telegram, Hub serves
        canonical local data with the same fixed item source and response meta
        labels documented by /data/telegram/search; PostgreSQL degradation is
        represented only by warnings. Other enabled platforms use the governed
        private Night-All adapter, except public_opinion: that Hub-local stored
        platform is rejected here and must use the province feed,
        /data/stored/search or /data/canonical/search. Telegram pagination follows the signed,
