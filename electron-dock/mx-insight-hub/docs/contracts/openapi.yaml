          description: Nearest stored messages around the canonical anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalContextEnvelope"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/public-opinion/provinces/{province}/items:
    get:
      operationId: listProvincePublicOpinionItems
      summary: List hot or latest public-opinion items for one province.
      description: >-
        Requires the API key's consumer to have the explicit public_opinion
        platform grant. The province path is normalized to a stable ISO
        3166-2:CN code. By default includeCandidates=false preserves the
        formal-only contract. qualified adds Hub-qualified candidates at or
        above minQualityScore (default 80); includeCandidates=all requires both
        from and to. This
        safe GET reads the Hub canonical PostgreSQL
        projection and is independently metered on every call and retry. Both
        valid Hub serving indexes are required. hot excludes records without
        heatScore and sorts by heatScore, effective sort time and id; latest
        sorts by effective sort time, collectedAt and id. Effective sort time is
        publishedAt when present, otherwise collectedAt; this fallback is not
        exposed as publishedAt. Formal rows retain publishedAt-only window
        semantics. Candidate rows with no publishedAt use collectedAt only for
        the explicit bounded candidate window. Both orders use a
        signed keyset cursor. Only the documented customer-safe item allowlist
        is returned; raw rows, strategy/run ids, source coordinates, extensions,
        model reasoning and lineage remain private.
      x-mx-allowed-query-fields: [sort, from, to, includeCandidates, minQualityScore, pageSize, cursor]
      x-mx-error-codes:
        "400": [invalid_province, invalid_request, invalid_sort, page_size_exceeded, invalid_cursor, unsupported_fields, candidate_scope_required]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "429": [quota_exceeded]
        "503": [stored_data_unavailable, serving_indexes_unavailable]
      parameters:
        - name: province
          in: path
          required: true
          description: >-
            Province as an ISO 3166-2:CN code, short Chinese name or official
            Chinese name. Examples: CN-JS, 江苏, 江苏省. Chinese names must be
            URL-encoded.
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: sort
          in: query
          required: false
          description: >-
            hot orders by heat score, effective sort time and canonical id;
            rows without a heat score are excluded. latest orders by effective
            sort time, collection time and canonical id. Effective sort time is
            publishedAt when present, otherwise collectedAt.
          schema: { type: string, enum: [hot, latest], default: hot }
        - name: from
          in: query
          required: false
          description: Inclusive RFC3339 lower bound. Formal rows use publishedAt; undated candidate rows use collectedAt.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Inclusive RFC3339 upper bound. Formal rows use publishedAt; undated candidate rows use collectedAt.
          schema: { type: string, format: date-time }
        - name: includeCandidates
          in: query
          required: false
          description: Defaults to false. qualified (or true) adds qualified candidates; all requires from and to.
          schema: { type: string, enum: ["false", "true", qualified, all], default: "false" }
        - name: minQualityScore
          in: query
          required: false
          description: Candidate quality threshold from 0 to 100; qualified defaults to 80.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: pageSize
          in: query
          required: false
          description: Defaults to 20; maximum 100, and the public_opinion platform policy may impose a lower limit.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: >-
            HMAC-signed opaque nextCursor bound to province, sort, time bounds
            and page size. Return it unchanged; changing any bound requires
            starting from the first page.
          schema: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: A customer-safe page of canonical public-opinion items for one normalized province.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOpinionPageEnvelope" }
              example:
                data:
                  contractVersion: mx-insight-hub.public-opinion.v1
                  province: { code: CN-JS, name: 江苏 }
                  sort: hot
                  items:
                    - id: 11111111-1111-4111-8111-111111111111
                      title: 江苏舆情样例
                      summary: 公开摘要
                      url: https://example.com/items/11111111
                      publishedAt: "2026-08-23T03:00:00.000Z"
                      collectedAt: "2026-08-23T03:01:00.000Z"
                      province: { code: CN-JS, name: 江苏 }
                      heatScore: 88.5
                      origin: { name: 江苏新闻广播, type: social, platform: douyin }
                  pageInfo: { returnedCount: 1, hasMore: false, nextCursor: null }
                requestId: 00000000-0000-4000-8000-000000000005
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /data/public-opinion/province-coverage:
    get:
      operationId: getPublicOpinionProvinceCoverage
      summary: Compare public-opinion availability across every province.
      description: >-
        Requires the public_opinion grant, valid Hub serving indexes and an
        explicit from/to window. The default is formal-only. qualified adds
        candidates at or above minQualityScore (default 80); all includes all
        candidates, optionally narrowed by minQualityScore. Formal rows use
        publishedAt for the window; undated candidates use collectedAt. targetPerProvince
