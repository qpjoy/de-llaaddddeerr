  /data/telegram/search:
    post:
      operationId: searchStoredTelegram
      summary: Search canonical Telegram chats/messages without an upstream provider call.
      description: >-
        Returns the Night-All data-search v1 envelope from Hub-owned canonical
        storage. sourceScope defaults to monitor for backward compatibility;
        explicit all searches Monitor and SQLite imports together. Omitting
        chatId searches globally, while chatId/chatKey restricts one
        conversation. Elasticsearch is the ranked projection; PostgreSQL substring
        search is the documented degraded path and is reported only through a
        search_projection_degraded warning, never through meta.searchMode.
        Every item has source.provider null and source.endpointId
        hub-canonical-search; response meta has sourceProvider mx-insight-hub
        and endpointId hub-canonical-search. These are serving-plane labels;
        physical source/provider identity and credentials are never returned.
        Night-All-v1 metrics are non-negative numbers or null; invalid or
        negative source sentinels are normalized to null. Pagination uses an
        HMAC-signed version-3 opaque cursor bound to the normalized query,
        filters, page size and bounded first-page analysis state; later pages
        do not re-segment. Elasticsearch uses a renewable two-minute PIT,
        _score/eventTime/id/_shard_doc search_after and size plus one, independent of
        result totals and the 10,000-hit window. PostgreSQL fallback uses a
        NULL-aware event_time/id keyset and never OFFSET. First-page ES failure
        may select PostgreSQL with a warning; the selected cursor mode is sticky.
        An unavailable existing ES cursor returns 503 without fallback, and an
        expired PIT returns 410.
      x-mx-error-codes:
        "400": [invalid_request, invalid_cursor, page_size_exceeded, unsupported_fields, unsupported_match_mode, idempotency_key_required, invalid_idempotency_key]
        "401": [api_key_required, invalid_api_key]
        "403": [platform_not_granted]
        "409": [request_in_progress, idempotency_conflict, request_outcome_unknown]
        "410": [search_cursor_expired]
        "429": [quota_exceeded]
        "503": [stored_search_unavailable, search_cursor_unavailable]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSearchRequest"
      responses:
        "200":
          description: Night-All-v1-compatible stored search response.
          headers:
            x-mx-insight-request-id:
              schema: { type: string, format: uuid }
            idempotent-replay:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightAllDataSearchPlatformEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /data/telegram/entities/search:
    get:
      operationId: searchTelegramEntities
      summary: Fuzzy-search Telegram authors and chats from Hub projections.
      description: >-
        Searches names/usernames and chat titles/usernames. Elasticsearch uses
        ranked name/prefix/CJK fields and PostgreSQL trigram/substring search is
        the documented fallback. This metered safe GET makes no Night-All call.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Ranked union of author and chat entities.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /requests/{requestId}:
    get:
      operationId: getRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Caller-owned request status without stored upstream response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RequestStatus"
  /usage:
    get:
      operationId: getUsage
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Usage visible to the authenticated consumer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requests: { type: integer }
                      committed: { type: integer }
                      released: { type: integer }
                      unknown: { type: integer }
                      units: { type: integer }
                      byPlatform: { type: object, additionalProperties: true }
                      byCapability: { type: object, additionalProperties: true }
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: x-mx-insight-admin-token
      description: >-
        Platform break-glass Admin Token; the only credential accepted by
        source-management routes and Agent-provider writes.
    launcherSession:
      type: apiKey
      in: header
      name: x-mx-insight-admin-token
      description: >-
        Launcher-issued management session carried in the same bootstrap
        header as the Admin Token. The server compares the Admin Token first,
        then resolves any non-matching value through Launcher and enforces the
        Hub capability held in the target tenant. This is not a mih_live or
        mih_test public API key.
    bearerKey:
      type: http
      scheme: bearer
      bearerFormat: MX-API-Key
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    SourceKey:
      name: sourceKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
    AgentPipelineKey:
      name: pipelineKey
      in: path
      required: true
      description: Current governed Agent analysis pipeline identifier.
      schema: { type: string, const: province-geography-v1 }
    SourceFilename:
      name: filename
      in: query
      required: true
      description: Basename used to select the supported CSV/TSV, JSON/JSONL/NDJSON, TXT/MD or XLSX/XLSM parser; the request body contains the raw file bytes.
      schema: { type: string, minLength: 1, maxLength: 255 }
    TelegramChatId:
      name: chatId
      in: query
      required: false
      description: >-
        Exact normalized chat identifier, or the source-qualified chatKey
        returned by the chats route.
      schema: { type: string, minLength: 1, maxLength: 256 }
    TelegramSourceScope:
      name: sourceScope
      in: query
      required: false
      description: >-
        Stored corpus to read. Defaults to monitor for backward compatibility;
        all merges Monitor and SQLite imports. Explicit use opts into the
        additive source-aware contract.
      schema: { type: string, enum: [all, monitor, sqlite], default: monitor }
    TelegramKind:
      name: kind
      in: query
      required: false
      description: Normalized conversation kind filter.
      schema: { type: string, enum: [all, channel, group, unknown], default: all }
    TelegramQuery:
      name: query
      in: query
      required: false
      description: Case-insensitive conversation title or username substring.
      schema: { type: string, minLength: 1, maxLength: 200 }
    TelegramFrom:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound on eventTime. Must be a complete RFC3339
        date-time with T, seconds, and Z or a numeric offset; date-only and
        space-separated forms are rejected.
      schema: { type: string, format: date-time }
    TelegramTo:
      name: to
      in: query
      required: false
      description: >-
        Inclusive upper bound on eventTime in the same complete RFC3339 form;
        must not precede from.
      schema: { type: string, format: date-time }
    TelegramPageSize:
      name: pageSize
      in: query
      required: false
      description: >-
        Defaults to 50 or the consumer's lower policy limit. The effective
        maximum is the consumer telegram.maxPageSize and never exceeds 100.
      schema: { type: integer, minimum: 1, maximum: 100 }
    TelegramCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque nextCursor from the previous page; return unchanged with the same
        filters and pageSize. Legacy Monitor cursors are at most 1024
        characters; extended source/filter cursors are at most 2048.
      schema: { type: string, minLength: 1, maxLength: 2048 }
  schemas:
    AgentProviderSafe:
      type: object
      additionalProperties: false
      required: [id, baseUrl, model, timeoutMs, enabled, priority, authMode, keyConfigured]
      description: >-
        Redacted provider metadata. apiKey, apiKeyEnv, Secret names and
        environment-variable names are intentionally not members of this schema.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          description: Environment providers may retain legacy uppercase IDs; database-managed IDs are lowercase.
        baseUrl: { type: string, format: uri }
        model: { type: string, minLength: 1, maxLength: 200 }
        timeoutMs: { type: integer, minimum: 1000, maximum: 300000 }
        dimensions: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        authMode: { type: string, enum: [bearer, none] }
        keyConfigured:
          type: boolean
          description: Presence only; no credential value or lookup name is returned.
    AgentRuntimeProviderStatus:
      type: object
      additionalProperties: false
      required: [id, model, keyConfigured, circuit]
      properties:
        id: { type: string }
        model: { type: string }
        dimensions: { type: integer, minimum: 1 }
        keyConfigured: { type: boolean }
        circuit: { type: string, enum: [closed, degraded, open] }
    AgentProviderSetting:
      type: object
      additionalProperties: false
      required: [kind, source, revision, providers, updatedBy, updatedAt]
      description: Safe persisted provider setting; credential values and names are absent.
      properties:
        kind: { type: string, enum: [chat, embedding] }
        source: { type: string, enum: [environment, database] }
        revision: { type: integer, minimum: 0 }
        providers:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentProviderSafe" }
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
        runtimeApplied:
          type: boolean
          description: Present on PUT responses; false corresponds to HTTP 202.
    AgentProviderSettingApplied:
      allOf:
        - { $ref: "#/components/schemas/AgentProviderSetting" }
        - type: object
          required: [runtimeApplied]
          properties:
            runtimeApplied: { type: boolean, const: true }
    AgentProviderSettingDeferred:
      allOf:
        - { $ref: "#/components/schemas/AgentProviderSetting" }
        - type: object
          required: [runtimeApplied]
          properties:
            runtimeApplied: { type: boolean, const: false }
    AgentOverview:
      type: object
      additionalProperties: false
      required: [available, pipelines]
      properties:
        available: { type: boolean }
        chat:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentRuntimeProviderStatus" }
        embeddings:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentRuntimeProviderStatus" }
        embeddingDimensions: { type: [integer, "null"], minimum: 1 }
        settings:
          type: object
          additionalProperties: false
          required: [chat, embedding]
          properties:
            chat: { $ref: "#/components/schemas/AgentProviderSetting" }
            embedding: { $ref: "#/components/schemas/AgentProviderSetting" }
        pipelines:
          type: array
          description: Durable derived-analysis status; independent from Agent runtime availability.
          items: { $ref: "#/components/schemas/AgentAnalysisPipeline" }
    AgentOverviewEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentOverview" }
        requestId: { type: string }
    AgentProviderSettingAppliedEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentProviderSettingApplied" }
        requestId: { type: string }
    AgentProviderSettingDeferredEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentProviderSettingDeferred" }
        requestId: { type: string }
    AgentProviderTest:
      type: object
      additionalProperties: false
      required: [ok, kind, providerId, model, latencyMs, testedAt]
      properties:
        ok: { type: boolean, const: true }
        kind: { type: string, enum: [chat, embedding] }
        providerId: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        latencyMs: { type: number, minimum: 0 }
        testedAt: { type: string, format: date-time }
    AgentProviderTestEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentProviderTest" }
        requestId: { type: string }
    AgentAnalysisTaskCounts:
      type: object
      additionalProperties: false
      required: [pending, running, succeeded, dead, superseded, total, oldestPendingAt, lastCompletedAt]
      properties:
        pending: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        dead: { type: integer, minimum: 0 }
        superseded: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        oldestPendingAt: { type: [string, "null"], format: date-time }
        lastCompletedAt: { type: [string, "null"], format: date-time }
    AgentAssertionCounts:
      type: object
      additionalProperties: false
      required: [proposed, accepted, rejected, superseded, total]
      properties:
        proposed: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        superseded: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    AgentClassificationAssertion:
      type: object
      additionalProperties: false
      required:
        - assertionId
        - taskId
        - pipelineKey
        - recordId
        - sourceObjectRevisionId
        - canonicalRevision
        - fieldKey
        - proposedValue
        - method
        - confidence
        - evidenceRefs
        - taxonomyVersion
        - ruleVersion
        - providerId
        - model
        - promptVersion
        - status
        - createdAt
      properties:
        assertionId: { type: string, format: uuid }
        taskId: { type: integer, minimum: 1 }
        pipelineKey: { type: string }
        recordId: { type: string, format: uuid }
        sourceObjectRevisionId: { type: integer, minimum: 1 }
        canonicalRevision: { type: integer, minimum: 1 }
        fieldKey:
          type: string
          enum:
            - geography.event_admin1_code
            - geography.publisher_admin1_code
            - geography.geo_scope
            - classification.source_class
            - classification.event_type
        proposedValue: {}
        method: { type: string, enum: [source, rule, agent, manual] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidenceRefs:
          type: array
          items:
            type: object
            additionalProperties: true
        taxonomyVersion: { type: string }
        ruleVersion: { type: [string, "null"] }
        providerId: { type: [string, "null"] }
        model: { type: [string, "null"] }
        promptVersion: { type: [string, "null"] }
        status: { type: string, enum: [proposed, accepted, rejected, superseded] }
        createdAt: { type: string, format: date-time }
    AgentAnalysisPipeline:
      type: object
      additionalProperties: false
      required:
        - pipelineKey
        - displayName
        - taskType
        - status
        - revision
        - analysisVersion
        - taxonomyVersion
        - ruleVersion
        - promptVersion
        - itemsPerMinute
        - maxInFlight
        - nextDispatchAt
        - updatedBy
        - updatedAt
        - tasks
        - assertions
      properties:
        pipelineKey: { type: string, const: province-geography-v1 }
        displayName: { type: string }
        taskType: { type: string, const: record.classification }
        status: { type: string, enum: [paused, active] }
        revision: { type: integer, minimum: 0 }
        analysisVersion: { type: string }
        taxonomyVersion: { type: string }
        ruleVersion: { type: string }
        promptVersion: { type: string }
        itemsPerMinute: { type: integer, minimum: 1, maximum: 60 }
        maxInFlight: { type: integer, minimum: 1, maximum: 1 }
        nextDispatchAt: { type: [string, "null"], format: date-time }
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
        tasks: { $ref: "#/components/schemas/AgentAnalysisTaskCounts" }
        assertions: { $ref: "#/components/schemas/AgentAssertionCounts" }
        recentAssertions:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentClassificationAssertion" }
    AgentPipelineUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      minProperties: 2
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        status: { type: string, enum: [paused, active] }
        itemsPerMinute: { type: integer, minimum: 1, maximum: 60 }
    AgentAnalysisPipelineEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentAnalysisPipeline" }
        requestId: { type: string }
    AgentPipelineMaterializeResult:
      type: object
      additionalProperties: false
      required: [pipelineKey, enqueued, pipeline]
      properties:
        pipelineKey: { type: string, const: province-geography-v1 }
        enqueued: { type: integer, minimum: 0 }
        pipeline: { $ref: "#/components/schemas/AgentAnalysisPipeline" }
    AgentPipelineMaterializeEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentPipelineMaterializeResult" }
        requestId: { type: string }
    AgentPipelineRetryResult:
      type: object
      additionalProperties: false
      required: [pipelineKey, retried, pipeline]
      properties:
        pipelineKey: { type: string, const: province-geography-v1 }
        retried: { type: integer, minimum: 0 }
        pipeline: { $ref: "#/components/schemas/AgentAnalysisPipeline" }
    AgentPipelineRetryEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/AgentPipelineRetryResult" }
        requestId: { type: string }
    AgentAssertionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AgentClassificationAssertion" }
        requestId: { type: string }
    AgentProviderUpdateInput:
      type: object
      additionalProperties: false
      required: [id, baseUrl, model]
      description: >-
        apiKey is accepted only on this write shape. apiKeyEnv, keyConfigured
        and every other unlisted field are rejected.
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        baseUrl:
          type: string
          format: uri
          description: HTTPS API root without userinfo, query, fragment, localhost or an IP literal.
        model: { type: string, minLength: 1, maxLength: 200 }
        timeoutMs: { type: integer, minimum: 1000, maximum: 300000, default: 60000 }
        dimensions:
          type: integer
          minimum: 1
          description: Required for embedding and rejected for chat.
        enabled: { type: boolean, default: true }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        authMode: { type: string, enum: [bearer, none], default: bearer }
        apiKey:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
          description: Never echoed, logged or exposed by a reveal endpoint.
        clearApiKey:
          type: boolean
          writeOnly: true
          description: Explicitly delete the stored key; cannot be true with apiKey.
    AgentEnvironmentProviderUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, source]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        source: { type: string, const: environment }
        providers:
          type: array
          maxItems: 0
          description: May be omitted or must be empty; environment provider definitions are deployment-owned.
    AgentDatabaseProviderUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, source, providers]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        source: { type: string, const: database }
        providers:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentProviderUpdateInput" }
    AgentProviderUpdateRequest:
      oneOf:
        - { $ref: "#/components/schemas/AgentEnvironmentProviderUpdateRequest" }
        - { $ref: "#/components/schemas/AgentDatabaseProviderUpdateRequest" }
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [consumerId, name]
      properties:
        consumerId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        environment: { type: string, enum: [live, test], default: live }
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 730
          default: 180
          description: Whole-day lifetime measured from server-side issuance time.
    ApiKeyMetadata:
      type: object
      required:
        - id
        - tenantId
        - consumerId
        - name
        - prefix
        - lastFour
        - environment
        - status
        - effectiveStatus
        - createdAt
        - expiresAt
        - revokedAt
        - lastUsedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: Non-secret display prefix; never sufficient for authentication.
        lastFour: { type: string, minLength: 4, maxLength: 4 }
        environment: { type: string, enum: [live, test] }
        status:
          type: string
          enum: [active, revoked]
          description: Persisted lifecycle state; expiry does not rewrite it.
        effectiveStatus:
          type: string
          enum: [active, expired, revoked]
          description: Runtime state after applying the exclusive expiresAt boundary.
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Exclusive authentication expiry.
        revokedAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    ApiKey:
      allOf:
        - { $ref: "#/components/schemas/ApiKeyMetadata" }
      unevaluatedProperties: false
    IssuedApiKey:
      allOf:
        - { $ref: "#/components/schemas/ApiKeyMetadata" }
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: "^mih_(live|test)_"
              description: One-time plaintext secret; never returned by list or revoke.
      unevaluatedProperties: false
    ApiKeyEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/ApiKey" }
        requestId: { type: string }
    IssuedApiKeyEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/IssuedApiKey" }
        requestId: { type: string }
    ApiKeyListEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
        requestId: { type: string }
    TelegramMonitorSharedConnection:
      type: object
      additionalProperties: false
      required: [host, database, username, password]
      description: >-
        One Admin-token-visible direct connection reused by both fixed inputs.
        schema/table/cursor/id are deliberately absent and injected as the
        fixed public Telegram Monitor business definition.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5432 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full], default: require }
    TelegramMonitorStoredSharedConnection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Admin-visible stored shared coordinates. Legacy seeded sources may
        expose dsnEnv until the first direct pipeline configuration.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: [string, "null"], minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        dsnEnv: { type: string, minLength: 1 }
        sourceContractId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          readOnly: true
          description: Internal source-installation generation bound into checkpoint compatibility.
    TelegramMonitorPipelinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        connection: { $ref: "#/components/schemas/TelegramMonitorSharedConnection" }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
    TelegramMonitorPipelineStatusRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, const: paused }
        - type: object
          additionalProperties: false
          required: [status, writerContractAttestation]
          properties:
            status: { type: string, const: active }
            writerContractAttestation:
              $ref: "#/components/schemas/TelegramMonitorWriterContractAttestationRequest"
    TelegramMonitorWriterContractAttestationRequest:
      type: object
      additionalProperties: false
      required: [confirmed, contractVersion, contractDigest]
      properties:
        confirmed: { type: boolean, const: true }
        contractVersion: { type: string, const: telegram-monitor.writer.v1 }
        contractDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
    TelegramMonitorWriterContractSummary:
      type: object
      additionalProperties: false
      required: [watermark, deletion, ordering, inputs]
      properties:
        watermark: { type: string }
        deletion: { type: string }
        ordering: { type: string }
        inputs:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [role, table, cursor]
            properties:
              role: { type: string, enum: [chats, messages] }
              table: { type: string, enum: [public.tg_monitor_chats, public.tg_monitor_messages] }
              cursor:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string }
    TelegramMonitorWriterContractAttestation:
      type: object
      additionalProperties: false
      required: [id, pipelineKey, contractVersion, contractDigest, contractSummary, attestedBy, attestedAt]
      properties:
        id: { type: string, format: uuid }
        pipelineKey: { type: string, const: telegram-monitor }
        contractVersion: { type: string, const: telegram-monitor.writer.v1 }
        contractDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        contractSummary: { $ref: "#/components/schemas/TelegramMonitorWriterContractSummary" }
        attestedBy: { type: string }
        attestedAt: { type: string, format: date-time }
    TelegramMonitorWriterContract:
      type: object
      additionalProperties: false
      required: [version, digest, summary, latestAttestation]
      properties:
        version: { type: string, const: telegram-monitor.writer.v1 }
        digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        summary: { $ref: "#/components/schemas/TelegramMonitorWriterContractSummary" }
        latestAttestation:
          oneOf:
            - { $ref: "#/components/schemas/TelegramMonitorWriterContractAttestation" }
            - { type: "null" }
    TelegramMonitorPipelineSyncRequest:
      type: object
      additionalProperties: false
      properties:
        batchSize: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
    TelegramMonitorPipelineTask:
      type: object
      additionalProperties: true
      required:
        - role
        - sourceKey
        - schema
        - table
        - cursorColumn
        - idColumn
        - builtInMappingVersion
        - builtInMappingAvailable
        - source
      properties:
        role: { type: string, enum: [chats, messages] }
        sourceKey: { type: string, enum: [telegram-monitor-chats, telegram-monitor-messages] }
        schema: { type: string, const: public }
        table: { type: string, enum: [tg_monitor_chats, tg_monitor_messages] }
        cursorColumn: { type: string, const: updated_at }
        idColumn: { type: string, enum: [chat_id, id] }
        builtInMappingVersion: { type: integer, const: 2 }
        builtInMappingAvailable: { type: boolean }
        source: { $ref: "#/components/schemas/ExternalSource" }
        activeMapping:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        cursor:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        latestRun:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        nextDueAt: { type: [string, "null"], format: date-time }
    TelegramMonitorPipeline:
      type: object
      additionalProperties: false
      required:
        - pipelineKey
        - displayName
        - builtInMappingVersion
        - status
        - connection
        - syncIntervalSeconds
        - configured
        - connectionConsistent
        - syncIntervalConsistent
        - inputContractsConsistent
        - configurationIssues
        - writerContract
        - tasks
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        displayName: { type: string, const: Telegram monitor }
        builtInMappingVersion: { type: integer, const: 2 }
        status: { type: string, enum: [active, paused, mixed] }
        connection:
          oneOf:
            - { $ref: "#/components/schemas/TelegramMonitorStoredSharedConnection" }
            - { type: "null" }
        syncIntervalSeconds: { type: [integer, "null"], minimum: 60, maximum: 86400 }
        configured: { type: boolean }
        connectionConsistent: { type: boolean }
        syncIntervalConsistent: { type: boolean }
        inputContractsConsistent: { type: boolean }
        configurationIssues:
          type: array
          items: { type: string }
        writerContract: { $ref: "#/components/schemas/TelegramMonitorWriterContract" }
        tasks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramMonitorPipelineTask" }
    TelegramMonitorPipelineEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramMonitorPipeline" }
        requestId: { type: string }
    TelegramSourceMigrationCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      description: >-
        One-request source owner or DDL credentials. They replace only the
        saved username/password while this preparation call runs and are never
        persisted or returned.
      properties:
        username: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    TelegramSourcePreparationRequest:
      type: object
      additionalProperties: false
      required: [confirmPipelineKey]
      properties:
        confirmPipelineKey: { type: string, const: telegram-monitor }
        migrationCredentials: { $ref: "#/components/schemas/TelegramSourceMigrationCredentials" }
    TelegramSourcePreparationCheck:
      type: object
      additionalProperties: false
      required: [key, status, message]
      properties:
        key: { type: string }
        status: { type: string, enum: [ready, needed, applied] }
        message: { type: string }
    TelegramSourcePreparationNotice:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    TelegramSourceUpdatedAtEvidence:
      type: object
      additionalProperties: false
      required: [exists, type, nullable, finite, ready]
      properties:
        exists: { type: boolean }
        type: { type: [string, "null"] }
        nullable: { type: [boolean, "null"] }
        finite: { type: boolean }
        ready: { type: boolean }
    TelegramSourceStableIdEvidence:
      type: object
      additionalProperties: false
      required: [exists, nullable, unique, ready]
      properties:
        exists: { type: boolean }
        nullable: { type: [boolean, "null"] }
        unique: { type: boolean }
        ready: { type: boolean }
    TelegramSourceTriggerEvidence:
      type: object
      additionalProperties: false
      required: [installed, enabledAlways, laterCompetingTriggers]
      properties:
        installed: { type: boolean }
        enabledAlways: { type: boolean }
        laterCompetingTriggers:
          type: array
          items: { type: string }
    TelegramSourceDeleteGuardEvidence:
      type: object
      additionalProperties: false
      required: [installed, enabledAlways]
      properties:
        installed: { type: boolean }
        enabledAlways: { type: boolean }
    TelegramSourceCursorIndexEvidence:
      type: object
      additionalProperties: false
      required: [exists, name, valid, ready, namedIndexExists]
      properties:
        exists: { type: boolean }
        name: { type: [string, "null"] }
        valid: { type: boolean }
        ready: { type: boolean }
        namedIndexExists: { type: boolean }
    TelegramSourcePreparationTable:
      type: object
      additionalProperties: false
      required:
        - role
        - table
        - idColumn
        - cursorIndexName
        - exists
        - oid
        - canAlter
        - stableId
        - updatedAt
        - trigger
        - deleteGuard
        - cursorIndex
        - ready
      properties:
        role: { type: string, enum: [chats, messages] }
        table: { type: string, enum: [public.tg_monitor_chats, public.tg_monitor_messages] }
        idColumn: { type: string, enum: [chat_id, id] }
        cursorIndexName: { type: string }
        exists: { type: boolean }
        oid: { type: [string, "null"] }
        canAlter: { type: boolean }
        stableId: { $ref: "#/components/schemas/TelegramSourceStableIdEvidence" }
        updatedAt: { $ref: "#/components/schemas/TelegramSourceUpdatedAtEvidence" }
        trigger: { $ref: "#/components/schemas/TelegramSourceTriggerEvidence" }
        deleteGuard: { $ref: "#/components/schemas/TelegramSourceDeleteGuardEvidence" }
        cursorIndex: { $ref: "#/components/schemas/TelegramSourceCursorIndexEvidence" }
        ready: { type: boolean }
    TelegramSourceInfrastructureEvidence:
      type: object
      additionalProperties: false
      required:
        - watermarkExists
        - watermarkStructureReady
        - watermarkRowReady
        - advanceFunctionExists
        - touchFunctionExists
        - deleteFunctionExists
        - ready
      properties:
        watermarkExists: { type: boolean }
        watermarkStructureReady: { type: boolean }
        watermarkRowReady: { type: boolean }
        advanceFunctionExists: { type: boolean }
        touchFunctionExists: { type: boolean }
        deleteFunctionExists: { type: boolean }
        ready: { type: boolean }
    TelegramSourcePreparation:
      type: object
      additionalProperties: false
      required:
        - pipelineKey
        - status
        - ready
        - applied
        - source
        - contract
        - permissions
        - tables
        - steps
        - warnings
        - sourceIdentityChanged
        - requiresCheckpointReset
        - checkpointResetReason
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        status: { type: string, enum: [ready, needs_prepare] }
        ready: { type: boolean }
        applied: { type: boolean }
        source:
          type: object
          additionalProperties: false
          required: [database, user, serverVersion, readOnly]
          properties:
            database: { type: [string, "null"] }
            user: { type: [string, "null"] }
            serverVersion: { type: [string, "null"] }
            readOnly: { type: boolean }
        contract:
          type: object
          additionalProperties: false
          required:
            - version
            - installedVersion
            - installedAt
            - generation
            - previousTableOids
            - infrastructure
          properties:
            version: { type: integer, const: 1 }
            installedVersion: { type: [integer, "null"] }
            installedAt: { type: [string, "null"], format: date-time }
            generation: { type: [string, "null"], pattern: "^[0-9a-f]{32}$" }
            previousTableOids:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [chats, messages]
                  properties:
                    chats: { type: [string, "null"] }
                    messages: { type: [string, "null"] }
                - { type: "null" }
            infrastructure: { $ref: "#/components/schemas/TelegramSourceInfrastructureEvidence" }
        permissions:
          type: object
          additionalProperties: false
          required: [canPrepare, isSuperuser, isDatabaseOwner, canCreateSchema, currentSessionWritable]
          properties:
            canPrepare: { type: boolean }
            isSuperuser: { type: boolean }
            isDatabaseOwner: { type: boolean }
            canCreateSchema: { type: boolean }
            currentSessionWritable: { type: boolean }
        tables:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramSourcePreparationTable" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TelegramSourcePreparationCheck" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/TelegramSourcePreparationNotice" }
        sourceIdentityChanged: { type: boolean }
        migrationAccountUsed: { type: boolean }
        requiresCheckpointReset: { type: boolean }
        checkpointResetReason: { type: [string, "null"] }
    TelegramSourcePreparationEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramSourcePreparation" }
        requestId: { type: string }
    TelegramMonitorProgressTask:
      type: object
      additionalProperties: false
      required:
        - role
        - sourceKey
        - totalRows
        - completedRows
        - remainingRows
        - percent
        - cursor
        - blocker
        - issues
        - checkedAt
      properties:
        role: { type: string, enum: [chats, messages] }
        sourceKey: { type: string, enum: [telegram-monitor-chats, telegram-monitor-messages] }
        totalRows: { type: integer, minimum: 0 }
        completedRows: { type: [integer, "null"], minimum: 0 }
        remainingRows: { type: [integer, "null"], minimum: 0 }
        percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        cursor:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        blocker: { type: [string, "null"], enum: [source_cursor_unconfigured, source_cursor_unsafe, null] }
        issues:
          type: array
          items: { type: string }
        checkedAt: { type: string, format: date-time }
    TelegramMonitorProgress:
      type: object
      additionalProperties: false
      required: [pipelineKey, checkedAt, totalRows, completedRows, remainingRows, percent, tasks]
      properties:
        pipelineKey: { type: string, const: telegram-monitor }
        checkedAt: { type: string, format: date-time }
        totalRows: { type: integer, minimum: 0 }
        completedRows: { type: [integer, "null"], minimum: 0 }
        remainingRows: { type: [integer, "null"], minimum: 0 }
        percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        tasks:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/TelegramMonitorProgressTask" }
    TelegramMonitorProgressEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/TelegramMonitorProgress" }
        requestId: { type: string }
    DirectPostgresConnection:
      type: object
      additionalProperties: false
      required: [host, database, username, password, table]
      description: >-
        Direct source connection. The password is plaintext catalog data and is
        visible only on the Admin-token source surface. cursorColumn/idColumn
        may remain absent while an unsafe source is paused.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5432 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full], default: require }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", default: public }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    LegacyDsnConnection:
      type: object
      additionalProperties: true
      required: [dsnEnv, schema, table]
      description: Existing-record compatibility only; new source requests use DirectPostgresConnection.
      properties:
        dsnEnv: { type: string, minLength: 1 }
        schema: { type: string }
        table: { type: string }
        cursorColumn: { type: string }
        idColumn: { type: string }
    StoredDirectPostgresConnection:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Admin-visible stored direct connection. A source migrated from the
        retired Provider registry is paused and may temporarily lack password;
        create requests still use DirectPostgresConnection and require it.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: [string, "null"], minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        sourceContractId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          readOnly: true
          description: Internal prepared-source generation used by checkpoint compatibility.
    DirectPostgresConnectionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial direct connection update; the server merges it with the saved connection and tests the complete candidate before saving.
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        database: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1 }
        sslMode: { type: string, enum: [disable, require, verify-ca, verify-full] }
        schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        table: { type: string, minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        cursorColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        idColumn: { type: [string, "null"], minLength: 1, maxLength: 63, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    DatabaseSourceCreate:
      type: object
      additionalProperties: false
      required: [sourceKey, displayName, sourceKind, connection]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sourceKind: { type: string, const: database }
        datasetId: { type: string, minLength: 1, maxLength: 200 }
        platform: { type: string, minLength: 1, maxLength: 100 }
        objectType: { type: string, minLength: 1, maxLength: 100 }
        connection: { $ref: "#/components/schemas/DirectPostgresConnection" }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 60 }
    FileSourceCreate:
      type: object
      additionalProperties: false
      required: [sourceKey, displayName, sourceKind]
      allOf:
        - if:
            required: [fileMode]
            properties:
              fileMode: { const: server_path }
          then:
            required: [serverPath]
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9][a-z0-9._-]*$" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sourceKind: { type: string, const: file }
        fileMode: { type: string, enum: [upload, server_path], default: upload }
        serverPath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Transient absolute path input required for server_path; never persisted or returned.
        datasetId: { type: string, minLength: 1, maxLength: 200 }
        platform: { type: string, minLength: 1, maxLength: 100, default: external }
        objectType: { type: string, minLength: 1, maxLength: 100, default: record }
        preferredRuleKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
    ExternalSourceCreate:
      oneOf:
        - $ref: "#/components/schemas/DatabaseSourceCreate"
        - $ref: "#/components/schemas/FileSourceCreate"
      discriminator:
        propertyName: sourceKind
    ExternalSourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        connection: { $ref: "#/components/schemas/DirectPostgresConnectionPatch" }
        status: { type: string, enum: [active, paused] }
        syncIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
    ExternalSource:
      type: object
      additionalProperties: true
      required: [sourceKey, sourceKind, status, connection]
      properties:
        id: { type: string, format: uuid }
        sourceKey: { type: string }
        displayName: { type: string }
        sourceKind: { type: string, enum: [database, file] }
        datasetId: { type: string }
        platform: { type: string }
        objectType: { type: string }
        status: { type: string, enum: [active, paused] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/StoredDirectPostgresConnection"
            - $ref: "#/components/schemas/LegacyDsnConnection"
            - $ref: "#/components/schemas/FileSourceLocator"
        syncIntervalSeconds: { type: [integer, "null"], minimum: 60, maximum: 86400 }
    ExternalSourceEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: "#/components/schemas/ExternalSource" }
        requestId: { type: string }
    SourceMappingCreate:
      type: object
      additionalProperties: false
      required: [fieldMap]
      allOf:
        - if:
            anyOf:
              - required: [schemaFingerprint]
              - required: [fileStructure]
              - required: [formatRuleVersionId]
          then:
            required: [schemaFingerprint, fileStructure]
      properties:
        fieldMap: { type: object, minProperties: 1, additionalProperties: true }
        origin: { type: string, minLength: 1, maxLength: 100, default: manual }
        agentModel: { type: [string, "null"] }
        agentConfidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        notes: { type: [string, "null"], maxLength: 4000 }
        schemaFingerprint: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        fileStructure: { type: [object, "null"], additionalProperties: true }
        formatRuleVersionId: { type: [string, "null"], format: uuid }
        selectedRuleKey:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
    FileSourceLocator:
      oneOf:
        - type: object
          additionalProperties: false
          required: [fileMode]
          properties:
            fileMode: { type: string, const: upload }
            preferredRuleKey: { type: string, pattern: "^[a-z0-9][a-z0-9._-]*$" }
        - type: object
          additionalProperties: false
          required: [fileMode, rootId, relativePath]
          properties:
            fileMode: { type: string, const: server_path }
            rootId: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
            relativePath: { type: string, minLength: 1, maxLength: 4096 }
            preferredRuleKey: { type: string, pattern: "^[a-z0-9][a-z0-9._-]*$" }
    ServerFilePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        serverPath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional transient override; omitted uses the source's stored locator.
        agent: { type: boolean, default: false }
        preferredRuleKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
    ServerFileImportRequest:
      type: object
      additionalProperties: false
      required: [expectedSha256]
      properties:
        serverPath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional transient override; omitted uses the source's stored locator.
        expectedSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [platform, query]
      properties:
        platform: { type: string, pattern: "^(?![Aa][Ll][Ll]$|\\*$)[A-Za-z0-9_:-]+$", description: One explicit platform; `all` (case-insensitive) and `*` are forbidden., example: xiaohongshu }
        query: { type: string, minLength: 1, maxLength: 500, description: Non-blank search query; surrounding whitespace is trimmed. }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor: { type: string, minLength: 1, maxLength: 8192, description: Non-blank opaque cursor returned by the previous page; send it unchanged. Telegram cursors are signed and bound to the normalized request. }
    NightAllLegacyOperationAvailability:
      type: object
      additionalProperties: false
      required: [supportedPlatforms, readyPlatforms]
      description: >-
        Hub-pinned, grant-filtered Night-All operation dispatch entry.
        readyPlatforms is always a subset of supportedPlatforms and means the
        deployed Hub contract permits dispatch. It is not populated by live
        Night-All discovery and does not prove handler, endpoint, provider,
        credential, or upstream health. A caller may dispatch only when its
        platform appears in both arrays.
      properties:
        supportedPlatforms:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        readyPlatforms:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
    NightAllLegacySearchCapabilities:
      type: object
      additionalProperties: false
      required: [contractVersion, operations]
      properties:
        contractVersion: { type: string, const: night-all.legacy-search-capabilities.v1 }
        operations:
          type: object
          additionalProperties: false
          required: [raw, crawl, user-info]
          properties:
            raw: { $ref: "#/components/schemas/NightAllLegacyOperationAvailability" }
            crawl: { $ref: "#/components/schemas/NightAllLegacyOperationAvailability" }
            user-info: { $ref: "#/components/schemas/NightAllLegacyOperationAvailability" }
    NightAllLegacyRequest:
      type: object
      additionalProperties: false
      required: [platform]
      description: >-
        Shared schema for the operation path parameter. The x-mx-operation-fields
        allowlists mirror runtime exactly: raw requires one singular string or
        plural string-array query field; crawl and user-info require a supported
        user/channel identifier. LinkedIn user-info requires complete /in/ personal
        profile URLs in url, profileUrl, profile_url, or urls; company URLs and bare
        slugs are rejected. Canonical decimal strings are
        accepted for the integer fields normalized by runtime. Server-owned routing and credential
        controls are rejected, including when nested in params.
      x-mx-common-fields: [businessId, business_id, platform, count, pageSize, limit, page, cursor, concurrency, params, includeRaw]
      x-mx-operation-fields:
        raw: [keyword, query, keywords, queries, disableAutoDetails, includeDetails, includeComments, commentLimit, cacheMaxAgeHours, maxEnrichItems, commentCursor, enrichConcurrency]
        crawl: [username, usernames, userId, userIds, user_id, uid, channelUrl, channel_url, channelId, channel_id, url, urls, activityTypes, cacheMaxAgeHours]
        user-info: [username, usernames, userId, userIds, user_id, uid, url, profileUrl, profile_url, urls]
      x-mx-rejected-params: [provider, endpoint, credential, token/auth, timeout, capability, moduleCode, archive, fullArchive, allTweets, archiveLimit, totalCount, max*Pages, pageCount, chunkSize, budget, crawlDepth, count, limit, pageSize, page, pageNumber, pageNo, concurrency, includeDetails, includeComments, disableAutoDetails, commentLimit, maxEnrichItems, enrichConcurrency, cacheMaxAgeHours]
      x-mx-params-limits:
        maxDepth: 8
        maxNodes: 1000
        maxStringLength: 8192
        arrayMaxItems: consumer effective platform maxPageSize
      x-mx-work-budget:
        maxRawQueries: 50
        maxCrawlIdentifiers: 50
        raw: queryCount * effective pageSize <= consumer effective platform maxPageSize
        crawl: identifierCount * effective pageSize * activityTypeCount <= consumer effective platform maxPageSize
        user-info: no multiplication rule; identifier collections remain bounded
        description: Bounds returned/processed item work; it is not a provider-call or billing-count claim because Night-All owns provider/token policy.
      properties:
        platform: { type: string, minLength: 1, maxLength: 64 }
        businessId: { type: string, maxLength: 128, description: When present, must equal the authenticated consumer businessId. }
        business_id: { type: string, maxLength: 128 }
        includeRaw: { type: boolean, enum: [false], description: Legacy false is accepted then removed before dispatch; true is rejected. }
        keyword: { type: string, minLength: 1, maxLength: 2048 }
        query: { type: string, minLength: 1, maxLength: 2048 }
        keywords: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
        queries: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
        username: { type: [string, number], minLength: 1, maxLength: 2048 }
        usernames: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
        userId: { type: [string, number], minLength: 1, maxLength: 2048 }
        userIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
        user_id: { type: [string, number], minLength: 1, maxLength: 2048 }
        uid: { type: [string, number], minLength: 1, maxLength: 2048 }
        channelUrl: { type: string, minLength: 1, maxLength: 2048 }
        channel_url: { type: string, minLength: 1, maxLength: 2048 }
        channelId: { type: [string, number], minLength: 1, maxLength: 2048 }
        channel_id: { type: [string, number], minLength: 1, maxLength: 2048 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        profileUrl: { type: string, minLength: 1, maxLength: 2048 }
        profile_url: { type: string, minLength: 1, maxLength: 2048 }
        urls: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 2048 } }
        count:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string, pattern: "^[1-9][0-9]*$" }
        pageSize:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string, pattern: "^[1-9][0-9]*$" }
        limit:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string, pattern: "^[1-9][0-9]*$" }
        page:
          oneOf:
            - { type: integer, minimum: 1, maximum: 1000 }
            - { type: string, pattern: "^(?:[1-9]|[1-9][0-9]{1,2}|1000)$" }
        cursor: { type: string, minLength: 1, maxLength: 8192 }
        concurrency:
          oneOf:
            - { type: integer, minimum: 1, maximum: 20 }
            - { type: string, pattern: "^(?:[1-9]|1[0-9]|20)$" }
        cacheMaxAgeHours: { type: number, minimum: 0, maximum: 720, description: raw and crawl only. }
        disableAutoDetails: { type: boolean }
        includeDetails: { type: boolean }
        includeComments: { type: boolean }
        commentLimit:
          oneOf:
            - { type: integer, minimum: 1, maximum: 100 }
            - { type: string, pattern: "^(?:[1-9]|[1-9][0-9]|100)$" }
        maxEnrichItems:
          oneOf:
            - { type: integer, minimum: 1, maximum: 20 }
            - { type: string, pattern: "^(?:[1-9]|1[0-9]|20)$" }
        commentCursor: { type: string, minLength: 1, maxLength: 8192 }
        enrichConcurrency:
          oneOf:
            - { type: integer, minimum: 1, maximum: 5 }
            - { type: string, pattern: "^[1-5]$" }
        activityTypes: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        params: { type: object, additionalProperties: true, description: Platform continuation values only. Rejected keys and workload overrides are listed by x-mx-rejected-params; nested strings are at most 8192 characters and arrays are bounded by the consumer effective platform maxPageSize. }
    NightAllLegacyEnvelope:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [raw_info, raw_data, page, meta]
          properties:
            raw_info: { type: string, contentMediaType: application/json, description: Night-All JSON-string array retained unchanged. }
            raw_data: { type: string, contentMediaType: application/json, description: Night-All JSON-string array retained unchanged. }
            page: { type: object, additionalProperties: true }
            meta: { type: object, additionalProperties: true }
        requestId: { type: string }
        traceId: { type: string }
    StoredSearchRequest:
      type: object
      additionalProperties: false
      required: [platform, query]
      properties:
        platform: { type: string, minLength: 1, maxLength: 64, description: One explicit granted platform; `all` and `*` are forbidden. }
        query: { type: string, minLength: 1, maxLength: 500 }
        datasetId: { type: string, minLength: 1, maxLength: 200, description: Optional exact logical filter; not a physical database or authorization grant. }
        objectType: { type: string, minLength: 1, maxLength: 100, description: Optional exact canonical object-type filter. }
        includeCandidates:
          type: string
          enum: [qualified, all]
          description: Valid only with explicit platform=public_opinion. qualified includes only status=qualified candidates and defaults the additional minQualityScore floor to 80; 0 does not reclassify rows. all requires from, to and at least one of province, countryCode or location; omit minQualityScore to retain unscored candidates.
        minQualityScore: { type: integer, minimum: 0, maximum: 100, description: Additional request floor valid only with includeCandidates=qualified or all; it does not change publication status or lower a record qualification threshold. }
        province: { type: string, minLength: 1, maxLength: 64, description: Exact ISO 3166-2:CN code or supported Chinese province name; valid only with explicit platform=public_opinion. }
        countryCode: { type: string, pattern: "^[A-Za-z]{2}$", description: Exact ISO 3166-1 alpha-2 country; valid only with explicit platform=public_opinion. }
        location: { type: string, minLength: 1, maxLength: 160, description: Exact normalized location label; valid only with explicit platform=public_opinion. }
        from: { type: string, format: date-time, description: Inclusive lower bound. Formal uses eventTime; an explicit candidate falls back to collectedAt when eventTime is absent. }
        to: { type: string, format: date-time, description: Inclusive upper bound; it must not be earlier than from. }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor: { type: string, minLength: 1, maxLength: 8192, description: HMAC-signed opaque cursor bound to the normalized query and filters; explicit public_opinion candidate controls join the binding. }
        type:
          type: string
          enum: [fresh, stable]
          default: fresh
          description: fresh searches current data and replays a committed retry for at most 120 seconds; stable replays the first response for this key indefinitely. Part of the idempotency fingerprint.
    CanonicalSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        platform: { type: string, minLength: 1, maxLength: 64, description: Optional exact platform filter; it must be granted. Omit it to search every currently granted platform. }
        datasetId: { type: string, minLength: 1, maxLength: 200, description: Optional exact logical dataset filter; never a physical source selector or authorization grant. }
        objectType: { type: string, minLength: 1, maxLength: 100, description: Optional exact canonical object-type filter. }
        includeCandidates:
          type: string
          enum: [qualified, all]
          description: Valid only with explicit platform=public_opinion. qualified includes only status=qualified candidates and defaults the additional minQualityScore floor to 80; 0 does not reclassify rows. all requires from, to and at least one of province, countryCode or location; omit minQualityScore to retain unscored candidates.
        minQualityScore: { type: integer, minimum: 0, maximum: 100, description: Additional request floor valid only with includeCandidates=qualified or all; it does not change publication status or lower a record qualification threshold. }
        province: { type: string, minLength: 1, maxLength: 64, description: Exact ISO 3166-2:CN code or supported Chinese province name; valid only with explicit platform=public_opinion. }
        countryCode: { type: string, pattern: "^[A-Za-z]{2}$", description: Exact ISO 3166-1 alpha-2 country; valid only with explicit platform=public_opinion. }
        location: { type: string, minLength: 1, maxLength: 160, description: Exact normalized location label; valid only with explicit platform=public_opinion. }
        from: { type: string, format: date-time, description: Inclusive lower bound. Formal uses eventTime; an explicit candidate falls back to collectedAt when eventTime is absent. }
        to: { type: string, format: date-time, description: Inclusive upper bound; it must not be earlier than from. }
        searchProfile:
          type: string
          enum: [canonical.balanced.v1, canonical.phrase.v1, canonical.terms-all.v1, canonical.zh-recall.v1, canonical.title-prefix.v1]
          default: canonical.balanced.v1
          description: Versioned server-owned search policy. The balanced default uses raw phrase OR all healthy HanLP/pre-segmented terms; degraded Jieba/bigram query terms cause an explicit phrase-only applied profile. Callers cannot supply arbitrary analysis settings or ES DSL.
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor: { type: string, minLength: 1, maxLength: 8192, description: HMAC-signed opaque cursor bound to query, filters, page size, resolved search profile, sort, sorted authorized platform scope and bounded first-page analysis state; explicit public_opinion candidate controls join the binding. }
        sort:
          type: string
          enum: [newest, oldest, relevance]
          default: newest
          description: Deterministic result order; every ordering ends on canonical id and is part of the cursor binding.
        type:
          type: string
          enum: [fresh, stable]
          default: fresh
          description: fresh searches current data and replays a committed retry for at most 120 seconds; stable replays the first response for this key indefinitely. Part of the idempotency fingerprint.
    StoredSearchEnvelope:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [contractVersion, source, query, filters, items, pageInfo, searchMode, warnings, durationMs]
          properties:
            contractVersion: { type: string, const: mx-insight-hub.stored-search.v1 }
            source: { type: string, const: hub }
            query: { type: string }
            filters:
              type: object
              additionalProperties: false
              required: [platform, datasetId, objectType]
              properties:
                platform: { type: string }
                datasetId: { type: [string, "null"] }
                objectType: { type: [string, "null"] }
                includeCandidates:
                  oneOf:
                    - { type: boolean, const: false }
                    - { type: string, enum: [qualified, all] }
                minQualityScore: { type: [integer, "null"], minimum: 0, maximum: 100 }
                province: { type: [string, "null"] }
                countryCode: { type: [string, "null"] }
                location: { type: [string, "null"] }
                from: { type: [string, "null"], format: date-time }
                to: { type: [string, "null"], format: date-time }
            items:
              type: array
              items: { $ref: "#/components/schemas/StoredSearchItem" }
            pageInfo: { $ref: "#/components/schemas/NightAllDataSearchPageInfo" }
            searchMode: { type: string, enum: [elasticsearch, postgres] }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/NightAllDataSearchWarning" }
            durationMs: { type: integer, minimum: 0 }
        requestId: { type: string, format: uuid }
    StoredSearchItem:
      type: object
      additionalProperties: false
      required: [id, datasetId, platform, objectType, source]
      properties:
        id: { type: string, format: uuid }
        datasetId: { type: string }
        platform: { type: string }
        objectType: { type: string }
        contentType: { type: [string, "null"] }
        externalId:
          type: string
