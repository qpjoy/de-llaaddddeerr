name: mx-device
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mx_device
      POSTGRES_USER: mx_device
      POSTGRES_PASSWORD_FILE: /run/mx-device-password
    ports: ["127.0.0.1:18894:5432"]
    volumes:
      - data:/var/lib/postgresql/data
      - ./.runtime/postgres-password:/run/mx-device-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx_device -d mx_device"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
  api:
    build: .
    image: mx-device:experimental
    pull_policy: never
    environment:
      MX_DEVICE_SKIP_STARTUP_MIGRATION: "1"
    # Fixed server-facing management port; database and PoC remain loopback-only.
    ports: ["0.0.0.0:18891:18891"]
    volumes: ["./.runtime/api.json:/run/mx-device.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18891/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
  worker:
    image: mx-device:experimental
    pull_policy: never
    environment:
      MX_DEVICE_WORKER_HEALTH_FILE: /tmp/mx-device-worker-instance
    command: ["node", "server/worker.mjs"]
    # Only this outbound-only process shares the Linux host network.
    # No USB mounts, Docker socket, ADB binary, privileged mode or listening port.
    network_mode: host
    volumes: ["./.runtime/worker.json:/run/mx-device.json:ro"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1m,mode=1777"]
    healthcheck:
      test: ["CMD", "node", "server/worker-health.mjs"]
      interval: 5s
      timeout: 4s
      retries: 12
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 140s
    mem_limit: 256m
    cpus: 0.5
  migrate:
    image: mx-device:experimental
    pull_policy: never
    profiles: [ops]
    command: ["node", "server/migrate.mjs"]
    volumes: ["./.runtime/api.json:/run/mx-device.json:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
volumes:
  data:
