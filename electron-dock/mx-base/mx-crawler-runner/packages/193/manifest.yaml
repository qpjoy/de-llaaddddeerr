manifest_version: '1.0'
project_id: '193'
source_id: '193'
name: Google Play
target_platform: Google Play
languages:
- Python
- Node.js
runtime:
  python: '>=3.11'
  additional: Node.js >=22
entrypoint:
  file: adapter.py
  callable: invoke
  command:
  - python
  - adapter.py
  input: 'stdin: one UTF-8 JSON object'
  output: 'stdout: one JSON object'
  logs: stderr; existing log files retained
  concurrency: one adapter process per request
dependency_files:
- pyproject.toml
- requirements.lock.txt
- upstream.lock.json
- src/mingxi_google_play/node/package.json
- src/mingxi_google_play/node/package-lock.json
credentials:
  required: false
  environment: []
  notes: 当前入口使用公开数据；具体访问限制和原生凭据配置见 README.legacy.md。
verification:
  adapter: 见 ADAPTER_VERIFICATION.json；与实时取数状态分开
  live: 未在本次整理中重新联网验收
  limits: 9 类查询已有真实记录；categories 未取数；无完整历史版本；需要 Node.js 22+。
request_schema:
  type: object
  required:
  - operation
  properties:
    operation:
      enum:
      - app
      - search
      - reviews
      - list
      - developer
      - suggest
      - similar
      - permissions
      - datasafety
      - categories
    params:
      type: object
      description: 参数结构按 operations 对应项校验；省略等价于空对象。
  additionalProperties: false
response_schema:
  type: object
  required:
  - schema_version
  - project_id
  - source_id
  - operation
  - observed_at
  - status
  - result
  - error
  properties:
    schema_version:
      const: '1.0'
    project_id:
      type: string
    source_id:
      type: string
    operation:
      type:
      - string
      - 'null'
    observed_at:
      type: string
      format: date-time
    status:
      enum:
      - success
      - no_data
      - partial
      - unknown
      - error
      - stopped
    result:
      type:
      - object
      - array
      - 'null'
      description: 原 SDK 完整 JSON 结果，保留来源、观察时间、告警、分页和错误；详见 README.legacy.md。
    error:
      type:
      - object
      - 'null'
      properties:
        code:
          type: string
  additionalProperties: false
