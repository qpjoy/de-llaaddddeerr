[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mingxi-market-216"
version = "0.1.0"
description = "Independent baidu application metadata collector"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["Scrapy==2.13.3", "Twisted==25.5.0", "json5==0.12.1", "xmltodict==1.0.2", "certifi==2026.7.22"]

[project.scripts]
mingxi-market-216 = "mingxi_market_216.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
