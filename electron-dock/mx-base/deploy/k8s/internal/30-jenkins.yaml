apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-base-jenkins
  namespace: mx-base
  labels:
    app.kubernetes.io/name: mx-base-jenkins
    app.kubernetes.io/part-of: mx-base
spec:
  replicas: 1
  # Recreate, not RollingUpdate: JENKINS_HOME is ReadWriteOnce and two
  # controllers writing the same home directory corrupts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-base-jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-base-jenkins
        app.kubernetes.io/part-of: mx-base
      annotations:
        # Restart the controller when the configuration changes. Without this a
        # `deploy` that only edits casc.yaml silently changes nothing.
        mx-base.qpjoy.dev/casc-checksum: "REPLACED_BY_MANAGE_SH"
    spec:
      serviceAccountName: mx-base-jenkins
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The image ships JENKINS_HOME owned by uid 1000; fsGroup makes a freshly
        # provisioned hostPath volume writable by it.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jenkins
          image: mx-base-jenkins:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: agent
              containerPort: 50000
          env:
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_config/casc.yaml
            - name: JENKINS_URL
              valueFrom:
                configMapKeyRef:
                  name: mx-base-jenkins-config
                  key: JENKINS_URL
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mx-base-secrets
                  key: JENKINS_ADMIN_PASSWORD
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: casc
              mountPath: /var/jenkins_config
              readOnly: true
          # Jenkins is slow to start and a liveness probe that fires during boot
          # produces a restart loop that looks like a crash. startupProbe gives
          # it room, then liveness takes over.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: mx-base-jenkins-home
        - name: casc
          configMap:
            name: mx-base-jenkins-casc
---
apiVersion: v1
kind: Service
metadata:
  name: mx-base-jenkins
  namespace: mx-base
  labels:
    app.kubernetes.io/part-of: mx-base
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-base-jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Agents connect here over JNLP. Separate from the HTTP Service because the two
# have different audiences: this one is only ever reached from inside the
# cluster, and giving it its own name keeps it out of the browser-facing path.
apiVersion: v1
kind: Service
metadata:
  name: mx-base-jenkins-agent
  namespace: mx-base
  labels:
    app.kubernetes.io/part-of: mx-base
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-base-jenkins
  ports:
    - name: agent
      port: 50000
      targetPort: agent
---
# Ops access from the intranet. Jenkins is deliberately not the daily interface
# — see docs/adr/0001. This port exists for build troubleshooting, and for the
# static Windows agent to reach the controller.
apiVersion: v1
kind: Service
metadata:
  name: mx-base-jenkins-external
  namespace: mx-base
  labels:
    app.kubernetes.io/part-of: mx-base
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mx-base-jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880
    - name: agent
      port: 50000
      targetPort: agent
      nodePort: 30500
