# Include INSIDE the existing hub.minsight-ai.com Internal server block.
# Host-network Hub pods can call 127.0.0.1:18200 directly.
#
# Include internal-upstreams.conf at http scope first (outside server blocks).

location ^~ /static/files/ {
    proxy_pass http://mx_static_reader;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 60s;
    access_log off; # signed preview query is a bearer capability
}

# Byte delivery, when MX_STATIC_ACCEL_REDIRECT=/internal-objects is set. The
# reader authorises the request and returns the header; nginx sends the file
# with sendfile() and handles Range and conditional requests itself, so the
# Node process never enters the byte path.
#
# `internal` means this location is unreachable from outside: only an
# X-Accel-Redirect from the reader can land here. Point alias at the SAME
# objects directory the containers mount, read-only.
location ^~ /internal-objects/ {
    internal;
    alias /srv/mx-static/data/objects/;
    sendfile on;
    tcp_nopush on;
    aio threads;
    # Eviction unlinks local objects. Cached open descriptors would retain the
    # deleted bytes on SSD after the archive has reported local=0.
    open_file_cache off;
    add_header x-content-type-options nosniff always;
    add_header content-security-policy "sandbox; default-src 'none'; frame-ancestors 'self'" always;
    access_log off;
}

location ^~ /static/v1/ {
    client_max_body_size 65m;
    proxy_pass http://mx_static_writer;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 60s;
}

# The settings console. Keep it off the public edge; reach it over the internal
# address or an SSH tunnel.
location = /static/admin {
    proxy_pass http://mx_static_writer;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location /static/ { return 404; }
