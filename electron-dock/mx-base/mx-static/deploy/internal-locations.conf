# Include INSIDE the existing hub.minsight-ai.com Internal server block.
# Host-network Hub pods can call 127.0.0.1:18200 directly.
location ^~ /static/files/ {
    proxy_pass http://127.0.0.1:18201;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 60s;
    access_log off; # signed preview query is a bearer capability
}
location ^~ /static/v1/ {
    client_max_body_size 65m;
    proxy_pass http://127.0.0.1:18200;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 60s;
}
location /static/ { return 404; }
