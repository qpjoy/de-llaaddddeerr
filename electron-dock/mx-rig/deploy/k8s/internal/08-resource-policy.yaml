apiVersion: v1
kind: ResourceQuota
metadata:
  name: mx-rig-budget
  namespace: mx-rig
  labels:
    app.kubernetes.io/part-of: mx-rig
spec:
  # Worst overlap: two servers during a rolling update + postgres + migrate
  # + one server-side runner Job (limits 4.75 CPU, 10.75Gi memory). A second
  # concurrent runner is not admitted even if the process-level guard
  # (MX_RIG_MAX_CONCURRENT_SERVER_RUNS) regresses.
  hard:
    requests.cpu: "3"
    limits.cpu: "5"
    requests.memory: 4Gi
    limits.memory: 11Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 18Gi
    requests.storage: 80Gi
    persistentvolumeclaims: "2"
    pods: "8"
    services: "4"
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mx-rig-container-limits
  namespace: mx-rig
  labels:
    app.kubernetes.io/part-of: mx-rig
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "2"
        memory: 8Gi
        ephemeral-storage: 14Gi
---
# Non-secret knobs, read at process start. manage.sh folds a digest of this
# file into the Pod template, so editing it rolls the server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mx-rig-resource-policy
  namespace: mx-rig
  labels:
    app.kubernetes.io/part-of: mx-rig
data:
  MX_RIG_MAX_CONCURRENT_SERVER_RUNS: "1"
  MX_RIG_WORKSPACE_SIZE_LIMIT: 10Gi
  MX_RIG_RUNNER_ARTIFACT_SIZE_LIMIT: 2Gi
  MX_RIG_RUNNER_CPU_REQUEST: "1"
  MX_RIG_RUNNER_CPU_LIMIT: "2"
  MX_RIG_RUNNER_MEMORY_REQUEST: 2Gi
  MX_RIG_RUNNER_MEMORY_LIMIT: 8Gi
  MX_RIG_RUNNER_EPHEMERAL_STORAGE_REQUEST: 2Gi
  MX_RIG_RUNNER_EPHEMERAL_STORAGE_LIMIT: 14Gi
  MX_RIG_ARTIFACT_MAX_FILE_BYTES: "536870912"
  MX_RIG_ARTIFACT_MAX_RUN_BYTES: "2147483648"
  MX_RIG_ARTIFACT_MAX_FILES_PER_RUN: "1000"
  MX_RIG_ARTIFACT_MAX_TOTAL_BYTES: "21474836480"
  MX_RIG_ARTIFACT_MAX_TOTAL_ENTRIES: "100000"
  MX_RIG_ARTIFACT_MIN_FREE_BYTES: "5368709120"
  MX_RIG_ARTIFACT_MIN_FREE_INODES: "10000"
  MX_RIG_SESSION_TTL_HOURS: "12"
  # Image for server-side Playwright runs (K8s Jobs). Keep it on the version
  # your suites lock; the same default as deploy/runner.Dockerfile.
  MX_RIG_RUNNER_IMAGE_PLAYWRIGHT: mcr.microsoft.com/playwright:v1.58.2-noble
