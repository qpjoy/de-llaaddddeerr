# The server creates one Kubernetes Job per server-side run, in this namespace
# only. Nothing else: no Secrets, no other namespaces, no cluster scope.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mx-rig-server
  namespace: mx-rig
  labels:
    app.kubernetes.io/part-of: mx-rig
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-rig-runner-jobs
  namespace: mx-rig
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-rig-runner-jobs
  namespace: mx-rig
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mx-rig-runner-jobs
subjects:
  - kind: ServiceAccount
    name: mx-rig-server
    namespace: mx-rig
