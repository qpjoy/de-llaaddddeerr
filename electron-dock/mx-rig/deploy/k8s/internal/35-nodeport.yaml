apiVersion: v1
kind: Service
metadata:
  name: mx-rig-server-external
  namespace: mx-rig
  labels:
    app.kubernetes.io/part-of: mx-rig
spec:
  type: NodePort
  # Single node. Local keeps the real peer address, so per-source login
  # budgets do not collapse every desktop behind the node IP.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: mx-rig-server
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30891
