# MX Rig on one machine: PostgreSQL, migrations, the server, and optionally a
# runner that executes web suites (profile "runner") and a station that
# replays procedure regression (profile "station").
#
# Use scripts/manage.sh up — it generates the secrets below into
# .runtime/compose.env on first run and keeps them. By hand:
#   docker compose -f deploy/compose.yaml --env-file .runtime/compose.env up -d
name: mx-rig
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mx_rig
      POSTGRES_USER: mx_rig
      POSTGRES_PASSWORD: ${MX_RIG_DB_PASSWORD:?set an independent database password}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx_rig -d mx_rig"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
  migrate:
    image: mx-rig-server:local
    build: { context: ../.., dockerfile: mx-rig/deploy/Dockerfile }
    command: ["node", "apps/server/migrate.mjs"]
    environment:
      MX_RIG_DATABASE_URL: postgresql://mx_rig:${MX_RIG_DB_PASSWORD}@postgres:5432/mx_rig
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 256m
    cpus: 0.5
  server:
    image: mx-rig-server:local
    # Built by the migrate service above; never looked up in a registry.
    pull_policy: never
    # Loopback by default. A shared test server sets MX_RIG_BIND=0.0.0.0 and
    # MX_RIG_PUBLIC_URL=http://<its LAN address>:8791 (manage.sh does both
    # with --lan).
    ports: ["${MX_RIG_BIND:-127.0.0.1}:${MX_RIG_HTTP_PORT:-8791}:8791"]
    environment:
      MX_RIG_STORE: postgres
      MX_RIG_DATABASE_URL: postgresql://mx_rig:${MX_RIG_DB_PASSWORD}@postgres:5432/mx_rig
      MX_RIG_ADMIN_TOKEN: ${MX_RIG_ADMIN_TOKEN:?set an independent admin token}
      MX_RIG_SECRET_KEY: ${MX_RIG_SECRET_KEY:?set an independent encryption key}
      MX_RIG_LAUNCHER_URL: ${MX_RIG_LAUNCHER_URL:-}
      MX_RIG_LAUNCHER_AUDIENCE: mx-sdk
      MX_RIG_PUBLIC_URL: ${MX_RIG_PUBLIC_URL:-http://127.0.0.1:8791}
      MX_RIG_SELF_URL: http://server:8791
      MX_RIG_MODEL_API_KEY: ${MX_RIG_MODEL_API_KEY:-}
      MX_RIG_MODEL_API_KEY_2: ${MX_RIG_MODEL_API_KEY_2:-}
      MX_RIG_SESSION_TTL_HOURS: ${MX_RIG_SESSION_TTL_HOURS:-12}
    volumes: ["control:/data/control", "artifacts:/data/artifacts"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
  runner:
    profiles: ["runner"]
    image: mx-rig-runner:local
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
      args: { PLAYWRIGHT_VERSION: "${MX_RIG_RUNNER_PLAYWRIGHT_VERSION:-1.58.2}" }
    # Enrolled once by manage.sh (a one-shot code from the admin session);
    # the runner's own token then lives only in this volume.
    volumes: ["runner:/runner"]
    depends_on: { server: { condition: service_healthy } }
    init: true
    shm_size: 1gb
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  station:
    profiles: ["station"]
    image: mx-rig-station:local
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/station.Dockerfile
      args: { PLAYWRIGHT_VERSION: "${MX_RIG_RUNNER_PLAYWRIGHT_VERSION:-1.58.2}" }
    # The browser work of procedure regression happens here, not in server.
    # Enrolled once by manage.sh; its token then lives only in this volume.
    environment:
      MX_RIG_SERVER: http://server:8791
      # The service is reached by its compose name, inside this network.
      MX_RIG_ALLOW_PRIVATE_HTTP: "1"
    volumes: ["station:/station"]
    depends_on: { server: { condition: service_healthy } }
    init: true
    shm_size: 1gb
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
volumes:
  postgres:
  control:
  artifacts:
  runner:
  station:
