apiVersion: batch/v1
kind: Job
metadata:
  name: mx-test-framework-migrate
  namespace: mx-test-framework
  labels:
    app.kubernetes.io/name: mx-test-framework-migrate
    app.kubernetes.io/part-of: mx-test-framework
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-test-framework-migrate
        app.kubernetes.io/part-of: mx-test-framework
    spec:
      restartPolicy: Never
      serviceAccountName: mx-test-framework
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: mx-test-framework:latest
          imagePullPolicy: IfNotPresent
          # Migrations take an advisory lock, so a retried deploy that overlaps
          # a still-running Job waits rather than interleaving DDL.
          command: ["node", "server/migrate.mjs"]
          env:
            - name: MXT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-test-framework-secrets
                  key: MXT_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
