apiVersion: v1
kind: ServiceAccount
metadata:
  name: mx-test-framework
  namespace: mx-test-framework
automountServiceAccountToken: false
---
# The server will create runner Jobs in P1. The permission is scoped to Jobs in
# its own namespace and nothing else — it never needs to read Secrets, list
# Pods cluster-wide, or touch another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-test-framework-runner
  namespace: mx-test-framework
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-test-framework-runner
  namespace: mx-test-framework
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mx-test-framework-runner
subjects:
  - kind: ServiceAccount
    name: mx-test-framework
    namespace: mx-test-framework
