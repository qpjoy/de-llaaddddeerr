apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mx-test-framework
  namespace: mx-test-framework
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mx-test-framework
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8790
          protocol: TCP
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL in the shared mx-common data plane.
    - ports:
        - port: 5432
          protocol: TCP
    # Kubernetes API (runner Jobs) and mx-launcher introspection.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
