apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mx-test-framework
# 15-postgres.yaml is deliberately absent. It is applied by `manage.sh deploy`
# only when MXT_DATABASE_URL is unset, because a deployment pointed at an
# external instance must not also get a second, unused database. Adding it here
# would make that choice impossible to express.
resources:
  - 00-namespace.yaml
  - 05-serviceaccount.yaml
  - 10-artifacts-pvc.yaml
  - 20-migration-job.yaml
  - 30-server.yaml
  - 35-nodeport.yaml
  - 40-network-policy.yaml
