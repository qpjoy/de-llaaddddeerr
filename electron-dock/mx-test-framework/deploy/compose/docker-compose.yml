# Local development stack. Not a production topology — the Internal deployment
# uses the shared mx-common PostgreSQL instance, not this throwaway container.
name: mx-test-framework

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mx_test
      POSTGRES_USER: mxtest
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxtest -d mx_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: mx-test-framework/Dockerfile
    command: ["node", "server/migrate.mjs"]
    environment:
      MXT_DATABASE_URL: postgres://mxtest:local-dev-only@postgres:5432/mx_test
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: mx-test-framework/Dockerfile
    environment:
      MXT_STORE: postgres
      MXT_DATABASE_URL: postgres://mxtest:local-dev-only@postgres:5432/mx_test
      MXT_ADMIN_TOKEN: local-admin-change-me
      MXT_ARTIFACTS_DIR: /data/artifacts
      MXT_PORT: "8790"
    ports:
      - "8790:8790"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  artifacts:
