apiVersion: v1
kind: ConfigMap
metadata:
  name: mx-launcher-internal-config
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "18090"
  LOG_LEVEL: info
  MX_ENVIRONMENT: shadow
  MX_SITE_ID: internal-main
  MX_SITE_ROLE: internal
  MX_ENABLED_MODULES: iam,app-center,config-center,deploy-center,release-center,artifact-center,runner-controller,test-center,audit-center,observability,sdk-gateway,launcher-network-control,hdi-compat,dns-control,edge-sync
  MX_PUBLIC_BASE_URL: https://shadow-d.example.com
  MX_INTERNAL_BASE_URL: http://mx-launcher-internal.mx-internal-shadow.svc.cluster.local:18090
  INTERNAL_STORE_DRIVER: postgres
  OBSERVABILITY_SINKS: "[]"
  RUNNER_DRY_RUN_DEFAULT: "1"
  SITE_SLOT_RUNNER_REMOTE_EXECUTION_ENABLED: "0"
  SITE_SLOT_SSH_PASSWORD_BOOTSTRAP_ENABLED: "0"
  SITE_SLOT_SSH_READONLY_PROBE_EXECUTE: "0"
  SITE_SLOT_DOMESTIC_WG_SECRET_EXPORT_ENABLED: "1"
  MX_INTERNAL_HOST_RUNNER_URL: http://host.docker.internal:19190
  MX_INTERNAL_HOST_RUNNER_K8S_URL: http://mx-internal-host-runner.mx-internal-shadow.svc.cluster.local:19190
  MX_INTERNAL_HOST_RUNNER_K8S_ENSURE_ENABLED: "1"
  MX_INTERNAL_HOST_RUNNER_K8S_NAMESPACE: mx-internal-shadow
  MX_INTERNAL_HOST_RUNNER_K8S_NAME: mx-internal-host-runner
  MX_INTERNAL_HOST_RUNNER_IMAGE: qpjoy/mx-launcher-server:shadow
  MX_SITE_SLOT_SSH_KEY_DIR: /app/artifacts/ssh
  AWX_BASE_URL: http://mx-awx-service.mx-awx.svc.cluster.local
  AWX_ORGANIZATION: MX Internal
  AWX_PROJECT: mx-launcher-site-slots
  AWX_API_CREDENTIAL_SYNC_ENABLED: "0"
  AWX_API_OBJECT_SYNC_ENABLED: "0"
  AWX_API_LAUNCH_ENABLED: "0"
  COREDNS_K8S_APPLY_ENABLED: "1"
  COREDNS_K8S_ALLOWED_NAMESPACE: mx-dns
  COREDNS_K8S_ALLOWED_CONFIGMAP_NAME: coredns
