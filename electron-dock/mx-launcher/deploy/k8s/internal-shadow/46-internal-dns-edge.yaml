apiVersion: v1
kind: ConfigMap
metadata:
  name: mx-internal-dns-edge
  namespace: mx-dns
  labels:
    app.kubernetes.io/name: mx-internal-dns-edge
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: internal-dns-edge
    mx.qpjoy.com/environment: shadow
data:
  Corefile: |
    .:50053 {
      bind 0.0.0.0
      errors
      log
      cache 30
      forward . mx-internal-coredns.mx-dns.svc.cluster.local:53 {
        policy sequential
        health_check 5s
      }
      reload
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mx-internal-dns-edge
  namespace: mx-dns
  labels:
    app.kubernetes.io/name: mx-internal-dns-edge
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: internal-dns-edge
    mx.qpjoy.com/environment: shadow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-internal-dns-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-internal-dns-edge
        app.kubernetes.io/part-of: mx-3ks
        mx.qpjoy.com/component: internal-dns-edge
        mx.qpjoy.com/environment: shadow
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coredns
          image: coredns/coredns:1.11.3
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 50053
              protocol: UDP
            - name: dns-tcp
              containerPort: 50053
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: coredns-config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: coredns-config
          configMap:
            name: mx-internal-dns-edge
