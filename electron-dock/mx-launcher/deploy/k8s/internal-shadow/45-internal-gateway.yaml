apiVersion: v1
kind: ConfigMap
metadata:
  name: mx-internal-gateway-caddy
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-internal-gateway
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: internal-gateway
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :18090 {
      bind 0.0.0.0
      encode zstd gzip
      header {
        X-MX-Gateway internal-k8s-host-gateway
      }
      @domesticEdge {
        remote_ip 10.88.0.1
        header X-MX-Forwarded-By domestic-edge
      }
      handle @domesticEdge {
        reverse_proxy mx-launcher-internal.mx-internal-shadow.svc.cluster.local:18090 {
          header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
        }
      }
      handle {
        reverse_proxy mx-launcher-internal.mx-internal-shadow.svc.cluster.local:18090 {
          header_up X-Forwarded-For {remote_host}
          header_up -X-MX-Forwarded-By
        }
      }
    }

    # mx-gateway-optional-port-80:start
    :80 {
      bind 0.0.0.0
      encode zstd gzip
      header {
        X-MX-Gateway internal-app-gateway
      }
      handle {
        respond "MX Internal gateway route not found\n" 404
      }
    }
    # mx-gateway-optional-port-80:end

    :8008 {
      bind 0.0.0.0
      encode zstd gzip
      header {
        X-MX-Gateway internal-app-gateway-fallback
      }
      handle {
        respond "MX Internal gateway route not found\n" 404
      }
    }
  mx-gateway-routes.json: |
    {
      "environment": "shadow",
      "siteId": "internal-main",
      "gatewayPort": 80,
      "routeCount": 0,
      "routes": []
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-internal-gateway-configmap-writer
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-internal-gateway-configmap-writer
    app.kubernetes.io/part-of: mx-3ks
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["mx-internal-gateway-caddy"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["mx-internal-gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-launcher-internal-gateway-writer
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal-gateway-writer
    app.kubernetes.io/part-of: mx-3ks
subjects:
  - kind: ServiceAccount
    name: mx-launcher-internal
    namespace: mx-internal-shadow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mx-internal-gateway-configmap-writer
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mx-internal-gateway
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-internal-gateway
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: internal-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-internal-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-internal-gateway
        app.kubernetes.io/part-of: mx-3ks
        mx.qpjoy.com/component: internal-gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gateway
          image: caddy:2.8.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              source_config=/etc/caddy-source/Caddyfile
              runtime_config=/tmp/mx-internal-gateway.Caddyfile
              if awk 'NR > 1 { split($2, address, ":"); if (toupper(address[2]) == "0050" && $4 == "0A") found=1 } END { exit found ? 0 : 1 }' /proc/net/tcp /proc/net/tcp6 2>/dev/null; then
                echo "host port 80 is already in use; starting Internal gateway on fallback port 8008"
                awk '
                  function brace_delta(line, copy, count) {
                    copy = line
                    count = gsub(/\{/, "{", copy)
                    copy = line
                    count -= gsub(/\}/, "}", copy)
                    return count
                  }
                  /mx-gateway-optional-port-80:start/ { skip=1; next }
                  /mx-gateway-optional-port-80:end/ { skip=0; next }
                  skip_unmarked {
                    depth += brace_delta($0)
                    if (depth <= 0) skip_unmarked=0
                    next
                  }
                  /^[[:space:]]*:80[[:space:]]*\{/ {
                    skip_unmarked=1
                    depth = brace_delta($0)
                    if (depth <= 0) skip_unmarked=0
                    next
                  }
                  !skip { print }
                ' "$source_config" >"$runtime_config"
              else
                cp "$source_config" "$runtime_config"
              fi
              exec caddy run --config "$runtime_config" --adapter caddyfile
          ports:
            - name: http
              containerPort: 18090
              hostPort: 18090
              protocol: TCP
            - name: app-http
              containerPort: 80
              protocol: TCP
            - name: app-fallback
              containerPort: 8008
              hostPort: 8008
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy-source
              readOnly: true
      volumes:
        - name: caddy-config
          configMap:
            name: mx-internal-gateway-caddy
