apiVersion: batch/v1
kind: Job
metadata:
  name: mx-launcher-migrate
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-migrate
    app.kubernetes.io/part-of: mx-3ks
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-launcher-migrate
        app.kubernetes.io/part-of: mx-3ks
    spec:
      restartPolicy: Never
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              db_host="${DATABASE_HOST:-${MX_INTERNAL_POSTGRES_SERVICE_HOST:-mx-internal-postgres.mx-internal-shadow.svc.cluster.local}}"
              echo "using postgres host: ${db_host}"
              until pg_isready -h "$db_host" -p 5432 -U "$PG_USER" -d "$PG_DB"; do
                echo "waiting for postgres readiness: ${db_host}:5432"
                sleep 2
              done
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_USER
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_DB
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_HOST
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_PASSWORD
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
      containers:
        - name: migrate
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: Never
          command:
            - sh
            - -ec
            - |
              db_host="${DATABASE_HOST:-${MX_INTERNAL_POSTGRES_SERVICE_HOST:-mx-internal-postgres.mx-internal-shadow.svc.cluster.local}}"
              echo "running migrations against ${db_host}:5432/${PG_DB}"
              exec node dist/src/migrate.js
          envFrom:
            - configMapRef:
                name: mx-launcher-internal-config
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_DB
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_HOST
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
