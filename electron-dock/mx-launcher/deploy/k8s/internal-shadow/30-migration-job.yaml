apiVersion: batch/v1
kind: Job
metadata:
  name: mx-launcher-migrate
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-migrate
    app.kubernetes.io/part-of: mx-3ks
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-launcher-migrate
        app.kubernetes.io/part-of: mx-3ks
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/src/migrate.js
          envFrom:
            - configMapRef:
                name: mx-launcher-internal-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
