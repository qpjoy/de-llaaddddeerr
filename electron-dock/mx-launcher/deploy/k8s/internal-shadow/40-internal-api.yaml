apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-launcher-internal-ssh
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-launcher-site-slots
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-launcher-internal
  ports:
    - name: http
      port: 18090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-launcher-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-launcher-internal
        app.kubernetes.io/part-of: mx-3ks
    spec:
      serviceAccountName: mx-launcher-internal
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: seed-site-slot-artifacts
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /app/runtime-artifacts/site-slots
              if [ ! -f /app/runtime-artifacts/site-slots/domestic/manifest.json ]; then
                cp -a /app/artifacts/site-slots/. /app/runtime-artifacts/site-slots/
              fi
          volumeMounts:
            - name: site-slots
              mountPath: /app/runtime-artifacts/site-slots
      containers:
        - name: internal-api
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 18090
          envFrom:
            - configMapRef:
                name: mx-launcher-internal-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: internal-ssh
              mountPath: /app/artifacts/ssh
            - name: site-slots
              mountPath: /app/runtime-artifacts/site-slots
      volumes:
        - name: internal-ssh
          persistentVolumeClaim:
            claimName: mx-launcher-internal-ssh
        - name: site-slots
          persistentVolumeClaim:
            claimName: mx-launcher-site-slots
