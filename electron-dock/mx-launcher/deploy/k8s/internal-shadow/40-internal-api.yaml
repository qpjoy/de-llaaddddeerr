apiVersion: v1
kind: Service
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-launcher-internal
  ports:
    - name: http
      port: 18090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-launcher-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-launcher-internal
        app.kubernetes.io/part-of: mx-3ks
    spec:
      containers:
        - name: internal-api
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18090
          envFrom:
            - configMapRef:
                name: mx-launcher-internal-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
