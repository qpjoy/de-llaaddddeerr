apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-launcher-internal-ssh
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-launcher-release-artifacts
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-launcher-site-slots
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-launcher-internal
  ports:
    - name: http
      port: 18090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-launcher-internal
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-launcher-internal
    app.kubernetes.io/part-of: mx-3ks
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-launcher-internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-launcher-internal
        app.kubernetes.io/part-of: mx-3ks
    spec:
      serviceAccountName: mx-launcher-internal
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: seed-site-slot-artifacts
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /app/runtime-artifacts/site-slots
              if [ ! -f /app/runtime-artifacts/site-slots/domestic/manifest.json ]; then
                cp -a /app/artifacts/site-slots/. /app/runtime-artifacts/site-slots/
              fi
          volumeMounts:
            - name: site-slots
              mountPath: /app/runtime-artifacts/site-slots
      containers:
        - name: internal-api
          image: qpjoy/mx-launcher-server:shadow
          imagePullPolicy: Never
          command:
            - sh
            - -ec
            - |
              db_host="${DATABASE_HOST:-${MX_INTERNAL_POSTGRES_SERVICE_HOST:-mx-internal-postgres.mx-internal-shadow.svc.cluster.local}}"
              export DATABASE_URL="postgres://${PG_USER}:${PG_PASSWORD}@${db_host}:5432/${PG_DB}"
              echo "starting internal api against ${db_host}:5432/${PG_DB}"
              exec node dist/src/index.js
          ports:
            - name: http
              containerPort: 18090
          envFrom:
            - configMapRef:
                name: mx-launcher-internal-config
            - secretRef:
                name: mx-release-oss
                optional: true
          env:
            - name: SITE_SLOT_RUNNER_REMOTE_EXECUTION_ENABLED
              value: "1"
            - name: SITE_SLOT_WORKER_REMOTE_SSH
              value: "1"
            - name: SITE_SLOT_CONFIRM_REMOTE_EXECUTION
              value: "1"
            - name: MX_RELEASE_ARTIFACT_STORE_DIR
              value: /app/artifacts/release-center
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_DB
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_HOST
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: DATABASE_URL
                  optional: true
            - name: MX_FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: mx-feishu-oauth
                  key: app-id
                  optional: true
            - name: MX_FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: mx-feishu-oauth
                  key: app-secret
                  optional: true
            - name: MX_FEISHU_ALLOWED_TENANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: mx-feishu-oauth
                  key: tenant-keys
                  optional: true
            - name: MX_INTERNAL_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mx-internal-ops
                  key: token
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: internal-ssh
              mountPath: /app/artifacts/ssh
            - name: release-artifacts
              mountPath: /app/artifacts/release-center
            - name: site-slots
              mountPath: /app/runtime-artifacts/site-slots
      volumes:
        - name: internal-ssh
          persistentVolumeClaim:
            claimName: mx-launcher-internal-ssh
        - name: release-artifacts
          persistentVolumeClaim:
            claimName: mx-launcher-release-artifacts
        - name: site-slots
          persistentVolumeClaim:
            claimName: mx-launcher-site-slots
