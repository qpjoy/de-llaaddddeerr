apiVersion: v1
kind: Service
metadata:
  name: mx-internal-postgres
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-internal-postgres
    app.kubernetes.io/part-of: mx-3ks
spec:
  selector:
    app.kubernetes.io/name: mx-internal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mx-internal-postgres
  namespace: mx-internal-shadow
  labels:
    app.kubernetes.io/name: mx-internal-postgres
    app.kubernetes.io/part-of: mx-3ks
spec:
  serviceName: mx-internal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-internal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-internal-postgres
        app.kubernetes.io/part-of: mx-3ks
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mx-launcher-db
                  key: PG_DB
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: mx-internal-postgres
          app.kubernetes.io/part-of: mx-3ks
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
