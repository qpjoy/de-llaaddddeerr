apiVersion: v1
kind: Namespace
metadata:
  name: mx-dns
  labels:
    app.kubernetes.io/name: mx-dns
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/environment: shadow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: mx-dns
  labels:
    app.kubernetes.io/name: coredns
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: dns-control
    mx.qpjoy.com/environment: shadow
data:
  Corefile: |
    internal.mx:53 {
      errors
      log
      hosts {
        10.88.88.88 internal.mx gateway.internal.mx dns.internal.mx service-peer.internal.mx
        10.88.0.1 domestic-relay.internal.mx
        fallthrough
      }
      rewrite name exact host-runner.internal.mx mx-internal-host-runner.mx-internal-shadow.svc.cluster.local
      cache 30
      reload
      forward . /etc/resolv.conf
    }
    corp.mx:53 {
      errors
      log
      cache 30
      reload
      forward . /etc/resolv.conf
    }
    h2i.mx:53 {
      errors
      log
      cache 30
      reload
      forward . /etc/resolv.conf
    }
    .:53 {
      errors
      cache 30
      reload
      forward . /etc/resolv.conf
    }
  mx-zone-snapshot.json: "{}"
---
apiVersion: v1
kind: Service
metadata:
  name: mx-internal-coredns
  namespace: mx-dns
  labels:
    app.kubernetes.io/name: mx-internal-coredns
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: dns-authority
    mx.qpjoy.com/environment: shadow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mx-internal-coredns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-internal-coredns
  namespace: mx-dns
  labels:
    app.kubernetes.io/name: mx-internal-coredns
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/component: dns-authority
    mx.qpjoy.com/environment: shadow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-internal-coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-internal-coredns
        app.kubernetes.io/part-of: mx-3ks
        mx.qpjoy.com/component: dns-authority
        mx.qpjoy.com/environment: shadow
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.11.3
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: coredns-config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: coredns-config
          configMap:
            name: coredns
