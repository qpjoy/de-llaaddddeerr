apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: mx-awx
  namespace: mx-awx
  labels:
    app.kubernetes.io/name: mx-awx
    app.kubernetes.io/part-of: mx-3ks
    mx.qpjoy.com/role: execution-provider
spec:
  service_type: clusterip
  web_resource_requirements:
