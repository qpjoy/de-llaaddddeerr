apiVersion: v1
kind: Service
metadata:
  name: mx-auto-server-external
  namespace: mx-auto
  labels:
    app.kubernetes.io/part-of: mx-auto
spec:
  type: NodePort
  # V0 deploys only on one node. Local preserves the real peer address so
  # per-source auth budgets do not collapse every desktop behind the node IP.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: mx-auto-server
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30880
