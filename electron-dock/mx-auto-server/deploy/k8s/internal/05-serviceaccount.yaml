apiVersion: v1
kind: ServiceAccount
metadata:
  name: mx-auto-server
  namespace: mx-auto
  labels:
    app.kubernetes.io/part-of: mx-auto
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-auto-runner-jobs
  namespace: mx-auto
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-auto-runner-jobs
  namespace: mx-auto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mx-auto-runner-jobs
subjects:
  - kind: ServiceAccount
    name: mx-auto-server
    namespace: mx-auto
