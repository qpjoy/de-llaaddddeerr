services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg-mihomo-wireguard
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SERVERURL: ${WG_SERVER_HOST}
      SERVERPORT: ${WG_SERVER_PORT}
      PEERS: ${WG_PEERS}
      PEERDNS: ${WG_PEER_DNS}
      INTERNAL_SUBNET: ${WG_INTERNAL_SUBNET}
      ALLOWEDIPS: ${WG_ALLOWEDIPS}
      PERSISTENTKEEPALIVE_PEERS: ${WG_KEEPALIVE_PEERS}
      LOG_CONFS: ${WG_LOG_CONFS}
    volumes:
      - ./data/wireguard:/config
    ports:
      - "${WG_SERVER_PORT}:51820/udp"
    networks:
      - wg_stack
    restart: unless-stopped

  subscriptions:
    image: caddy:2-alpine
    container_name: wg-mihomo-subscriptions
    restart: unless-stopped
    ports:
      - "${WG_EXPORT_FALLBACK_PORT}:8080"
    environment:
      WG_EXPORT_SITE_ADDRESS: ${WG_EXPORT_SITE_ADDRESS}
      WG_EXPORT_USER: ${WG_EXPORT_USER}
      WG_EXPORT_PASSWORD_HASH: ${WG_EXPORT_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/subscriptions:/srv/wg:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
    networks:
      - wg_stack

networks:
  wg_stack:
    driver: bridge
    ipam:
      config:
        - subnet: ${WG_STACK_SUBNET}
          gateway: ${WG_STACK_GATEWAY}
