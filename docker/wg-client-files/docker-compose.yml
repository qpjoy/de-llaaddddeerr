services:
  wg-client-files:
    image: caddy:2-alpine
    container_name: wg-client-files
    restart: unless-stopped
    ports:
      - "${WG_EXPORT_PORT:-8080}:8080"
    environment:
      WG_EXPORT_USER: ${WG_EXPORT_USER}
      WG_EXPORT_PASSWORD_HASH: ${WG_EXPORT_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WG_EXPORT_DIR}:/srv/wg:ro
