<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>MX HDO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="status-panel">
      <div class="topbar">
        <div>
          <div class="brand">MX HDO</div>
          <div class="brand-subtitle" id="hdo-server-label">正在准备服务</div>
        </div>
        <span class="status-chip" id="hdo-status-chip">检测中</span>
      </div>

      <div class="connection">
        <div>
          <h1 id="hdo-connection-title">正在检测安全访问</h1>
          <p id="hdo-status-detail">点击连接当前线路后启用内网访问。</p>
        </div>
        <div class="connection-actions">
          <button id="btn-hdo-disconnect" class="button button--danger" hidden>断开当前网络</button>
          <button id="btn-hdo-anon-connect" class="button button--primary">连接当前线路</button>
          <button id="btn-hdo-refresh" class="button">刷新</button>
        </div>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <span>当前线路</span>
          <strong id="hdo-mode">-</strong>
        </div>
        <div class="metric">
          <span>分配地址</span>
          <strong id="hdo-overlay">-</strong>
        </div>
        <div class="metric">
          <span>连接状态</span>
          <strong id="hdo-wg">-</strong>
        </div>
        <div class="metric">
          <span>系统域名</span>
          <strong id="hdo-system-domain">-</strong>
        </div>
      </div>

      <div class="update-banner" id="hdo-update-banner" hidden>
        <strong>发现新版本</strong>
        <span id="hdo-update-text">请按提示完成更新。</span>
      </div>
    </section>

    <section class="login-panel">
      <div class="section-head">
        <div>
          <h2>登录切换账号网段</h2>
          <p>登录会从匿名网段切换到账号网段，并优先使用 H2I 快速模式。</p>
        </div>
      </div>

      <div class="login-grid">
        <label class="field">
          <span>用户名</span>
          <input id="hdo-account-id" type="text" autocomplete="username" placeholder="用户名 / 邮箱 / 手机号" />
        </label>
        <label class="field">
          <span>密码</span>
          <span class="password-control">
            <input id="hdo-account-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
            <button id="btn-hdo-toggle-password" class="password-toggle" type="button">显示</button>
          </span>
        </label>
        <button id="btn-hdo-account-connect" class="button button--accent">登录切换网段</button>
      </div>

      <p class="login-hint" id="hdo-login-hint">未登录也可以使用匿名线路；登录会在断开状态下切换到账号网段。</p>
    </section>

    <details class="advanced-panel">
      <summary>高级功能</summary>
      <div class="advanced-content">
        <div class="advanced-grid">
          <label class="field">
            <span>HDO 服务地址</span>
            <input id="hdo-server-url" type="url" placeholder="https://hdo.example.com" />
          </label>
          <label class="field">
            <span>内部地址</span>
            <input id="hdo-test-url" type="text" placeholder="http://delta.mxinfo-inc.cn" />
          </label>
          <label class="field">
            <span>Relay 模式</span>
            <select id="hdo-relay-mode">
              <option value="mesh-h2i">Mesh H2I</option>
            </select>
          </label>
        </div>

        <div class="advanced-actions">
          <button id="btn-hdo-save-settings" class="button">保存配置</button>
          <button id="btn-hdo-switch-anonymous" class="button button--secondary">切回匿名网络</button>
          <button id="btn-hdo-anon-config" class="button">同步匿名配置</button>
          <button id="btn-hdo-account-config" class="button">同步账号配置</button>
          <button id="btn-hdo-repair-dns" class="button button--secondary">修复 DNS 优先级</button>
          <button id="btn-hdo-open-test" class="button">打开内部地址</button>
          <button id="btn-hdo-check-updates" class="button">检查更新</button>
          <button id="btn-hdo-stop" class="button button--danger">断开当前网络</button>
          <button id="btn-market-new" class="button">打开市场管理</button>
          <button id="btn-market" class="button">进入市场页面</button>
        </div>

        <pre id="hdo-output" class="console">等待连接状态...</pre>
      </div>
    </details>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
